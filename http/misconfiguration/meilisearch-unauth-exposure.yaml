id: meilisearch-unauth-exposure

info:
  name: Meilisearch Unauthenticated Index Exposure
  author: HaroonArshad-53
  severity: medium
  description: |
    Meilisearch ships with no master key by default, and instances deployed
    without one expose the index API to anyone on the network. An
    unauthenticated GET to /indexes returns the full index listing, and the
    same unauthenticated access allows searching the documents inside those
    indexes. Set a master key (MEILI_MASTER_KEY) to close this off.
  reference:
    - https://www.meilisearch.com/docs/reference/api/overview
    - https://www.meilisearch.com/docs/learn/security/master_key
  metadata:
    verified: true
    max-request: 1
    vendor: meilisearch
    product: meilisearch
    shodan-query: http.html:"Meilisearch"
  tags: meilisearch,exposure,misconfig,unauth,search

http:
  - method: GET
    path:
      - "{{BaseURL}}/indexes"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "\"results\":")'
          - 'contains(body, "\"offset\":")'
          - 'contains(body, "\"limit\":")'
          - 'contains(body, "\"total\":")'
        condition: and
