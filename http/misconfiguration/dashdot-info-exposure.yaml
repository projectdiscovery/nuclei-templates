id: dashdot-info-exposure

info:
  name: Dashdot - Server Information Exposure
  author: HaroonArshad-53
  severity: medium
  description: |
    Dashdot is a self-hosted server dashboard that ships with no authentication by design, and its backend serves an unauthenticated /info endpoint returning static host information: operating system and kernel details, CPU brand and model, memory and storage layout, network interface details including the public IP, and the running Dashdot version. Any unauthenticated visitor to an internet-facing instance can read this host inventory without a credential.
  impact: |
    The response discloses the host's operating system, kernel, CPU, storage and network configuration, including the public IP address, giving an attacker a ready-made inventory for targeted exploitation.
  remediation: |
    Do not expose Dashdot on a public interface. Put it behind an authenticated reverse proxy, a VPN, or network-level access control, as the application itself provides no login mechanism.
  reference:
    - https://github.com/MauriceNino/dashdot
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    vendor: dashdot
    product: dashdot
    shodan-query: http.html:"dashdot"
    fofa-query: body="dashdot"
  tags: dashdot,exposure,misconfig,discovery,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}/info"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"dash_version"'
          - '"dash_buildhash"'
        condition: or

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
