---
id: dashdot-info-exposure

info:
  name: Dashdot Server Info Exposure
  author: HaroonArshad-53
  severity: medium
  description: |
    Dashdot is a self-hosted server dashboard that ships with no authentication
    by design, and its backend serves an unauthenticated /info endpoint that
    returns static host information: operating system and kernel details, CPU
    brand and model, memory and storage layout, network interface details
    including the public IP, and the running Dashdot version. Any
    unauthenticated visitor to an internet-facing instance can read this
    host inventory without any credential.
  impact: |
    The response discloses the host's operating system, kernel, CPU, storage
    and network configuration, including the public IP address, which gives an
    attacker a ready-made inventory for targeted exploitation of that host.
  remediation: |
    Do not expose Dashdot on a public interface. Put it behind an
    authenticated reverse proxy, a VPN, or network-level access control, as the
    application itself provides no login mechanism.
  reference:
    - https://github.com/MauriceNino/dashdot
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: dashdot
    product: dashdot
  tags: dashdot,exposure,misconfig,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/info"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"dash_version"'
          - '"dash_buildhash"'
        condition: or

      - type: status
        status:
          - 200
---
