id: ollama-api-unauth-exposure

info:
  name: Ollama Local LLM API - Unauthenticated Exposure
  author: amanxplore
  severity: high
  description: Detects publicly accessible Ollama API endpoints allowing unauthenticated model enumeration and generation.
  remediation: Bind Ollama service to 127.0.0.1 or enforce authentication proxy.
  reference:
    - https://github.com/ollama/ollama
  tags: misconfig,ollama,ai,llm,unauth,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}:11434/api/tags"
      - "{{BaseURL}}/api/tags"
      - "{{BaseURL}}:11434/api/version"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"models"'
          - '"name"'
        condition: and\n