id: milvus-unauth-webui

info:
  name: Milvus Attu Web UI - Unauthenticated Exposure
  author: amanxplore
  severity: high
  description: Detects exposed Attu management Web UI for Milvus vector database.
  remediation: Restrict access to Attu UI port (3000/8000) using firewall rules.
  reference:
    - https://github.com/milvus-io/attu
  tags: misconfig,milvus,attu,vectordb,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}:3000/"
      - "{{BaseURL}}/attu/"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "Attu"
          - "Milvus"
        condition: and\n