id: firebase-auth-config-exposure

info:
  name: Firebase Auth - Public Configuration Exposure
  author: amanxplore
  severity: low
  description: Detects exposed Firebase authentication configuration objects containing apiKey, authDomain, and projectId.
  remediation: Ensure sensitive API keys and rules are properly secured in Firebase Console.
  reference:
    - https://firebase.google.com/docs/auth
  tags: misconfig,firebase,exposure,auth

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/js/app.js"
      - "{{BaseURL}}/static/js/main.js"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "apiKey"
          - "authDomain"
          - "projectId"
        condition: and\n