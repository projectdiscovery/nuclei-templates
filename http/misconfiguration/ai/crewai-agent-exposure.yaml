id: crewai-agent-exposure

info:
  name: CrewAI Multi-Agent Endpoint Exposure
  author: amanxplore
  severity: medium
  description: Detects publicly exposed CrewAI multi-agent REST endpoints.
  remediation: Implement authentication middleware on agent REST routers.
  reference:
    - https://github.com/crewAIInc/crewAI
  tags: misconfig,crewai,ai,agent,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}/crew/status"
      - "{{BaseURL}}/api/crew"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "crew"
          - "agents"
        condition: and\n