id: anythingllm-unauth-api

info:
  name: AnythingLLM - Unauthenticated System Info API
  author: amanxplore
  severity: medium
  description: Detects unauthenticated AnythingLLM workspace and system info endpoints.
  remediation: Require user login and authentication tokens.
  reference:
    - https://github.com/Mintplex-Labs/anything-llm
  tags: misconfig,anythingllm,ai,llm,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/system/env-dump"
      - "{{BaseURL}}/api/v1/ping"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "AnythingLLM"
          - "online"
        condition: or\n