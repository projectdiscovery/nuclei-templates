id: open-webui-unauth-detect

info:
  name: Open-WebUI Instance - Public Fingerprint
  author: amanxplore
  severity: info
  description: Detects publicly accessible Open-WebUI self-hosted interfaces for local and cloud LLMs.
  remediation: Ensure authentication is required and user registration is restricted.
  reference:
    - https://github.com/open-webui/open-webui
  tags: tech,open-webui,ai,llm,panel

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/api/config"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "Open WebUI"
          - "WEBUI_BUILD_HASH"
        condition: or\n