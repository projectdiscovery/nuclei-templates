id: dify-unauth-api-detect

info:
  name: Dify AI Platform - Unauthenticated API Endpoint
  author: amanxplore
  severity: high
  description: Detects unauthenticated Dify AI application platform API endpoints.
  remediation: Configure authentication headers for public Dify endpoints.
  reference:
    - https://github.com/langgenius/dify
  tags: misconfig,dify,ai,rag,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}/v1/site"
      - "{{BaseURL}}/v1/parameters"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "app_id"
          - "user_input_form"
        condition: or\n