id: searxng-ai-search-api

info:
  name: SearXNG Meta Search Engine - Exposed JSON API
  author: amanxplore
  severity: info
  description: Detects exposed SearXNG meta search engine instances commonly used by AI RAG agents.
  remediation: Limit search rate limits or restrict JSON API format if unintended.
  reference:
    - https://github.com/searxng/searxng
  tags: tech,searxng,osint,search,ai,rag

http:
  - method: GET
    path:
      - "{{BaseURL}}/search?q=test&format=json"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"query": "test"'
          - '"results":'
        condition: and\n