id: qdrant-unauth-api

info:
  name: Qdrant Vector Search Engine - Unauthenticated API
  author: amanxplore
  severity: high
  description: Detects exposed Qdrant vector database REST API endpoints allowing unauthenticated vector search and collection deletion.
  remediation: Set service.api_key in Qdrant config yaml.
  reference:
    - https://github.com/qdrant/qdrant
  tags: misconfig,qdrant,vectordb,ai,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}/collections"
      - "{{BaseURL}}:6333/collections"
      - "{{BaseURL}}/telemetry"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"result":'
          - '"collections":'
        condition: and\n