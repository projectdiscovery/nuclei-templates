id: open-interpreter-api

info:
  name: Open-Interpreter Server API Exposure
  author: amanxplore
  severity: critical
  description: Detects exposed Open-Interpreter HTTP server API allowing unauthenticated code execution.
  remediation: Secure Open-Interpreter instance with authentication key.
  reference:
    - https://github.com/OpenInterpreter/open-interpreter
  tags: misconfig,open-interpreter,ai,rce,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}/history"
      - "{{BaseURL}}:8000/history"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "interpreter"
          - "messages"
        condition: or\n