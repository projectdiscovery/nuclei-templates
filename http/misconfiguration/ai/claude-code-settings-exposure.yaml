id: claude-code-settings-exposure

info:
  name: Claude Code Configuration File Exposure
  author: amanxplore
  severity: medium
  description: Detects publicly exposed .claude/settings.json configuration files in web root.
  remediation: Prevent web server from serving dotfiles (.claude directory).
  reference:
    - https://docs.anthropic.com
  tags: misconfig,claude,exposure,ai,dotfile

http:
  - method: GET
    path:
      - "{{BaseURL}}/.claude/settings.json"
      - "{{BaseURL}}/.claude.json"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "permissions"
          - "allowedTools"
        condition: or\n