id: vllm-openai-api-exposure

info:
  name: vLLM Inference Server - Unauthenticated API
  author: amanxplore
  severity: high
  description: Detects unauthenticated vLLM inference server endpoints exposing OpenAI-compatible endpoints.
  remediation: Restrict access via API key middleware or firewall rules.
  reference:
    - https://github.com/vllm-project/vllm
  tags: misconfig,vllm,ai,llm,inference,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}/v1/models"
      - "{{BaseURL}}:8000/v1/models"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"object": "list"'
          - '"vllm"'
        condition: or\n