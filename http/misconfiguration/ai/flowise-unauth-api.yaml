id: flowise-unauth-api

info:
  name: Flowise AI - Unauthenticated API Exposure
  author: amanxplore
  severity: high
  description: Detects unauthenticated Flowise AI instances exposing chatflows and API keys.
  remediation: Set FLOWISE_USERNAME and FLOWISE_PASSWORD environment variables.
  reference:
    - https://github.com/FlowiseAI/Flowise
  tags: misconfig,flowise,ai,unauth,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/chatflows"
      - "{{BaseURL}}/api/v1/stats"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "id"
          - "name"
          - "flowData"
        condition: and\n