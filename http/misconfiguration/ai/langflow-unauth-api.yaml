id: langflow-unauth-api

info:
  name: Langflow AI Builder - Unauthenticated API Exposure
  author: amanxplore
  severity: high
  description: Detects unauthenticated Langflow API instances allowing workflow inspection and execution.
  remediation: Enable AUTO_LOGIN=false and require authentication credentials.
  reference:
    - https://github.com/langflow-ai/langflow
  tags: misconfig,langflow,ai,workflow,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/flows"
      - "{{BaseURL}}/api/v1/version"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"version"'
          - '"flows"'
        condition: or\n