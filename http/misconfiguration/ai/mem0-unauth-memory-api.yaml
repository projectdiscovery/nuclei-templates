id: mem0-unauth-memory-api

info:
  name: mem0 AI Memory Layer - Unauthenticated API Exposure
  author: amanxplore
  severity: high
  description: Detects unauthenticated mem0 AI memory layer API endpoints exposing user context and memories.
  remediation: Enforce API Key authentication in mem0 configuration (CVE-2026-59705).
  reference:
    - https://github.com/mem0ai/mem0
  tags: misconfig,mem0,ai,memory,unauth,cve

http:
  - method: GET
    path:
      - "{{BaseURL}}/v1/memories/"
      - "{{BaseURL}}/v1/users/"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "memories"
          - "user_id"
        condition: or\n