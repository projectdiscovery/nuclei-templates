id: ray-cluster-unauth-api

info:
  name: Ray AI Cluster - Unauthenticated Dashboard API
  author: amanxplore
  severity: critical
  description: Detects unauthenticated Ray AI cluster dashboard API endpoints exposing cluster status and job execution capabilities (CVE-2023-48022).
  remediation: Secure the Ray dashboard port (8265) behind an authenticating proxy or firewall.
  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2023-48022
  classification:
    cwe-id: CWE-306
  tags: cve,cve2023,ray,ai,unauth,rce,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}:8265/api/version"
      - "{{BaseURL}}/api/version"
      - "{{BaseURL}}:8265/api/jobs/"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"ray"'
          - '"version"'
        condition: and\n