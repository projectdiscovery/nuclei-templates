id: chromadb-unauth-api

info:
  name: ChromaDB Vector Database - Unauthenticated API Exposure
  author: amanxplore
  severity: high
  description: Detects publicly exposed unauthenticated ChromaDB vector database instances.
  remediation: Enable token-based authentication or restrict access via security groups.
  reference:
    - https://github.com/chroma-core/chroma
  tags: misconfig,chromadb,vectordb,ai,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/version"
      - "{{BaseURL}}:8000/api/v1/version"
      - "{{BaseURL}}/api/v1/heartbeat"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "nanosecond heartbeat"
          - "chromadb"
        condition: or\n