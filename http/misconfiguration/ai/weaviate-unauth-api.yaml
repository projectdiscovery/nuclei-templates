id: weaviate-unauth-api

info:
  name: Weaviate Vector Database - Unauthenticated Meta Endpoint
  author: amanxplore
  severity: high
  description: Detects unauthenticated Weaviate vector database REST API instances.
  remediation: Enable OIDC or API Key authentication in Weaviate configuration.
  reference:
    - https://github.com/weaviate/weaviate
  tags: misconfig,weaviate,vectordb,ai,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}/v1/meta"
      - "{{BaseURL}}:8080/v1/meta"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"hostname"'
          - '"version"'
          - '"weaviate"'
        condition: or\n