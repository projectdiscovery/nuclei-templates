id: audiobookshelf-installer

info:
  name: Audiobookshelf - Installer
  author: s4e-io
  severity: high
  description: |
    Detected Audiobookshelf server had not been initialized and no root user existed, allowing unauthenticated users to create the root account through the /init endpoint and gain full control of the server and its libraries.
  reference:
    - https://github.com/advplyr/audiobookshelf
    - https://github.com/advplyr/audiobookshelf/blob/v2.38.0/server/Server.js#L368-L390
  classification:
    cpe: cpe:2.3:a:audiobookshelf:audiobookshelf:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    vendor: audiobookshelf
    product: audiobookshelf
    shodan-query: http.title:"Audiobookshelf"
    fofa-query: title="Audiobookshelf"
  tags: misconfig,exposure,install,audiobookshelf,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/status"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"app\":\"audiobookshelf\"", "\"isInit\":false", "\"ConfigPath\"")'
        condition: and

    extractors:
      - type: json
        json:
          - '.serverVersion'
