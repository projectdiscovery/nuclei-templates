id: http-etcd-unauthenticated-api-v3

info:
  name: etcd v3 Unauthenticated API
  author: x3lfyn
  severity: high
  description: etcd v3 API is exposed.
  metadata:
    max-request: 1
  tags: misconfig,unauth,etcd,exposure

http:
  - id: check-auth-status
    method: POST
    path:
      - "{{BaseURL}}/v3/auth/status"
    headers:
      Content-Type: application/json
    body: "{}"
    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"enabled":true'
        negative: true
      - type: word
        words:
          - "authRevision"
      - type: status
        status:
          - 200
