id: polycom-soundstation-default-login

info:
  name: Polycom SoundStation - Default Login
  author: mr-pmillz
  severity: high
  description: |
    Polycom SoundStation phones may retain default administrator or user credentials for their web interface.
    This template checks access to the authentication page using known default credential pairs.
  impact: |
    An attacker can access phone configuration with the permissions of the compromised account.
  remediation: |
    Replace the default administrator and user passwords and restrict web management access to trusted hosts.
  reference:
    - https://support.ringcentral.com/article-v2/Default-Username-Password-Polycom-Phones.html
    - https://h30434.www3.hp.com/t5/Poly-Phones-Knowledge-Base/FAQ-What-is-the-warning-indication-triangle-exclamation-mark/ta-p/9510744
  classification:
    cwe-id: CWE-1392
  metadata:
    vendor: polycom
    product: soundstation
  tags: default-login,polycom,soundstation,voip,intrusive

http:
  - raw:
      - |
        GET /auth.htm HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (X11; Linux x86_64; rv:102.0) Gecko/20100101 Firefox/102.0
        Authorization: Basic {{base64(username + ':' + password)}}
    payloads:
      username:
        - Polycom
        - Admin
        - User
        - User
      password:
        - "456"
        - "456"
        - "123"
        - ""
    attack: pitchfork
    stop-at-first-match: false
    matchers-condition: or
    matchers:
      - type: status
        status:
          - 200
