id: star-printer-default-login

info:
  name: Star Micronics TSP100III Printer - Default Login
  author: mr-pmillz
  severity: medium
  description: |
    Star Micronics TSP100III printers may retain the default root/public credentials for their web configuration utility.
  impact: |
    An attacker can access the printer's configuration utility and modify network settings.
  remediation: |
    Change the root account's default password and restrict access to the printer's configuration interface to trusted hosts.
  reference:
    - https://starmicronics.com/help-center/knowledge-base/how-to-assign-a-static-ip-address-to-an-ethernet-or-wi-fi-printer/
  classification:
    cwe-id: CWE-1392
  metadata:
    vendor: starmicronics
    product: tsp100iii
  tags: default-login,star,starmicronics,printer,tsp100iii,intrusive

http:
  - raw:
      - |
        GET /html/main.htm HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}

    payloads:
      username:
        - root
      password:
        - public
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "logged_in"

      - type: status
        status:
          - 200
