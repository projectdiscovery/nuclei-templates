id: engenius-default-login

info:
  name: EnGenius Wireless Access Point - Default Login
  author: mr-pmillz
  severity: high
  description: |
    EnGenius wireless access points accept the default admin/admin credentials when the administrator password has not been changed.
  impact: |
    An attacker can access the management interface and modify wireless network and device settings.
  remediation: |
    Set a unique administrator password and limit access to the management interface to trusted administrative hosts.
  reference:
    - https://doctorengenius.engeniustech.com/en/articles/6708892-what-is-the-default-ip-username-and-password-for-engenius-devices
  classification:
    cwe-id: CWE-1392
  metadata:
    vendor: engenius
    product: wireless_access_point
  tags: default-login,engenius,wireless,intrusive

http:
  - raw:
      - |
        POST /cgi-bin/luci HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Origin: {{BaseURL}}
        Referer: {{RootURL}}/cgi-bin/luci

        page=login&username={{username}}&password={{password}}

    payloads:
      username:
        - admin
      password:
        - admin
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'sysauth'

      - type: status
        status:
          - 302
