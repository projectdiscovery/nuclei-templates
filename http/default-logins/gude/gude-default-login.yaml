id: gude-default-login

info:
  name: GUDE - Default Login
  author: Bretss,BENZOOgatag
  severity: high
  description: GUDE 2301 and 2302 default administrator or user login credentials (admin:admin or user:user) were detected.
  reference:
    - https://media.distrelec.com/Web/Downloads/_m/an/Gude_2302-1_ger_man.pdf
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 2
    shodan-query: http.html:"Expert Net Control"
    fofa-query: body="Expert Net Control"
  tags: gude,default-login

http:
  - raw:
      - |
        GET /ov.html HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}

    attack: clusterbomb
    payloads:
      username:
        - admin
        - user
      password:
        - admin
        - user

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Control Panel"
          - "Output Port"
        condition: and

      - type: status
        status:
          - 200
