id: litellm-default-login

info:
  name: LiteLLM - Default Login
  author: icarot
  severity: high
  description: |
    LiteLLM enables default admin credential. An attacker can execute unauthorized operations.
  reference:
    - https://github.com/BerriAI/litellm
  metadata:
    max-request: 1
    shodan-query: http.html:"LiteLLM"
  tags: litellm,default-login,misconfig

variables:
  username: admin
  password: sk-1234

http:
  - raw:
      - |
        POST /v2/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}"}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"redirect_url":'
          - '"token":'
        condition: and

      - type: word
        part: content_type
        words:
          - 'application/json'

      - type: status
        status:
          - 200

    extractors:
      - type: json
        name: token
        json:
          - '.token'
