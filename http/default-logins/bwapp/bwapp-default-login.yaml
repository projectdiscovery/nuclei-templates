id: bwapp-default-login

info:
  name: bWAPP Default Login
  author: ayoubbuilds
  severity: critical
  description: bWAPP (buggy Web Application) is a deliberately vulnerable test application for security training. The default credentials (bee:bug) are part of the intended security testing scenario and grant access to all vulnerable modules.
  reference:
    - https://itsecgames.com/
  classification:
    cwe-id: CWE-798
  metadata:
    max-request: 1
  tags: bwapp,default-login,vuln

http:
  - raw:
      - |
        POST /login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Connection: close

        login={{username}}&password={{password}}&form=login

    payloads:
      username:
        - bee
      password:
        - bug
    attack: pitchfork

    host-redirects: true
    matchers:
      - type: word
        words:
          - "Welcome Bee"
