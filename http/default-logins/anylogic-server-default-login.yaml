id: anylogic-server-default-login

info:
  name: AnyLogic Team License Server - Default Login
  author: mr-pmillz
  severity: high
  description: |
    AnyLogic Team License Server accepts the default admin/admin credentials when its administrator account has not been secured.
  impact: |
    An attacker can access license usage information and administrative license server settings.
  remediation: |
    Change the administrator credentials in the server's conf/serv.properties file, keep needLogin=True, and restrict network access to the server console.
  reference:
    - https://www.anylogic.com/upload/activation-guides/activation_of_anylogic_university_server_license.pdf
  classification:
    cwe-id: CWE-1392
  metadata:
    verified: true
    max-request: 1
    shodan-query: 'http.html:"AnyLogic Team License Server"'
    fofa-query: 'body="AnyLogic Team License Server"'
    vendor: anylogic
    product: team_license_server
  tags: default-login,anylogic,license-server,intrusive

variables:
  username: admin
  password: admin

http:
  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        un={{url_encode(username)}}&pw={{url_encode(password)}}&login=Sign+in

    host-redirects: true
    max-redirects: 1
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "AnyLogic Team License Server"
          - "Sign out"
        condition: and

      - type: status
        status:
          - 200
