id: gargoyle-router-detect

info:
  name: Gargoyle Router Management Utility - Detect
  author: K3ysTr0K3R
  severity: info
  description: |
    Detected Gargoyle router management interfaces.
  reference:
    - https://www.gargoyle-router.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Gargoyle Router Management Utility"
    fofa-query: title="Gargoyle Router Management Utility"
  tags: tech,router,gargoyle,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Gargoyle Router Management Utility</title>"
          - "gargoyle"
        condition: and

      - type: status
        status:
          - 200
