id: gargoyle-router-detect

info:
  name: Gargoyle Router Detection
  author: K3ysTr0K3R
  severity: info
  description: Detects Gargoyle router management interfaces.
  metadata:
    max-request: 1
  tags: tech,router,gargoyle,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Gargoyle Router Management Utility</title>"

      - type: status
        status:
          - 200
