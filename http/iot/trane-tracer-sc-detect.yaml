id: trane-tracer-sc-detect

info:
  name: Trane Tracer SC/SC+ - Detect
  author: pjoaquin
  severity: info
  description: |
    Detects Trane Tracer SC and Tracer SC+ building automation controllers via the
    Evox XML endpoint /evox/about, which returns server name, product, firmware
    version, kernel and hardware serial number without authentication.
  reference:
    - https://nmap.org/nsedoc/scripts/http-trane-info.html
  classification:
    cpe: cpe:2.3:h:trane:tracer_sc:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: trane
    product: tracer_sc
  tags: trane,tracer,ics,iot,hvac,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/evox/about"

    host-redirects: false

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - 'xmlns:trane="trane:evox"'
          - 'name="serverName"'
        condition: and

    extractors:
      - type: regex
        name: product
        group: 1
        regex:
          - 'name="productName" val="([^"]*)"'

      - type: regex
        name: version
        group: 1
        regex:
          - 'name="productVersion" val="([^"]*)"'

      - type: regex
        name: serial
        group: 1
        regex:
          - 'name="hardwareSerialNumber" val="([^"]*)"'
