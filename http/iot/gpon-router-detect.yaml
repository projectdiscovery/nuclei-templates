id: gpon-router-detect

info:
  name: GPON Home Gateway - Detect
  author: K3ysTr0K3R
  severity: info
  description: |
    GPON home gateway device was detected. The "GPON Home Gateway" interface string belongs to Dasan-licensed firmware that is rebranded by many ISPs worldwide.
  reference:
    - https://www.vpnmentor.com/blog/critical-vulnerability-gpon-router
    - https://nvd.nist.gov/vuln/detail/CVE-2018-10562
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:dasannetworks:gpon_router_firmware:-:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: dasannetworks
    product: gpon_router_firmware
    shodan-query:
      - http.title:"GPON Home Gateway"
      - title:"GPON Home Gateway"
    fofa-query: title="GPON Home Gateway"
  tags: tech,gpon,router,iot,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>\s*GPON Home Gateway\s*</title>'

      - type: status
        status:
          - 200
          - 401
