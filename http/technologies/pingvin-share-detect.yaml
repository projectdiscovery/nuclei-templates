id: pingvin-share-detect

info:
  name: Pingvin Share - Detect
  author: rxerium
  severity: info
  description: |
    Pingvin Share is an open-source, self-hosted file-sharing platform.
  reference:
    - https://github.com/stonith404/pingvin-share
  metadata:
    verified: true
    max-request: 1
    vendor: stonith404
    product: pingvin_share
    shodan-query: http.title:"Pingvin Share"
  tags: tech,detect,pingvin-share

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '<title>[^<]*Pingvin Share[^<]*</title>'

      - type: word
        part: body
        words:
          - 'content="An open-source and self-hosted sharing platform."'

      - type: status
        status:
          - 200
