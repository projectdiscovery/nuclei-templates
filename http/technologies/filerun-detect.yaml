id: filerun-detect

info:
  name: FileRun - Detect
  author: rxerium
  severity: info
  description: |
    FileRun is a self-hosted file management and sharing platform.
  reference:
    - https://filerun.com/
  metadata:
    verified: true
    max-request: 1
    vendor: filerun
    product: filerun
    shodan-query: http.title:"FileRun"
  tags: tech,filerun,file-sharing,storage,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<meta name=\"application-name\" content=\"FileRun\">"

      - type: regex
        part: body
        regex:
          - "(?i)<title>[^<]*FileRun[^<]*</title>"

      - type: status
        status:
          - 200
