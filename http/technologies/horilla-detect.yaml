id: horilla-detect

info:
  name: Horilla - Detect
  author: rxerium
  severity: info
  description: |
    Horilla is an open-source human resource management system.
  reference:
    - https://www.horilla.com/
    - https://github.com/horilla-opensource/horilla
  metadata:
    verified: true
    max-request: 1
    vendor: horilla
    product: horilla
    shodan-query: http.title:"Login - Horilla Dashboard"
  tags: tech,horilla,hrms,hcm,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Login - Horilla Dashboard</title>'
          - "/static/build/css/style.min.css"
          - "@horilla.com"
        condition: and

      - type: status
        status:
          - 200
