id: kener-detect

info:
  name: Kener - Detect
  author: rxerium
  severity: info
  description: |
    Kener, an open-source service status page and incident management system, was detected.
  reference:
    - https://kener.ing/
    - https://github.com/rajnandan1/kener
  metadata:
    verified: true
    max-request: 1
    vendor: rajnandan1
    product: kener
    shodan-query: http.title:"Kener - Open source status page system"
  tags: tech,kener,status,incident-management,monitoring,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>Kener - (?:Open source )?status page system</title>'

      - type: word
        part: body
        words:
          - 'id="kener-app-favicon"'
          - 'og:site_name" content="Kener"'
        condition: and

      - type: status
        status:
          - 200
