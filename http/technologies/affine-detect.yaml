id: affine-detect

info:
  name: AFFiNE - Detect
  author: rxerium
  severity: info
  description: |
    AFFiNE is an open-source, self-hostable knowledge base and collaborative workspace.
  reference:
    - https://affine.pro/
    - https://github.com/toeverything/AFFiNE
  metadata:
    verified: true
    max-request: 1
    vendor: toeverything
    product: affine
    shodan-query: 'http.title:"AFFiNE"'
  tags: tech,affine,knowledge-base,collaboration,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>AFFiNE</title>'
          - 'name="env:isSelfHosted" content="true"'
          - 'npm-blocksuite'
        condition: and

      - type: status
        status:
          - 200
