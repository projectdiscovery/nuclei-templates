id: openbas-detect

info:
  name: OpenBAS - Detect
  author: rxerium
  severity: info
  description: |
    OpenBAS, now OpenAEV, is an open-source adversarial exposure validation and breach and attack simulation platform.
  reference:
    - https://docs.openbas.io/
    - https://github.com/OpenAEV-Platform/openaev
  metadata:
    verified: true
    max-request: 1
    vendor: filigran
    product: openbas
    shodan-query: http.title:"OpenBAS - Open Breach & Attack Simulation Platform"
  tags: tech,detect,openbas,openaev,bas,security

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>OpenBAS - Open Breach & Attack Simulation Platform</title>'
          - 'OpenBAS is an open source platform allowing organizations to plan, schedule and conduct adversary simulation campaigns'
        condition: and

      - type: status
        status:
          - 200
