id: filerise-detect

info:
  name: FileRise - Detect
  author: rxerium
  severity: info
  description: |
    FileRise is a self-hosted web file manager with file sharing and storage management features.
  reference:
    - https://filerise.net/
    - https://github.com/error311/FileRise
  metadata:
    verified: true
    max-request: 1
    vendor: error311
    product: filerise
    shodan-query: http.title:"FileRise"
  tags: tech,filerise,file-sharing,storage,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>FileRise</title>"
          - "assets/logo.svg"
          - "js/main.js"
        condition: and

      - type: status
        status:
          - 200
