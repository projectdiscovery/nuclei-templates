id: saleor-dashboard-detect

info:
  name: Saleor Dashboard - Detect
  author: rxerium
  severity: info
  description: |
    Saleor Dashboard, the administration interface for Saleor commerce, was detected.
  reference:
    - https://saleor.io/
    - https://github.com/saleor/saleor-dashboard
  metadata:
    verified: true
    max-request: 1
    vendor: saleor
    product: saleor_dashboard
    shodan-query: 'http.title:"Sign in to the Saleor Dashboard"'
  tags: tech,saleor,commerce,dashboard,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Sign in to the Saleor Dashboard</title>"
          - "window.__SALEOR_CONFIG__"
          - 'id="dashboard-app"'
        condition: and

      - type: status
        status:
          - 200
