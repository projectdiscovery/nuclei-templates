id: typesetter-cms-detect

info:
  name: Typesetter CMS - Detect
  author: rxerium
  severity: info
  description: |
    Typesetter is an open-source flat-file content management system written in PHP.
  reference:
    - https://github.com/Typesetter/Typesetter
  metadata:
    verified: true
    max-request: 1
    vendor: typesetter
    product: typesetter_cms
    shodan-query: http.html:"Typesetter CMS"
  tags: tech,detect,typesetter,cms

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<meta name="generator" content="Typesetter CMS"'

      - type: word
        part: body
        words:
          - '/data/_cache/'
          - '/include/thirdparty/'
        condition: or

      - type: status
        status:
          - 200
