id: prusalink-detect

info:
  name: PrusaLink - Detect
  author: rxerium
  severity: info
  description: |
    PrusaLink is a local web interface for monitoring and controlling supported Prusa 3D printers.
  reference:
    - https://help.prusa3d.com/article/prusalink-and-prusa-connect-setup-mini-_2182
  metadata:
    verified: true
    max-request: 1
    vendor: prusa-research
    product: prusalink
    shodan-query: 'http.html:"PrusaLink"'
  tags: prusalink,prusa,tech,iot,3d-printing,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>PrusaLink</title>'
          - 'href="/#dashboard"'
          - 'href="#files"'
        condition: and

      - type: status
        status:
          - 200
