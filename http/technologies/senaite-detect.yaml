id: senaite-detect

info:
  name: SENAITE - Detect
  author: rxerium
  severity: info
  description: |
    SENAITE open-source laboratory information management system was detected.
  reference:
    - https://www.senaite.com/
    - https://github.com/senaite/senaite.core
  metadata:
    verified: true
    max-request: 1
    vendor: senaite
    product: senaite
    shodan-query: 'http.html:"++plone++senaite.core.static"'
  tags: tech,senaite,lims,science,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '++plone++senaite.core.static/'

      - type: regex
        part: body
        regex:
          - '(?i)<title>[^<]*SENAITE[^<]*</title>'

      - type: status
        status:
          - 200
