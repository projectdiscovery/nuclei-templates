id: tryton-sao-detect

info:
  name: Tryton SAO - Detect
  author: rxerium
  severity: info
  description: |
    Tryton SAO is the web client for the Tryton business management platform.
  reference:
    - https://www.tryton.org/
    - https://github.com/tryton/sao
  metadata:
    verified: true
    max-request: 1
    vendor: tryton
    product: sao
    shodan-query: http.title:"Tryton"
  tags: tech,tryton,sao,erp,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Tryton</title>'
          - "dist/tryton-sao.min.js"
          - "images/tryton-icon.png"
        condition: and

      - type: status
        status:
          - 200
