id: gokapi-detect

info:
  name: Gokapi - Detect
  author: rxerium
  severity: info
  description: |
    Gokapi is a self-hosted file-sharing server for expiring downloads.
  reference:
    - https://github.com/Forceu/Gokapi
  metadata:
    verified: true
    max-request: 1
    vendor: forceu
    product: gokapi
    shodan-query: http.title:"Gokapi"
  tags: tech,gokapi,file-sharing,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Gokapi</title>"
          - "gokapi.min."
        condition: and

      - type: status
        status:
          - 200
