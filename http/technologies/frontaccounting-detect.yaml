id: frontaccounting-detect

info:
  name: FrontAccounting - Detect
  author: rxerium
  severity: info
  description: |
    FrontAccounting is an open-source accounting system for small companies.
  reference:
    - https://frontaccounting.com/
    - https://github.com/FrontAccountingERP/FA
  metadata:
    verified: true
    max-request: 1
    vendor: frontaccounting
    product: frontaccounting
    shodan-query: http.title:"FrontAccounting"
  tags: tech,frontaccounting,erp,accounting,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>FrontAccounting[^<]+Login</title>'

      - type: word
        part: body
        words:
          - "logo_frontaccounting.png"
          - "company_login_name"
        condition: and

      - type: status
        status:
          - 200
