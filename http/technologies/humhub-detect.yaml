id: humhub-detect

info:
  name: HumHub - Detect
  author: rxerium
  severity: info
  description: |
    HumHub is an open-source social network and collaboration platform.
  reference:
    - https://www.humhub.com/
    - https://github.com/humhub/humhub
  metadata:
    verified: true
    max-request: 1
    vendor: humhub
    product: humhub
    shodan-query: 'http.html:"humhub-app.js"'
  tags: humhub,social,community,collaboration,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '/static/js/humhub-app.js'
          - 'humhub.modules.ui.view.setState('
          - 'humhub.config.set('
        condition: and

      - type: status
        status:
          - 200
