id: triliumnext-notes-detect

info:
  name: TriliumNext Notes - Detect
  author: rxerium
  severity: info
  description: |
    TriliumNext Notes, a hierarchical note-taking application, was detected.
  reference:
    - https://github.com/TriliumNext/Trilium
    - https://triliumnotes.org/
  metadata:
    verified: true
    max-request: 1
    vendor: triliumnext
    product: trilium
    shodan-query: 'http.title:"Trilium Notes"'
  tags: tech,trilium,triliumnext,notes,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "<title>Trilium Notes</title>", "id=\"trilium-app\"", "Trilium requires JavaScript to be enabled.")'
        condition: and
