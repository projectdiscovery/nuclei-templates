id: weberp-detect

info:
  name: webERP - Detect
  author: rxerium
  severity: info
  description: |
    webERP is an open-source web-based accounting and business management system.
  reference:
    - https://www.weberp.org/
    - https://github.com/timschofield/webERP
  metadata:
    verified: true
    max-request: 1
    vendor: weberp
    product: weberp
    shodan-query: http.title:"webERP Login screen"
  tags: tech,weberp,erp,accounting,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>webERP Login screen</title>'

      - type: word
        part: body
        words:
          - 'name="CompanyNameField"'
          - 'name="UserNameEntryField"'
        condition: and

      - type: status
        status:
          - 200
