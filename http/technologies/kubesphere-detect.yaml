id: kubesphere-detect

info:
  name: KubeSphere - Detect
  author: rxerium
  severity: info
  description: |
    KubeSphere is an open-source Kubernetes platform with application management and DevOps capabilities.
  reference:
    - https://kubesphere.io/
    - https://github.com/kubesphere/kubesphere
  metadata:
    verified: true
    max-request: 1
    vendor: kubesphere
    product: kubesphere
    shodan-query: http.title:"KubeSphere"
  tags: tech,kubesphere,kubernetes,devops,platform,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>KubeSphere</title>"
          - 'href="/assets/favicon.ico"'
          - 'class="pageLoading"'
        condition: and

      - type: status
        status:
          - 200
