id: formbricks-detect

info:
  name: Formbricks - Detect
  author: rxerium
  severity: info
  description: |
    Formbricks is an open-source survey platform.
  reference:
    - https://github.com/formbricks/formbricks
  metadata:
    verified: true
    max-request: 1
    vendor: formbricks
    product: formbricks
    shodan-query: 'http.title:"Formbricks"'
  tags: formbricks,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Formbricks</title>'
          - '<meta name="description" content="Open-Source Survey Suite"'
        condition: and

      - type: status
        status:
          - 200
