id: lldap-detect

info:
  name: LLDAP - Detect
  author: rxerium
  severity: info
  description: |
    LLDAP is a lightweight authentication server providing an LDAP interface and administration web UI.
  reference:
    - https://github.com/lldap/lldap
  metadata:
    verified: true
    max-request: 1
    vendor: lldap
    product: lldap
    shodan-query: http.title:"LLDAP Administration"
  tags: tech,detect,lldap,ldap,iam

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>LLDAP Administration</title>'
          - 'LLDAP requires JavaScript'
        condition: and

      - type: status
        status:
          - 200
