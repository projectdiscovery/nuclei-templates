id: cinny-detect

info:
  name: Cinny - Detect
  author: rxerium
  severity: info
  description: |
    Cinny is an open-source web client for the Matrix protocol.
  reference:
    - https://cinny.in/
    - https://github.com/cinnyapp/cinny
  metadata:
    verified: true
    max-request: 1
    vendor: cinnyapp
    product: cinny
    shodan-query: 'http.title:"Cinny"'
  tags: cinny,matrix,chat,messaging,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Cinny</title>'
          - 'A Matrix client where you can enjoy the conversation'
          - 'name="application-name" content="Cinny"'
        condition: and

      - type: status
        status:
          - 200
