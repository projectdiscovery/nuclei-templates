id: backstage-detect

info:
  name: Backstage - Detect
  author: rxerium
  severity: info
  description: |
    Backstage is an open framework for building developer portals.
  reference:
    - https://backstage.io/
    - https://github.com/backstage/backstage
  metadata:
    verified: true
    max-request: 1
    vendor: backstage
    product: backstage
    shodan-query: http.html:"Backstage is an open platform for building developer portals"
  tags: tech,backstage,developer-portal,devops,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'content="Backstage is an open platform for building developer portals"'
          - 'module-backstage.'
        condition: and

      - type: status
        status:
          - 200
