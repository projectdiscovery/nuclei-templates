id: fluidd-detect

info:
  name: Fluidd - Detect
  author: rxerium
  severity: info
  description: |
    Fluidd is a web interface for managing Klipper-based 3D printers.
  reference:
    - https://github.com/fluidd-core/fluidd
    - https://docs.fluidd.xyz/
  metadata:
    verified: true
    max-request: 1
    vendor: fluidd-core
    product: fluidd
    shodan-query: 'http.title:"fluidd"'
  tags: fluidd,tech,iot,3d-printing,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>fluidd</title>'
          - 'content="The Klipper web interface for managing your 3d printer"'
        condition: and

      - type: status
        status:
          - 200
