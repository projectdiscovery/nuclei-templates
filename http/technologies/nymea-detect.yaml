id: nymea-detect

info:
  name: nymea - Detect
  author: rxerium
  severity: info
  description: |
    nymea is an open-source IoT and smart-home platform for connecting and controlling devices.
  reference:
    - https://nymea.io/
    - https://github.com/nymea/nymea
  metadata:
    verified: true
    max-request: 1
    vendor: nymea
    product: nymea
    shodan-query: '"nymea"'
  tags: nymea,tech,iot,smart-home,home-automation,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - '(?mi)^Server:\s*nymea/[0-9]'

      - type: status
        status:
          - 404
