id: duplicati-detect

info:
  name: Duplicati - Detect
  author: rxerium
  severity: info
  description: |
    Duplicati is an open-source backup client with a web-based interface.
  reference:
    - https://duplicati.com/
    - https://github.com/duplicati/duplicati
  metadata:
    verified: true
    max-request: 1
    vendor: duplicati
    product: duplicati
    shodan-query: 'http.title:"Duplicati Login"'
  tags: duplicati,tech,detect,backup

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Duplicati Login</title>'
          - 'login/login.js'
          - '<h2>Duplicati</h2>'
        condition: and

      - type: status
        status:
          - 200
