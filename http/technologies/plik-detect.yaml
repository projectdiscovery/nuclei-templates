id: plik-detect

info:
  name: Plik - Detect
  author: rxerium
  severity: info
  description: |
    Plik is a self-hosted temporary file upload and sharing system.
  reference:
    - https://github.com/root-gg/plik
  metadata:
    verified: true
    max-request: 1
    vendor: root-gg
    product: plik
    shodan-query: http.title:"Plik"
  tags: tech,plik,file-sharing,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Plik</title>"
          - "ng-app=\"plik\""
          - "github.com/root-gg/plik"
        condition: and

      - type: status
        status:
          - 200
