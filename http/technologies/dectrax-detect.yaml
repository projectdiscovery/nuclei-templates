id: dectrax-detect

info:
  name: DECTRAX Cyber Deception Platform - Detect
  author: Sadman-TheDentian
  severity: info
  description: |
    DECTRAX is a cyber deception and threat intelligence platform that deploys high-interaction decoys, honeypots, and threat telemetry feeds.
  reference:
    - https://github.com/Sadman-TheDentian/dectrace
  metadata:
    verified: true
    max-request: 2
    vendor: dectrax
    product: dectrax
    shodan-query: 'http.title:"DECTRAX"'
  tags: tech,dectrax,deception,honeypot,edl,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/api/v1/health"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - '<title>DECTRAX Deception Node</title>'
          - '"service":"dectrax"'
          - '"status":"healthy"'
        condition: and

      - type: word
        part: header
        words:
          - 'X-Dectrax-Node'
          - 'DECTRAX-Deception'
        condition: or

      - type: status
        status:
          - 200
