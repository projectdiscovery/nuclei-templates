id: dectrax-edl-detect

info:
  name: DECTRAX Threat Intelligence Feed (EDL) - Detect
  author: Sadman-TheDentian
  severity: info
  description: |
    DECTRAX External Dynamic List (EDL) publishes real-time threat intelligence feeds containing verified attacker IP addresses observed interacting with deception traps.
  reference:
    - https://github.com/Sadman-TheDentian/dectrace
  metadata:
    verified: true
    max-request: 2
    vendor: dectrax
    product: dectrax
    shodan-query: 'http.title:"DECTRAX Threat Intelligence"'
  tags: tech,dectrax,edl,threat-intel,feed,deception,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/edl/attackers.txt"
      - "{{BaseURL}}/edl/attackers.txt"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "# DECTRAX Threat Intelligence Feed"
          - "# Source: Decoy Interaction Telemetry"
        condition: or

      - type: status
        status:
          - 200
