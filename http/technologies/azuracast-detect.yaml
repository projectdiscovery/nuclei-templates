id: azuracast-detect

info:
  name: AzuraCast - Detect
  author: rxerium
  severity: info
  description: |
    AzuraCast is a self-hosted web radio management suite.
  reference:
    - https://github.com/AzuraCast/AzuraCast
  metadata:
    verified: true
    max-request: 1
    vendor: azuracast
    product: azuracast
    shodan-query: 'http.title:"Log In - AzuraCast"'
  tags: azuracast,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Log In - AzuraCast</title>'
          - 'href="https://azuracast.com/"'
        condition: and

      - type: status
        status:
          - 200
