id: winter-cms-detect

info:
  name: Winter CMS - Detect
  author: rxerium
  severity: info
  description: |
    Winter CMS is an open-source content management system built on Laravel.
  reference:
    - https://wintercms.com/
    - https://github.com/wintercms/winter
  metadata:
    verified: true
    max-request: 1
    vendor: wintercms
    product: winter
    shodan-query: http.html:"Winter CMS"
  tags: tech,detect,wintercms,cms

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<meta name="generator" content="Winter CMS"'

      - type: word
        part: body
        words:
          - '/themes/'

      - type: status
        status:
          - 200
