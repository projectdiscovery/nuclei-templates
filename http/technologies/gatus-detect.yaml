id: gatus-detect

info:
  name: Gatus - Detect
  author: rxerium
  severity: info
  description: |
    Gatus, an automated status page for monitoring service health, was detected.
  reference:
    - https://github.com/TwiN/gatus
  metadata:
    verified: true
    max-request: 1
    vendor: twin
    product: gatus
    shodan-query: http.title:"Health Dashboard | Gatus"
  tags: tech,gatus,monitoring,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Health Dashboard | Gatus</title>'
          - 'content="Gatus is an advanced automated status page'
        condition: and

      - type: status
        status:
          - 200
