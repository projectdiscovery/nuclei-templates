id: saleor-api-detect

info:
  name: Saleor API - Detect
  author: rxerium
  severity: info
  description: |
    Saleor commerce API landing page was detected.
  reference:
    - https://saleor.io/
    - https://github.com/saleor/saleor
  metadata:
    verified: true
    max-request: 1
    vendor: saleor
    product: saleor
    shodan-query: 'http.title:"Saleor e-commerce"'
  tags: tech,saleor,commerce,api,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Saleor e-commerce</title>"
          - "Your Saleor instance is ready to work"
          - "GraphQL Playground"
        condition: and

      - type: status
        status:
          - 200
