id: gotosocial-detect

info:
  name: GoToSocial - Detect
  author: rxerium
  severity: info
  description: |
    GoToSocial is a federated microblogging server implementing ActivityPub.
  reference:
    - https://gotosocial.org/
    - https://github.com/superseriousbusiness/gotosocial
  metadata:
    verified: true
    max-request: 1
    vendor: superseriousbusiness
    product: gotosocial
    shodan-query: 'http.html:"GoToSocial"'
  tags: gotosocial,fediverse,social,activitypub,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'served by an instance of GoToSocial'
          - '/assets/dist/about.css'
        condition: and

      - type: status
        status:
          - 200
