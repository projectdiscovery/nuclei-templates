id: picoshare-detect

info:
  name: PicoShare - Detect
  author: rxerium
  severity: info
  description: |
    PicoShare is a minimalist self-hosted service for sharing images and other files.
  reference:
    - https://github.com/mtlynch/picoshare
  metadata:
    verified: true
    max-request: 1
    vendor: mtlynch
    product: picoshare
    shodan-query: http.title:"PicoShare"
  tags: tech,picoshare,file-sharing,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>PicoShare</title>"
          - "github.com/mtlynch/picoshare"
        condition: and

      - type: status
        status:
          - 200
