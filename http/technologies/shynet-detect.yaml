id: shynet-detect

info:
  name: Shynet - Detect
  author: rxerium
  severity: info
  description: |
    Shynet is an open-source, privacy-friendly web analytics platform.
  reference:
    - https://github.com/milesmcc/shynet
  metadata:
    verified: true
    max-request: 1
    vendor: shynet
    product: shynet
    shodan-query: 'http.html:"Shynet"'
  tags: shynet,analytics,privacy,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'href="https://github.com/milesmcc/shynet"'
          - 'action="/accounts/login/"'
          - '/static/dashboard/images/icon.'
        condition: and

      - type: status
        status:
          - 200
