id: pydio-cells-detect

info:
  name: Pydio Cells - Detect
  author: rxerium
  severity: info
  description: |
    Pydio Cells is an open-source document sharing and collaboration platform.
  reference:
    - https://pydio.com/
    - https://github.com/pydio/cells
  metadata:
    verified: true
    max-request: 1
    vendor: pydio
    product: cells
    shodan-query: 'http.html:"Pydio Cells"'
  tags: pydio,cells,tech,detect,storage

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Pydio Cells</title>'
          - 'pydio.boot.min.js'
          - '"ENDPOINT_S3_GATEWAY":"/io"'
        condition: and

      - type: status
        status:
          - 200
