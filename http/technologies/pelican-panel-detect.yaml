id: pelican-panel-detect

info:
  name: Pelican Panel - Detect
  author: rxerium
  severity: info
  description: |
    Pelican Panel is an open-source game server management panel.
  reference:
    - https://github.com/pelican-dev/panel
  metadata:
    verified: true
    max-request: 1
    vendor: pelican_dev
    product: panel
    shodan-query: 'http.html:"Pelican Panel"'
  tags: pelican,tech,detect,gaming

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Pelican Panel"
          - "https://pelican.dev/docs/#core-team"
        condition: and

      - type: status
        status:
          - 200
