id: it-tools-detect

info:
  name: IT-Tools - Detect
  author: rxerium
  severity: info
  description: |
    IT-Tools is an open-source collection of online utilities for developers and IT professionals.
  reference:
    - https://it-tools.tech/
    - https://github.com/CorentinTh/it-tools
  metadata:
    verified: true
    max-request: 1
    vendor: corentinth
    product: it-tools
    shodan-query: http.title:"IT Tools - Handy online tools for developers"
  tags: tech,it-tools,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>IT Tools - Handy online tools for developers</title>'
          - '<link rel="canonical" href="https://it-tools.tech"'
        condition: and

      - type: status
        status:
          - 200
