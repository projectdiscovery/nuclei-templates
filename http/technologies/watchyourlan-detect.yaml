id: watchyourlan-detect

info:
  name: WatchYourLAN - Detect
  author: rxerium
  severity: info
  description: |
    WatchYourLAN is an open-source network discovery and device monitoring application.
  reference:
    - https://github.com/aceberg/WatchYourLAN
  metadata:
    verified: true
    max-request: 1
    vendor: aceberg
    product: watchyourlan
    shodan-query: http.title:"WatchYourLAN"
  tags: tech,watchyourlan,network-monitoring,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>WatchYourLAN</title>'
          - '/fs/public/'
        condition: and

      - type: status
        status:
          - 200
