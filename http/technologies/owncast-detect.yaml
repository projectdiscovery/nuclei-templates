id: owncast-detect

info:
  name: Owncast - Detect
  author: rxerium
  severity: info
  description: |
    Owncast is a self-hosted live video and web chat server.
  reference:
    - https://owncast.online/
    - https://github.com/owncast/owncast
  metadata:
    verified: true
    max-request: 1
    vendor: owncast_project
    product: owncast
    shodan-query: 'http.title:"Owncast"'
  tags: owncast,tech,detect,streaming

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Owncast</title>'
          - 'href="/api/auth/provider/indieauth"'
          - '/js/web_modules/videojs/video-js.min.css'
        condition: and

      - type: status
        status:
          - 200
