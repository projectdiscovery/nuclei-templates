id: firebase-auth-fingerprint

info:
  name: Firebase Authentication - Fingerprint
  author: zomasec,zomaxsec
  severity: info
  description: |
    Identifies applications using Firebase for authentication by requesting the auth helper script and checking for Firebase license, SDK version, and terms-of-service references.
  reference:
    - https://firebase.google.com/docs/auth/web/redirect-best-practices
  metadata:
    max-request: 1
  tags: firebase,fingerprint,tech

http:
  - method: GET
    path:
      - "{{BaseURL}}/__/auth/handler.js"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "@license Firebase"

      - type: regex
        part: body
        regex:
          - "Build: [0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?"

      - type: word
        part: body
        words:
          - "https://firebase.google.com/terms/"
