id: firebase-auth-fingerprint

info:
  name: Firebase Authentication Fingerprint
  author: zomasec,zomaxsec
  severity: info
  description: |
    Identifies applications using Firebase as an identity provider for authentication by
    requesting the Firebase Hosting auth helper script and inspecting its license header,
    embedded SDK build-version string, and Firebase terms-of-service reference.
  reference:
    - https://firebase.google.com/docs/auth/web/redirect-best-practices
  metadata:
    max-request: 1
  tags: firebase,fingerprint,tech

http:
  - method: GET
    path:
      - "{{BaseURL}}/__/auth/handler.js"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "@license Firebase"

      - type: regex
        part: body
        regex:
          - "Build: [0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?"

      - type: word
        part: body
        words:
          - "https://firebase.google.com/terms/"
