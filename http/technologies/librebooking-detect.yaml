id: librebooking-detect

info:
  name: LibreBooking - Detect
  author: rxerium
  severity: info
  description: |
    LibreBooking is an open-source resource scheduling and appointment application.
  reference:
    - https://github.com/LibreBooking/app
    - https://librebooking.readthedocs.io/
  metadata:
    verified: true
    max-request: 1
    vendor: librebooking
    product: librebooking
    shodan-query: http.title:"LibreBooking - Log In"
  tags: tech,librebooking,scheduling,appointment,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>LibreBooking - Log In</title>'
          - "librebooking.css"
          - "img/librebooking.png"
        condition: and

      - type: status
        status:
          - 200
