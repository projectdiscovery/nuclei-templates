id: firefly-iii-detect

info:
  name: Firefly III - Detect
  author: rxerium
  severity: info
  description: |
    Firefly III, a self-hosted personal finance manager, was detected.
  reference:
    - https://github.com/firefly-iii/firefly-iii
    - https://www.firefly-iii.org/
  metadata:
    verified: true
    max-request: 1
    vendor: firefly-iii
    product: firefly-iii
    shodan-query: 'http.title:"Firefly III"'
  tags: tech,firefly-iii,finance,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "<title>Login to Firefly III</title>", "alt=\"Firefly III Logo\"")'
        condition: and
