id: bahmni-detect

info:
  name: Bahmni - Detect
  author: rxerium
  severity: info
  description: |
    Bahmni open-source hospital information system and electronic medical record distribution was detected.
  reference:
    - https://www.bahmni.org/
    - https://github.com/Bahmni/bahmni-core
  metadata:
    verified: true
    max-request: 1
    vendor: bahmni
    product: bahmni
    shodan-query: 'http.html:"Bahmni"'
  tags: tech,bahmni,his,emr,healthcare,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>Bahmni(?: Home)?</title>'

      - type: word
        part: body
        words:
          - 'ng-app="bahmni.home"'
          - '/bahmni/images/bahmniLogoFull.png'
        condition: or

      - type: status
        status:
          - 200
