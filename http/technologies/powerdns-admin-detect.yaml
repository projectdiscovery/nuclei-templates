id: powerdns-admin-detect

info:
  name: PowerDNS-Admin - Detect
  author: rxerium
  severity: info
  description: |
    PowerDNS-Admin is an open-source web interface for administering PowerDNS services and zones.
  reference:
    - https://github.com/PowerDNS-Admin/PowerDNS-Admin
  metadata:
    verified: true
    max-request: 1
    vendor: powerdns-admin
    product: powerdns-admin
    shodan-query: http.title:"PowerDNS-Admin"
  tags: tech,powerdns-admin,dns,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Log In - PowerDNS-Admin</title>'
          - '/static/generated/login.'
        condition: and

      - type: status
        status:
          - 200
