id: sharry-detect

info:
  name: Sharry - Detect
  author: rxerium
  severity: info
  description: |
    Sharry is a self-hosted file-sharing application supporting uploads through shareable links.
  reference:
    - https://github.com/eikek/sharry
  metadata:
    verified: true
    max-request: 1
    vendor: eikek
    product: sharry
    shodan-query: http.title:"Sharry"
  tags: tech,sharry,file-sharing,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Sharry</title>"
          - "assets/sharry-webapp/"
        condition: and

      - type: status
        status:
          - 200
