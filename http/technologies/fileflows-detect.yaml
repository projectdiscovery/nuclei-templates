id: fileflows-detect

info:
  name: FileFlows - Detect
  author: rxerium
  severity: info
  description: |
    FileFlows is a media file processing and automation application.
  reference:
    - https://fileflows.com/
  metadata:
    verified: true
    max-request: 1
    vendor: fileflows
    product: fileflows
    shodan-query: 'http.html:"FileFlows"'
  tags: fileflows,tech,detect,media,automation

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>FileFlows</title>'
          - '<meta name="app-version"'
          - 'flow-editor/fileflows-editor.js'
        condition: and

      - type: status
        status:
          - 200
