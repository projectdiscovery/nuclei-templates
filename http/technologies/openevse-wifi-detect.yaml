id: openevse-wifi-detect

info:
  name: OpenEVSE WiFi - Detect
  author: rxerium
  severity: info
  description: |
    OpenEVSE WiFi provides web-based monitoring and control for OpenEVSE electric vehicle charging stations.
  reference:
    - https://www.openevse.com/
    - https://github.com/OpenEVSE/ESP32_WiFi_V4.x
  metadata:
    verified: true
    max-request: 1
    vendor: openevse
    product: openevse-wifi
    shodan-query: 'http.title:"OpenEVSE WiFi"'
  tags: openevse,tech,iot,ev,energy,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>OpenEVSE WiFi</title>'

      - type: word
        part: header
        words:
          - 'Mongoose/'

      - type: status
        status:
          - 200
