id: logto-detect

info:
  name: Logto - Detect
  author: rxerium
  severity: info
  description: |
    Logto is an open-source identity and access management platform for applications.
  reference:
    - https://logto.io/
    - https://github.com/logto-io/logto
  metadata:
    verified: true
    max-request: 1
    vendor: silverhand
    product: logto
    shodan-query: http.html:"window.logtoSsr"
  tags: tech,detect,logto,iam

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "contains(body, 'window.logtoSsr') || contains(tolower(header), 'logto-core-request-id:')"

      - type: status
        status:
          - 200
          - 302
