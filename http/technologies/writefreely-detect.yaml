id: writefreely-detect

info:
  name: WriteFreely - Detect
  author: rxerium
  severity: info
  description: |
    WriteFreely is an open-source, Markdown-based publishing platform.
  reference:
    - https://writefreely.org/
    - https://github.com/writefreely/writefreely
  metadata:
    verified: true
    max-request: 1
    vendor: writefreely
    product: writefreely
    shodan-query: http.html:"WriteFreely"
  tags: tech,detect,writefreely,cms

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - '(?mi)^set-cookie:\s*wfu='

      - type: regex
        part: body
        regex:
          - '(?i)href=["'']/?css/write(?:3)?\.css'

      - type: status
        status:
          - 200
