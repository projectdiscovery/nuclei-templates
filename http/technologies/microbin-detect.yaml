id: microbin-detect

info:
  name: MicroBin - Detect
  author: rxerium
  severity: info
  description: |
    MicroBin is a self-hosted pastebin and file-sharing application.
  reference:
    - https://microbin.eu/
    - https://github.com/szabodanika/microbin
  metadata:
    verified: true
    max-request: 1
    vendor: microbin
    product: microbin
    shodan-query: 'http.title:"MicroBin"'
  tags: microbin,tech,detect,pastebin

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>MicroBin</title>'
          - 'id="pasta-form"'
          - '/static/aes.js'
        condition: and

      - type: status
        status:
          - 200
