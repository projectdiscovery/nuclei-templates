id: volumio-detect

info:
  name: Volumio - Detect
  author: rxerium
  severity: info
  description: |
    Volumio is a music player operating system with a web-based interface.
  reference:
    - https://github.com/volumio/Volumio2
  metadata:
    verified: true
    max-request: 1
    vendor: volumio
    product: volumio
    shodan-query: 'http.title:"Volumio - The Music Player"'
  tags: volumio,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Volumio - The Music Player</title>'
          - 'ng-app="volumio"'
        condition: and

      - type: status
        status:
          - 200
