id: iotsharp-detect

info:
  name: IoTSharp - Detect
  author: rxerium
  severity: info
  description: |
    IoTSharp is an open-source platform for IoT data collection, processing, visualisation, and device management.
  reference:
    - https://github.com/IoTSharp/IoTSharp
  metadata:
    verified: true
    max-request: 1
    vendor: iotsharp
    product: iotsharp
    shodan-query: 'http.html:"IoTSharp"'
  tags: iotsharp,tech,iot,device-management,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>IoTSharp</title>'
          - 'content="IoTSharp is an open-source IoT platform'
        condition: and

      - type: status
        status:
          - 200
