id: gladys-assistant-detect

info:
  name: Gladys Assistant - Detect
  author: rxerium
  severity: info
  description: |
    Gladys Assistant is an open-source privacy-focused home automation platform.
  reference:
    - https://gladysassistant.com/
    - https://github.com/GladysAssistant/Gladys
  metadata:
    verified: true
    max-request: 1
    vendor: gladysassistant
    product: gladys
    shodan-query: 'http.title:"Gladys Assistant"'
  tags: gladys,tech,iot,home-automation,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Gladys Assistant</title>'
          - '/assets/splash/apple-splash-2048-2732.jpg'
        condition: and

      - type: status
        status:
          - 200
