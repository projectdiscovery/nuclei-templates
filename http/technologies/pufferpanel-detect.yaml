id: pufferpanel-detect

info:
  name: PufferPanel - Detect
  author: rxerium
  severity: info
  description: |
    PufferPanel is an open-source game server management panel.
  reference:
    - https://github.com/pufferpanel/pufferpanel
  metadata:
    verified: true
    max-request: 1
    vendor: pufferpanel
    product: pufferpanel
    shodan-query: 'http.html:"PufferPanel"'
  tags: pufferpanel,tech,detect,gaming

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>PufferPanel</title>"
          - "This site needs JavaScript to work"
        condition: and

      - type: status
        status:
          - 200
