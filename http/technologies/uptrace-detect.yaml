id: uptrace-detect

info:
  name: Uptrace - Detect
  author: rxerium
  severity: info
  description: |
    Uptrace, an open-source application performance monitoring platform, was detected.
  reference:
    - https://github.com/uptrace/uptrace
    - https://uptrace.dev/
  metadata:
    verified: true
    max-request: 1
    vendor: uptrace
    product: uptrace
    shodan-query: http.title:"Uptrace"
  tags: tech,uptrace,apm,monitoring,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>Uptrace(?:|: Open Source APM)</title>'

      - type: word
        part: body
        words:
          - '/assets/vuetify-'
          - '/js/chunk-vendors.'
        condition: or

      - type: status
        status:
          - 200
