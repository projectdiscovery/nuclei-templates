id: psitransfer-detect

info:
  name: PsiTransfer - Detect
  author: rxerium
  severity: info
  description: |
    PsiTransfer is a self-hosted file-sharing application for expiring uploads.
  reference:
    - https://github.com/psi-4ward/psitransfer
  metadata:
    verified: true
    max-request: 1
    vendor: psi-4ward
    product: psitransfer
    shodan-query: http.title:"PsiTransfer"
  tags: tech,psitransfer,file-sharing,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>PsiTransfer</title>"
          - "github.com/psi-4ward/psitransfer"
        condition: and

      - type: status
        status:
          - 200
