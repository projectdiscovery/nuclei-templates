id: scrutiny-detect

info:
  name: Scrutiny - Detect
  author: rxerium
  severity: info
  description: |
    Scrutiny, a web interface for monitoring hard drive S.M.A.R.T data, was detected.
  reference:
    - https://github.com/AnalogJ/scrutiny
  metadata:
    verified: true
    max-request: 1
    vendor: analogj
    product: scrutiny
    shodan-query: http.title:"scrutiny"
  tags: tech,scrutiny,monitoring,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>scrutiny</title>'
          - 'assets/images/logo/scrutiny-logo-white.svg'
        condition: and

      - type: status
        status:
          - 200
