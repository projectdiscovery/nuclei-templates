id: chibisafe-detect

info:
  name: Chibisafe - Detect
  author: rxerium
  severity: info
  description: |
    Chibisafe is an open-source, self-hosted file uploader and cloud storage service.
  reference:
    - https://chibisafe.app/
    - https://github.com/chibisafe/chibisafe
  metadata:
    verified: true
    max-request: 1
    vendor: chibisafe
    product: chibisafe
    shodan-query: http.title:"Chibisafe"
  tags: tech,detect,chibisafe

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>chibisafe</title>'
          - 'content="chibisafe,file uploader,vault,react,free,open source'
        condition: and

      - type: status
        status:
          - 200
