id: whodb-detect

info:
  name: WhoDB - Detect
  author: rxerium
  severity: info
  description: |
    WhoDB is an open-source database management and exploration application.
  reference:
    - https://github.com/clidey/whodb
  metadata:
    verified: true
    max-request: 1
    vendor: clidey
    product: whodb
    shodan-query: 'http.title:"WhoDB"'
  tags: whodb,clidey,database,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Clidey WhoDB</title>'
          - 'content="WhoDB is the next-generation database explorer"'
        condition: and

      - type: status
        status:
          - 200
