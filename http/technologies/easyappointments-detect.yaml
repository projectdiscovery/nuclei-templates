id: easyappointments-detect

info:
  name: Easy!Appointments - Detect
  author: rxerium
  severity: info
  description: |
    Easy!Appointments is an open-source appointment scheduling application.
  reference:
    - https://easyappointments.org/
    - https://github.com/alextselegidis/easyappointments
  metadata:
    verified: true
    max-request: 1
    vendor: easyappointments
    product: easyappointments
    shodan-query: http.title:"Easy!Appointments"
  tags: tech,easyappointments,appointment,scheduling,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>[^<]+\| Easy!Appointments</title>'

      - type: word
        part: body
        words:
          - 'id="book-appointment-wizard"'
          - "/assets/css/layouts/booking_layout"
        condition: and

      - type: status
        status:
          - 200
