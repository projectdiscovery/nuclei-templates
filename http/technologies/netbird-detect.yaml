id: netbird-detect

info:
  name: NetBird - Detect
  author: rxerium
  severity: info
  description: |
    NetBird is an open-source networking platform that provides secure peer-to-peer connectivity and centralised access control.
  reference:
    - https://netbird.io/
    - https://github.com/netbirdio/netbird
    - https://github.com/netbirdio/dashboard
  metadata:
    verified: true
    max-request: 1
    vendor: netbird
    product: netbird
    shodan-query: http.title:"NetBird Dashboard"
  tags: tech,detect,netbird

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>NetBird Dashboard</title>'
          - 'content="NetBird combines a configuration-free peer-to-peer private network'
        condition: and

      - type: status
        status:
          - 200
