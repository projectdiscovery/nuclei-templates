id: openwb-detect

info:
  name: openWB - Detect
  author: rxerium
  severity: info
  description: |
    openWB is an open-source energy management platform for solar-aware electric vehicle charging.
  reference:
    - https://openwb.de/
    - https://github.com/openWB/core
  metadata:
    verified: true
    max-request: 1
    vendor: openwb
    product: openwb
    shodan-query: 'http.title:"openWB"'
  tags: openwb,tech,iot,ev,energy,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>openWB</title>'
          - 'name="apple-mobile-web-app-title" content="openWB"'
        condition: and

      - type: status
        status:
          - 200
