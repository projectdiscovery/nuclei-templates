id: paperclip-detect

info:
  name: Paperclip - Detect
  author: rxerium
  severity: info
  description: |
    Paperclip is an open-source app for managing AI agents at work. It orchestrates a team of AI agents from a single dashboard.
  reference:
    - https://paperclip.ing
    - https://github.com/paperclipai/paperclip
  metadata:
    max-request: 1
    vendor: paperclipai
    product: paperclip
    shodan-query: 'http.title:"Paperclip"'
  tags: paperclip,tech,detect,discovery,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Paperclip</title>'
          - 'PAPERCLIP_RUNTIME_BRANDING_START'
          - 'paperclip.theme'
        condition: and

      - type: status
        status:
          - 200
