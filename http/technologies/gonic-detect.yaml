id: gonic-detect

info:
  name: gonic - Detect
  author: rxerium
  severity: info
  description: |
    gonic is an open-source music streaming server implementing the Subsonic API.
  reference:
    - https://github.com/sentriz/gonic
  metadata:
    verified: true
    max-request: 1
    vendor: sentriz
    product: gonic
    shodan-query: 'http.title:"gonic"'
  tags: gonic,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>gonic</title>'
          - '/admin/static/gonic.png'
        condition: and

      - type: status
        status:
          - 200
