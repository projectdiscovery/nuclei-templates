id: docuseal-detect

info:
  name: DocuSeal - Detect
  author: rxerium
  severity: info
  description: |
    DocuSeal is an open-source application for creating, filling, and signing digital documents.
  reference:
    - https://github.com/docusealco/docuseal
  metadata:
    verified: true
    max-request: 1
    vendor: docusealco
    product: docuseal
    shodan-query: 'http.title:"DocuSeal"'
  tags: docuseal,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<html data-theme="docuseal"'
          - 'DocuSeal | Open Source Document Filling and Signing'
        condition: and

      - type: status
        status:
          - 200
