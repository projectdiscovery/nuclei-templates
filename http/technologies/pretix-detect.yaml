id: pretix-detect

info:
  name: pretix - Detect
  author: rxerium
  severity: info
  description: |
    pretix is an open-source ticket sales and event commerce platform.
  reference:
    - https://pretix.eu/about/en/
    - https://github.com/pretix/pretix
  metadata:
    verified: true
    max-request: 1
    vendor: pretix
    product: pretix
    shodan-query: http.html:"ticketing powered by pretix"
  tags: tech,pretix,ecommerce,ticketing,payment,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '/static/pretixbase/img/'
          - 'ticketing powered by pretix'
        condition: and

      - type: status
        status:
          - 200
