id: adempiere-detect

info:
  name: ADempiere - Detect
  author: rxerium
  severity: info
  description: |
    ADempiere is an open-source enterprise resource planning and customer relationship management system.
  reference:
    - https://www.adempiere.io/
    - https://github.com/adempiere/adempiere
  metadata:
    verified: true
    max-request: 1
    vendor: adempiere
    product: adempiere
    shodan-query: http.title:"ADempiere Application Home"
  tags: tech,adempiere,erp,crm,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>ADempiere Application Home</title>'
          - "adempiere.jnlp"
          - "ADempiere WebStart"
        condition: and

      - type: status
        status:
          - 200
