id: flagsmith-detect

info:
  name: Flagsmith - Detect
  author: rxerium
  severity: info
  description: |
    Flagsmith is an open-source feature flag and remote configuration platform.
  reference:
    - https://www.flagsmith.com/
    - https://github.com/Flagsmith/flagsmith
  metadata:
    verified: true
    max-request: 1
    vendor: flagsmith
    product: flagsmith
    shodan-query: 'http.title:"Flagsmith"'
  tags: flagsmith,feature-flags,remote-config,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '<title>Flagsmith - Feature Flags, Feature Toggles and Remote Config[^<]*</title>'

      - type: word
        part: body
        words:
          - 'src="/config/project-overrides"'
          - 'href="/static/images/favicon.ico"'
        condition: and

      - type: status
        status:
          - 200
