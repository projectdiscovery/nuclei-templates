id: ipplan-detect

info:
  name: IPPlan - Detect
  author: rxerium
  severity: info
  description: |
    IPPlan is an open-source IP address management and tracking system.
  reference:
    - https://sourceforge.net/projects/iptrack/
  metadata:
    verified: true
    max-request: 1
    vendor: ipplan
    product: ipplan
    shodan-query: http.title:"IPPlan"
  tags: tech,ipplan,ipam,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>IPPlan - Main Menu</title>'
          - '/menus/libjs/layersmenu'
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
