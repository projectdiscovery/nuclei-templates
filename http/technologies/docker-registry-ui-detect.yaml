id: docker-registry-ui-detect

info:
  name: Docker Registry UI - Detect
  author: rxerium
  severity: info
  description: |
    Docker Registry UI is an open-source web interface for browsing Docker registries.
  reference:
    - https://github.com/Joxit/docker-registry-ui
    - https://github.com/jc21/docker-registry-ui
  metadata:
    verified: true
    max-request: 1
    vendor: joxit
    product: docker_registry_ui
    shodan-query: http.title:"Docker Registry UI"
  tags: tech,docker-registry-ui,detect,docker,registry

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "<title>Docker Registry UI</title>", "property=\"og:site_name\" content=\"Docker Registry UI\"", "docker-registry-ui.js") || contains_all(body, "<title>Docker Registry UI</title>", "github.com/jc21/docker-registry-ui", "/images/favicons/browserconfig.xml")'
        condition: and
