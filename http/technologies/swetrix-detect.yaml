id: swetrix-detect

info:
  name: Swetrix - Detect
  author: rxerium
  severity: info
  description: |
    Swetrix is an open-source, privacy-first web analytics platform.
  reference:
    - https://swetrix.com/
    - https://github.com/Swetrix/swetrix
  metadata:
    verified: true
    max-request: 1
    vendor: swetrix
    product: swetrix
    shodan-query: 'http.title:"Swetrix"'
  tags: swetrix,analytics,privacy,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Swetrix Community Edition</title>'
          - '<meta name="twitter:site" content="@swetrix"'
          - 'href="/favicon-ce.ico"'
        condition: and

      - type: word
        part: header
        words:
          - 'x-powered-by: Mountain Dew'
        case-insensitive: true

      - type: status
        status:
          - 200
