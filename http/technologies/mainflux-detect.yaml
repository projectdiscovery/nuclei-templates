id: mainflux-detect

info:
  name: Mainflux - Detect
  author: rxerium
  severity: info
  description: |
    Mainflux, now known as Magistrala, is an open-source IoT messaging and device management platform.
  reference:
    - https://github.com/absmach/magistrala
    - https://www.magistrala.io/
  metadata:
    verified: true
    max-request: 1
    vendor: mainflux
    product: mainflux
    shodan-query: 'http.title:"Mainflux"'
  tags: mainflux,magistrala,tech,iot,device-management,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Mainflux</title>'
          - 'src="assets/env.js"'
        condition: and

      - type: status
        status:
          - 200
