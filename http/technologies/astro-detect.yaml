id: astro-detect

info:
  name: Astro Framework - Detect
  author: iamkunal9
  severity: info
  description: |
    Detects Astro framework sites via generator meta tag, component islands, and static asset paths, and extracts the version when present.
  reference:
    - https://astro.build
    - https://github.com/withastro/astro
  classification:
    cpe: cpe:2.3:a:withastro:astro:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: withastro
    product: astro
    shodan-query: http.component:"Astro"
    fofa-query: app="Astro"
  tags: tech,astro,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - 'content="Astro v'
          - "content='Astro v"
        condition: or

      - type: word
        part: body
        words:
          - 'data-astro-cid'
          - '<astro-island'
          - '/_astro/'
        condition: or

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - '(?i)content=["'']Astro v([^"'']+)["'']'
