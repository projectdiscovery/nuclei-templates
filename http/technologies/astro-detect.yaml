id: astro-detect

info:
  name: Astro Framework - Detect
  author: iamkunal9
  severity: info
  description: |
    Detects Astro framework sites via generator meta tag, component islands, and static asset paths, and extracts the version when present.
  reference:
    - https://astro.build
    - https://github.com/withastro/astro
  metadata:
    verified: true
    max-request: 1
    vendor: withastro
    product: astro
    shodan-query: http.component:"Astro"
    fofa-query: app="Astro"
  tags: tech,astro,discovery

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "content=\"Astro v", "content=''Astro v", "data-astro-cid", "<astro-island", "/_astro/")'
          - 'status_code == 200'
        condition: and

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - '(?i)content=["'']Astro v([^"'']+)["'']'
