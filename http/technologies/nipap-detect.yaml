id: nipap-detect

info:
  name: NIPAP - Detect
  author: rxerium
  severity: info
  description: |
    NIPAP, the Neat IP Address Planner, is an open-source IP address management system.
  reference:
    - https://github.com/SpriteLink/NIPAP
  metadata:
    verified: true
    max-request: 1
    vendor: spritelink
    product: nipap
    shodan-query: http.title:"NIPAP"
  tags: tech,nipap,ipam,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>NIPAP</title>'
          - 'nipap.css'
        condition: and

      - type: status
        status:
          - 200
