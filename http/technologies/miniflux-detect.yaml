id: miniflux-detect

info:
  name: Miniflux - Detect
  author: rxerium
  severity: info
  description: |
    Miniflux is an open-source minimalist web-based feed reader.
  reference:
    - https://miniflux.app/
    - https://github.com/miniflux/v2
  metadata:
    verified: true
    max-request: 1
    vendor: miniflux
    product: miniflux
    shodan-query: http.title:"Sign In - Miniflux"
  tags: tech,detect,miniflux,rss

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - "contains_all(body, '<title>Sign In - Miniflux</title>', 'apple-mobile-web-app-title\" content=\"Miniflux\"')"
          - "status_code == 200"
        condition: and
