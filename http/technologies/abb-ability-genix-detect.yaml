id: abb-ability-genix-detect

info:
  name: ABB Ability Genix Industrial Analytics and AI Suite - Detect
  author: rxerium
  severity: info
  description: |
    ABB Ability Genix industrial analytics and artificial intelligence management portal was detected.
  reference:
    - https://new.abb.com/process-automation/genix
  metadata:
    max-request: 1
    shodan-query: 'title:"ABB Ability" title:"Genix Industrial Analytics"'
  tags: tech,abb,genix,iiot,ics

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>ABB Ability&trade; Genix Industrial Analytics and AI Suite</title>'
          - 'assets/abb_favicon.ico'
        condition: and

      - type: status
        status:
          - 200
