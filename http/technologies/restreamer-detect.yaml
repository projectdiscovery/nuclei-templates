id: restreamer-detect

info:
  name: Restreamer - Detect
  author: rxerium
  severity: info
  description: |
    Restreamer is a self-hosted video streaming server and management interface.
  reference:
    - https://github.com/datarhei/restreamer
  metadata:
    verified: true
    max-request: 1
    vendor: datarhei
    product: restreamer
    shodan-query: 'http.html:"Restreamer"'
  tags: restreamer,tech,detect,streaming,media

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Restreamer</title>"
          - "datarhei Restreamer logo"
          - "Did you mean to go to the admin panel?"
        condition: and

      - type: status
        status:
          - 200
