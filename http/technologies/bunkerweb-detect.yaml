id: bunkerweb-detect

info:
  name: BunkerWeb - Detect
  author: rxerium
  severity: info
  description: |
    BunkerWeb is an open-source, cloud-native web application firewall.
  reference:
    - https://www.bunkerweb.io/
    - https://github.com/bunkerity/bunkerweb
  metadata:
    verified: true
    max-request: 1
    vendor: bunkerity
    product: bunkerweb
    shodan-query: http.title:"BunkerWeb"
  tags: tech,detect,bunkerweb,waf

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>BunkerWeb</title>'
          - 'https://www.bunkerweb.io/?utm_campaign=self&utm_source=bwdefault'
        condition: and

      - type: status
        status:
          - 200
