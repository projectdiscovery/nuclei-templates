id: turn-server

info:
  name: TURN Server
  author: johnk3r
  severity: info
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"TURN Server"
  tags: tech,discovery,turn

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>TURN Server</title>"

      - type: status
        status:
          - 200

    extractors:
      - type: kval
        part: header
        kval:
          - Server
