id: promptfoo-detect

info:
  name: Promptfoo - Detect
  author: rxerium
  severity: info
  description: |
    Promptfoo UI was detected.
  reference:
    - https://github.com/promptfoo/promptfoo
    - https://www.promptfoo.dev/docs/usage/web-ui/
  metadata:
    verified: true
    max-request: 1
    vendor: promptfoo
    product: promptfoo
    shodan-query: http.title:"promptfoo"
  tags: tech,promptfoo,ai,llm,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>promptfoo</title>"
          - 'content="LLM testing and evaluation"'
        condition: and

      - type: status
        status:
          - 200
