id: cups-detect

info:
  name: CUPS - Detect
  author: rxerium
  severity: info
  description: |
    An instance running CUPS was detected.
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"CUPS (IPP)"
  tags: cups,tech,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: regex
        part: header
        regex:
          - '(?mi)^Server: CUPS\b'

      - type: word
        part: body
        words:
          - "Web Interface is Disabled - CUPS"
          - "Forbidden - CUPS"
        condition: or

    extractors:
      - type: regex
        part: body
        name: version
        group: 1
        regex:
          - '(?i)<title>[^<]*- CUPS v?([0-9][0-9.]*)</title>'
