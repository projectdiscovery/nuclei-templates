id: archivesspace-detect

info:
  name: ArchivesSpace - Detect
  author: rxerium
  severity: info
  description: |
    ArchivesSpace is an open-source archives information management application.
  reference:
    - https://archivesspace.org/
    - https://github.com/archivesspace/archivesspace
  metadata:
    verified: true
    max-request: 1
    vendor: archivesspace
    product: archivesspace
    shodan-query: 'http.title:"ArchivesSpace"'
  tags: tech,detect,archivesspace,archives,library

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>[^<]*ArchivesSpace[^<]*</title>'

      - type: word
        part: header
        words:
          - '_archivesspace-public_session='

      - type: status
        status:
          - 200
