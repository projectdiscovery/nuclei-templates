id: pterodactyl-wings-detect

info:
  name: Pterodactyl Wings - Detect
  author: nycolazsec
  severity: info
  description: |
    Detects Pterodactyl Wings, the daemon that runs game servers for the Pterodactyl panel. Its API answers an unauthenticated request with its own error message.
  reference:
    - https://github.com/pterodactyl/wings
  metadata:
    max-request: 1
    vendor: pterodactyl
    product: wings
  tags: tech,pterodactyl,wings,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/system"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 401

      - type: word
        part: body
        words:
          - "The required authorization heads were not present in the request"
