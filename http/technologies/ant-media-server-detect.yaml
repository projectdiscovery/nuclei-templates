id: ant-media-server-detect

info:
  name: Ant Media Server - Detect
  author: rxerium
  severity: info
  description: |
    Ant Media Server is a streaming server supporting WebRTC and other streaming protocols.
  reference:
    - https://github.com/ant-media/Ant-Media-Server
  metadata:
    verified: true
    max-request: 1
    vendor: ant_media
    product: ant_media_server
    shodan-query: 'http.title:"Ant Media Server"'
  tags: antmedia,tech,detect,streaming,webrtc

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Management of Ant Media Server</title>"
          - "assets/css/ant-media.css"
        condition: and

      - type: status
        status:
          - 200
