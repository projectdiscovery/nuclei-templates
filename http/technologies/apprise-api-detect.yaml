id: apprise-api-detect

info:
  name: Apprise API - Detect
  author: rxerium
  severity: info
  description: |
    Apprise API, a REST interface for the Apprise notification library, was detected.
  reference:
    - https://github.com/caronc/apprise-api
  metadata:
    verified: true
    max-request: 1
    vendor: caronc
    product: apprise-api
    shodan-query: http.title:"Apprise API"
  tags: tech,apprise,api,notification,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>\s*Apprise API\s*</title>'

      - type: word
        part: body
        words:
          - '/s/favicon.ico'
          - 'Apprise Logo'
        condition: and

      - type: status
        status:
          - 200
