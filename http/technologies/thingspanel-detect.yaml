id: thingspanel-detect

info:
  name: ThingsPanel - Detect
  author: rxerium
  severity: info
  description: |
    ThingsPanel is an open-source IoT platform for device management, data collection, and visualisation.
  reference:
    - https://thingspanel.io/
    - https://github.com/ThingsPanel/thingspanel-go
  metadata:
    verified: true
    max-request: 1
    vendor: thingspanel
    product: thingspanel
    shodan-query: 'http.title:"ThingsPanel"'
  tags: thingspanel,tech,iot,device-management,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>ThingsPanel</title>'
          - "clarity', 'script', 'no47mbcicr'"
        condition: and

      - type: status
        status:
          - 200
