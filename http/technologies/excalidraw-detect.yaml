id: excalidraw-detect

info:
  name: Excalidraw - Detect
  author: rxerium
  severity: info
  description: |
    Excalidraw, an open-source virtual whiteboard for collaborative diagrams, was detected.
  reference:
    - https://excalidraw.com/
    - https://github.com/excalidraw/excalidraw
  metadata:
    verified: true
    max-request: 1
    vendor: excalidraw
    product: excalidraw
    shodan-query: 'http.title:"Excalidraw"'
  tags: tech,excalidraw,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'property="og:site_name" content="Excalidraw"'
          - 'window.EXCALIDRAW_ASSET_PATH ='
        condition: and

      - type: status
        status:
          - 200
