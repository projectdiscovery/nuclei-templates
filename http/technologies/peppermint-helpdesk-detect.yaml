id: peppermint-helpdesk-detect

info:
  name: Peppermint Helpdesk - Detect
  author: rxerium
  severity: info
  description: |
    Peppermint is an open-source issue management and helpdesk application.
  reference:
    - https://github.com/Peppermint-Lab/peppermint
  metadata:
    verified: true
    max-request: 1
    vendor: peppermint-lab
    product: peppermint
    shodan-query: 'http.title:"Peppermint"'
  tags: peppermint,helpdesk,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Peppermint</title>'
          - 'content="Ticket management system selfhosted open source"'
        condition: and

      - type: status
        status:
          - 200
