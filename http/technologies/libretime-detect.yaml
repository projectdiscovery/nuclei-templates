id: libretime-detect

info:
  name: LibreTime - Detect
  author: rxerium
  severity: info
  description: |
    LibreTime is an open-source radio broadcast and automation platform.
  reference:
    - https://github.com/libretime/libretime
  metadata:
    verified: true
    max-request: 1
    vendor: libretime
    product: libretime
    shodan-query: 'http.title:"LibreTime"'
  tags: libretime,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '<title>[^<]*LibreTime</title>'

      - type: word
        part: body
        words:
          - '/css/radio-page/radio-page.css'
          - '/embed/weekly-program'
        condition: and

      - type: status
        status:
          - 200
