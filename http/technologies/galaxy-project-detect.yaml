id: galaxy-project-detect

info:
  name: Galaxy Project - Detect
  author: rxerium
  severity: info
  description: |
    Galaxy web-based life-science data analysis platform was detected.
  reference:
    - https://galaxyproject.org/
    - https://github.com/galaxyproject/galaxy
  metadata:
    verified: true
    max-request: 1
    vendor: galaxyproject
    product: galaxy
    shodan-query: 'http.html:"Galaxy" http.html:"/static/dist/base.css"'
  tags: tech,galaxy,bioinformatics,science,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '/static/dist/base.css'
          - 'Javascript Required for Galaxy'
        condition: and

      - type: regex
        part: body
        regex:
          - '(?is)<title>\s*Galaxy(?:\s*\|[^<]*)?\s*</title>'

      - type: status
        status:
          - 200
