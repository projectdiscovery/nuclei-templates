id: solarassistant-detect

info:
  name: SolarAssistant - Detect
  author: rxerium
  severity: info
  description: |
    SolarAssistant provides local monitoring and control for solar inverters and battery systems.
  reference:
    - https://solar-assistant.io/
  metadata:
    verified: true
    max-request: 1
    vendor: solarassistant
    product: solarassistant
    shodan-query: 'http.title:"SolarAssistant"'
  tags: solarassistant,tech,iot,solar,energy,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/sign_in"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>SolarAssistant</title>'
          - 'phx-track-static'
        condition: and

      - type: word
        part: header
        words:
          - '_solar_assistant_key='

      - type: status
        status:
          - 200
