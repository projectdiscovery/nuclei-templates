id: keila-detect

info:
  name: Keila - Detect
  author: rxerium
  severity: info
  description: |
    Keila, an open-source email newsletter and campaign platform, was detected.
  reference:
    - https://www.keila.io/
    - https://github.com/pentacent/keila
  metadata:
    verified: true
    max-request: 1
    vendor: pentacent
    product: keila
    shodan-query: 'http.title:"Keila"'
  tags: tech,keila,newsletter,marketing,mail,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?is)<title>\s*Sign in\s*·\s*Keila\s*</title>'

      - type: word
        part: body
        words:
          - 'content="Open Source Newsletters"'
          - 'placeholder="you@keila.io"'
        condition: and

      - type: status
        status:
          - 200
