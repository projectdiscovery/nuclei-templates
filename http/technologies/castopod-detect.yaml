id: castopod-detect

info:
  name: Castopod - Detect
  author: rxerium
  severity: info
  description: |
    Castopod is an open-source podcast hosting and publishing platform.
  reference:
    - https://castopod.org/
    - https://code.castopod.org/adaures/castopod
  metadata:
    verified: true
    max-request: 1
    vendor: ad_aures
    product: castopod
    shodan-query: 'http.html:"Castopod"'
  tags: castopod,tech,detect,podcast,media

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'property="og:site_name" content="Castopod"'
          - 'https://castopod.org'
        condition: and

      - type: status
        status:
          - 200
