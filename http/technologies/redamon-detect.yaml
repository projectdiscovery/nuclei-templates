id: redamon-detect

info:
  name: RedAmon - Detect
  author: rxerium
  severity: info
  description: |
    Detected RedAmon, a security reconnaissance and vulnerability assessment dashboard built on Next.js. The inline theme marker redamon-theme was server-rendered into every page, making it a reliable unique anchor even behind variant titles.
  reference:
    - https://github.com/samugit83/RedAmon
    - https://blog.gitguardian.com/ai-pentesting-tools-beyond-artex/
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"RedAmon"
  tags: tech,redamon,detect,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'RedAmon'
          - 'redamon-theme'
        condition: and

      - type: status
        status:
          - 200
