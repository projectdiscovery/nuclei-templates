id: invoice-ninja-detect

info:
  name: Invoice Ninja - Detect
  author: rxerium
  severity: info
  description: |
    Invoice Ninja is an open-source invoicing and payment platform.
  reference:
    - https://invoiceninja.com/
    - https://github.com/invoiceninja/invoiceninja
  metadata:
    verified: true
    max-request: 1
    vendor: invoiceninja
    product: invoiceninja
    shodan-query: http.title:"Invoice Ninja"
  tags: tech,invoice-ninja,invoicing,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Invoice Ninja</title>'
          - '/bundle.'
          - '/manifest.json'
        condition: and

      - type: status
        status:
          - 200
