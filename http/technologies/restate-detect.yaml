id: restate-detect

info:
  name: Restate - Detect
  author: rxerium
  severity: info
  description: |
    Restate is a durable execution platform for building resilient distributed applications and workflows.
  reference:
    - https://github.com/restatedev/restate
    - https://restate.dev/
  metadata:
    verified: true
    max-request: 1
    vendor: restatedev
    product: restate
    shodan-query: 'http.title:"Restate" port:9070'
  tags: tech,restate,workflow,durable-execution,orchestration,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>Restate</title>")'
          - 'contains_all(body, "/ui/", "window.__reactRouterRouteModules")'
        condition: and
