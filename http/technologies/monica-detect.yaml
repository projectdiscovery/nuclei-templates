id: monica-detect

info:
  name: Monica - Detect
  author: rxerium
  severity: info
  description: |
    Monica is an open-source personal relationship management application.
  reference:
    - https://www.monicahq.com/
    - https://github.com/monicahq/monica
  metadata:
    verified: true
    max-request: 1
    vendor: monicahq
    product: monica
    shodan-query: http.title:"Monica – personal relationship manager"
  tags: tech,monica,crm,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Monica'
          - 'img/monica.svg'
        condition: and

      - type: status
        status:
          - 200
