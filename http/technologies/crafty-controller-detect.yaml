id: crafty-controller-detect

info:
  name: Crafty Controller - Detect
  author: rxerium
  severity: info
  description: |
    Crafty Controller is an open-source Minecraft server management interface.
  reference:
    - https://gitlab.com/crafty-controller/crafty-4
  metadata:
    verified: true
    max-request: 1
    vendor: crafty_controller
    product: crafty_controller
    shodan-query: 'http.html:"Crafty Controller"'
  tags: crafty,tech,detect,gaming,minecraft

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Crafty Controller</title>"
          - "/static/assets/crafty.webmanifest"
          - "/static/assets/css/crafty.css"
        condition: and

      - type: status
        status:
          - 200
