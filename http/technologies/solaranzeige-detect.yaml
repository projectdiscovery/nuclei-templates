id: solaranzeige-detect

info:
  name: Solaranzeige - Detect
  author: rxerium
  severity: info
  description: |
    Solaranzeige is an open-source monitoring platform for photovoltaic and energy systems.
  reference:
    - https://solaranzeige.de/
    - https://github.com/solaranzeige/solaranzeige
  metadata:
    verified: true
    max-request: 1
    vendor: solaranzeige
    product: solaranzeige
    shodan-query: 'http.title:"Solaranzeige"'
  tags: solaranzeige,tech,iot,solar,energy,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Open Source Projekt Solaranzeige</title>'
          - '<title>Solaranzeige</title>'
        condition: or

      - type: status
        status:
          - 200
