id: homegenie-detect

info:
  name: HomeGenie - Detect
  author: rxerium
  severity: info
  description: |
    HomeGenie is a programmable home automation server for integrating and controlling connected devices.
  reference:
    - https://homegenie.it/
    - https://github.com/genielabs/HomeGenie
  metadata:
    verified: true
    max-request: 1
    vendor: genielabs
    product: homegenie
    shodan-query: 'http.title:"HomeGenie"'
  tags: homegenie,tech,iot,home-automation,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?is)<title>\s*HomeGenie(?:\s*-\s*YoT)?\s*</title>'

      - type: word
        part: header
        words:
          - 'MIG WebService Gateway'

      - type: status
        status:
          - 200
