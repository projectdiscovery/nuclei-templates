id: strix-detect

info:
  name: Strix - Detect
  author: rxerium
  severity: info
  description: |
    Detected the results viewer of Strix, an agentic penetration testing CLI. The viewer was normally bound to 127.0.0.1 with a signed token, so a publicly reachable instance indicated a misconfiguration exposing pentest results.
  reference:
    - https://github.com/usestrix/strix
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"Strix Results"
  tags: tech,strix,detect,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Strix Results</title>'

      - type: status
        status:
          - 200
