id: zulip-detect

info:
  name: Zulip - Detect
  author: rxerium
  severity: info
  description: |
    Zulip, an open-source team chat and collaboration platform, was detected.
  reference:
    - https://zulip.com/
    - https://github.com/zulip/zulip
  metadata:
    verified: true
    max-request: 1
    vendor: zulip
    product: zulip
    shodan-query: 'http.title:"Zulip"'
  tags: tech,zulip,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'property="og:site_name" content="Zulip"'
          - '/static/webpack-bundles/'
        condition: and

      - type: status
        status:
          - 200
