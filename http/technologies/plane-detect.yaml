id: plane-detect

info:
  name: Plane - Detect
  author: rxerium
  severity: info
  description: |
    Plane, an open-source project management platform, was detected.
  reference:
    - https://github.com/makeplane/plane
    - https://plane.so/
  metadata:
    verified: true
    max-request: 1
    vendor: makeplane
    product: plane
    shodan-query: 'http.title:"Plane | Simple, extensible, open-source project management tool."'
  tags: tech,plane,makeplane,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "<title>Plane | Simple, extensible, open-source project management tool.</title>", "content=\"https://app.plane.so/\"")'
        condition: and
