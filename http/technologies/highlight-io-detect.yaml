id: highlight-io-detect

info:
  name: Highlight.io - Detect
  author: rxerium
  severity: info
  description: |
    Highlight.io is an open-source full-stack monitoring and observability platform.
  reference:
    - https://www.highlight.io/
    - https://github.com/highlight/highlight
  metadata:
    verified: true
    max-request: 1
    vendor: highlight
    product: highlight
    shodan-query: http.title:"Highlight.io"
  tags: tech,highlight,detect,monitoring,observability

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>highlight.io</title>'
          - 'highlight.io | The Open Source, Fullstack Monitoring Platform'
          - '@highlight-run/rrweb'
        condition: and

      - type: status
        status:
          - 200
