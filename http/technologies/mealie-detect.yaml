id: mealie-detect

info:
  name: Mealie - Detect
  author: ChrisJr404
  severity: info
  description: |
    Detects Mealie instances through the unauthenticated about API endpoint and extracts the running version. Mealie is a self hosted recipe manager and meal planner.
  reference:
    - https://mealie.io/
    - https://github.com/mealie-recipes/mealie
    - https://docs.mealie.io/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Mealie"
  tags: tech,mealie,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/app/about"
 
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "json")'
          - 'contains_all(body, "\"allowPasswordLogin\"", "\"defaultHouseholdSlug\"", "\"allowedIframeHosts\"")'
        condition: and
 
    extractors:
      - type: json
        part: body
        json:
          - '.version'
