id: lufi-detect

info:
  name: Lufi - Detect
  author: rxerium
  severity: info
  description: |
    Lufi is a self-hosted encrypted file-sharing application.
  reference:
    - https://framagit.org/fiat-tux/hat-softwares/lufi
  metadata:
    verified: true
    max-request: 1
    vendor: fiat-tux
    product: lufi
    shodan-query: http.title:"Lufi"
  tags: tech,lufi,file-sharing,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Lufi</title>"
          - "/css/lufi.css"
        condition: and

      - type: status
        status:
          - 200
