id: qnap-qts-detect

info:
  name: QNAP QTS - Version Detection
  author: mr-pmillz
  severity: info
  description: |
    Detects QNAP QTS and extracts firmware version and build information exposed by the authentication endpoint without credentials.
  reference:
    - https://www.qnap.com/qts/
    - https://download.qnap.com/dev/API_QNAP_QTS_Authentication.pdf
  classification:
    cpe: cpe:2.3:o:qnap:qts:*:*:*:*:*:*:*:*
  metadata:
    vendor: qnap
    product: qts
    shodan-query: 'product:"QNAP"'
    fofa-query: 'title="QNAP Turbo NAS"'
  tags: tech,detect,qnap,qts,qnap-qts,nas,version,discovery

http:
  - raw:
      - |
        POST /cgi-bin/authLogin.cgi HTTP/1.1
        Host: {{Hostname}}
        Accept: */*
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 21

        r=0.42529302281992154
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "<version><!\\[CDATA\\[([\\d.]+)\\]\\]></version>"
      - type: regex
        part: body
        regex:
          - "<build><!\\[CDATA\\[(\\d+)\\]\\]></build>"

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "<version><!\\[CDATA\\[([\\d.]+)\\]\\]></version>"
          - "<build><!\\[CDATA\\[(\\d+)\\]\\]></build>"
