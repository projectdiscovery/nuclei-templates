id: htmly-detect

info:
  name: HTMLy - Detect
  author: rxerium
  severity: info
  description: |
    HTMLy is an open-source, database-less blogging platform written in PHP.
  reference:
    - https://www.htmly.com/
    - https://github.com/danpros/htmly
  metadata:
    verified: true
    max-request: 1
    vendor: htmly
    product: htmly
    shodan-query: http.html:'meta name="generator" content="HTMLy'
  tags: tech,detect,htmly,cms,blog

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '<meta name="generator" content="HTMLy(?: v[0-9.]+)?"\s*/?>'

      - type: regex
        part: body
        regex:
          - 'href=["''][^"'']*/feed/rss["'']'

      - type: status
        status:
          - 200
