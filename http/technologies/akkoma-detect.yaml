id: akkoma-detect

info:
  name: Akkoma - Detect
  author: rxerium
  severity: info
  description: |
    Akkoma is a federated microblogging server forked from Pleroma.
  reference:
    - https://akkoma.social/
    - https://akkoma.dev/AkkomaGang/akkoma
  metadata:
    verified: true
    max-request: 1
    vendor: akkoma
    product: akkoma
    shodan-query: 'http.html:"Akkoma"'
  tags: akkoma,pleroma,fediverse,social,activitypub,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/instance"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"version"'
          - 'compatible; Akkoma '
        condition: and

      - type: word
        part: content_type
        words:
          - application/json

      - type: status
        status:
          - 200
