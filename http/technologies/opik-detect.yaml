id: opik-detect

info:
  name: Comet Opik - Detect
  author: rxerium
  severity: info
  description: |
    Opik is an open-source observability and evaluation platform for LLM applications, RAG systems, and AI agents.
  reference:
    - https://github.com/comet-ml/opik
    - https://www.comet.com/site/products/opik/
  metadata:
    verified: true
    max-request: 1
    vendor: comet-ml
    product: opik
    shodan-query: 'http.title:"Comet Opik"'
  tags: tech,opik,comet,ai,llm,observability,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Comet Opik</title>'
          - '<div class="size-full" id="root"></div>'
        condition: and

      - type: status
        status:
          - 200
