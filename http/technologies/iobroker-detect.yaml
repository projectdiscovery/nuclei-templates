id: iobroker-detect

info:
  name: ioBroker - Detect
  author: rxerium
  severity: info
  description: |
    ioBroker is an integration platform for home automation and building automation systems.
  reference:
    - https://www.iobroker.net/
    - https://github.com/ioBroker/ioBroker
  metadata:
    verified: true
    max-request: 1
    vendor: iobroker
    product: iobroker
    shodan-query: 'http.html:"ioBroker"'
  tags: iobroker,tech,iot,home-automation,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'ioBroker'

      - type: word
        part: body
        words:
          - '<title>Admin</title>'
          - '<title>Web Login (ioBroker)</title>'
          - '<title>ioBroker</title>'
        condition: or

      - type: status
        status:
          - 200
