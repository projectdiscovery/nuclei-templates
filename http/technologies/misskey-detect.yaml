id: misskey-detect

info:
  name: Misskey - Detect
  author: rxerium
  severity: info
  description: |
    Misskey is a federated social networking platform.
  reference:
    - https://misskey-hub.net/
    - https://github.com/misskey-dev/misskey
  metadata:
    verified: true
    max-request: 1
    vendor: misskey
    product: misskey
    shodan-query: 'http.html:"Thank you for using Misskey"'
  tags: misskey,fediverse,social,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Thank you for using Misskey!'
          - 'github.com/misskey-dev/misskey'
          - 'name="application-name" content="Misskey"'
        condition: and

      - type: status
        status:
          - 200
