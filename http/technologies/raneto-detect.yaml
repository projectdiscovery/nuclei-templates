id: raneto-detect

info:
  name: Raneto - Detect
  author: rxerium
  severity: info
  description: |
    Raneto is a Markdown-powered knowledge base and wiki for Node.js.
  reference:
    - https://github.com/ryanlelek/Raneto
  metadata:
    verified: true
    max-request: 1
    vendor: raneto
    product: raneto
    shodan-query: http.html:"Raneto"
  tags: tech,detect,raneto,wiki

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'var rn_base_url ='

      - type: word
        part: body
        words:
          - '/styles/raneto.css'

      - type: status
        status:
          - 200
