id: milvus-detect

info:
  name: Milvus - Detect
  author: s4e-io
  severity: info
  description: Milvus was detected.
  reference:
    - https://milvus.io/
    - https://github.com/milvus-io/milvus
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="Milvus"
  tags: tech,vector-database,milvus,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/healthz"
      - "{{BaseURL}}:9091/healthz"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - '<title>Milvus'
          - '<title>Milvus Demo'
          - '<title>Milvus Insight'
          - '<title>Milvus Enterprise Manager'
        condition: or

      - type: regex
        part: header
        regex:
          - '(?i)Server:\s*Milvus/[0-9]+(?:\.[0-9]+)*'

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - '(?i)Server:\s*Milvus/([0-9]+(?:\.[0-9]+)*)'
