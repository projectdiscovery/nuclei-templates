id: tinacms-detect

info:
  name: TinaCMS - Detect
  author: rxerium
  severity: info
  description: |
    TinaCMS is an open-source headless content management system with a visual editing interface.
  reference:
    - https://tina.io/
    - https://github.com/tinacms/tinacms
  metadata:
    verified: true
    max-request: 1
    vendor: tinacms
    product: tinacms
    shodan-query: http.html:"TinaCMS"
  tags: tech,detect,tinacms,cms

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - "contains_all(body, '<title>TinaCMS</title>', 'body class=\"tina-tailwind\"', '/admin/assets/')"
          - "status_code == 200"
        condition: and
