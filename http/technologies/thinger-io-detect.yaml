id: thinger-io-detect

info:
  name: Thinger.io - Detect
  author: rxerium
  severity: info
  description: |
    Thinger.io is an IoT platform for connecting, managing, and visualising connected devices.
  reference:
    - https://thinger.io/
    - https://docs.thinger.io/
  metadata:
    verified: true
    max-request: 1
    vendor: thinger-io
    product: thinger-io
    shodan-query: 'http.title:"Thinger.io"'
  tags: thinger,tech,iot,device-management,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Thinger.io | Cloud Console</title>'
          - '<title>Thinger.io - Cloud Console</title>'
        condition: or

      - type: status
        status:
          - 200
