id: swarmpit-detect

info:
  name: Swarmpit - Detect
  author: rxerium
  severity: info
  description: |
    Swarmpit is a self-hosted management interface for Docker Swarm clusters.
  reference:
    - https://swarmpit.io/
    - https://github.com/swarmpit/swarmpit
  metadata:
    verified: true
    max-request: 1
    vendor: swarmpit
    product: swarmpit
    shodan-query: http.title:"swarmpit"
  tags: tech,swarmpit,docker,swarm,management,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>swarmpit</title>"
          - 'content="Lightweight Docker Swarm management UI"'
        condition: and

      - type: status
        status:
          - 200
