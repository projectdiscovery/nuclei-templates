id: jirafeau-detect

info:
  name: Jirafeau - Detect
  author: rxerium
  severity: info
  description: |
    Jirafeau is a self-hosted web application for uploading files and sharing download links.
  reference:
    - https://gitlab.com/mojo42/Jirafeau
  metadata:
    verified: true
    max-request: 1
    vendor: mojo42
    product: jirafeau
    shodan-query: http.title:"Jirafeau"
  tags: tech,jirafeau,file-sharing,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "(?i)<title>Jirafeau[^<]*</title>"

      - type: word
        part: body
        words:
          - "media/courgette/favicon.ico"

      - type: status
        status:
          - 200
