id: openelis-detect

info:
  name: OpenELIS Global - Detect
  author: rxerium
  severity: info
  description: |
    OpenELIS Global open-source laboratory information system was detected.
  reference:
    - https://openelis-global.org/
    - https://github.com/DIGI-UW/OpenELIS-Global-2
  metadata:
    verified: true
    max-request: 1
    vendor: digi-uw
    product: openelis_global
    shodan-query: 'http.html:"OpenELIS Global FrontEnd"'
  tags: tech,openelis,lis,science,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<meta name="description" content="OpenELIS Global FrontEnd"'

      - type: regex
        part: body
        regex:
          - '(?i)<title>OpenELIS</title>'

      - type: status
        status:
          - 200
