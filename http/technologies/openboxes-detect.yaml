id: openboxes-detect

info:
  name: OpenBoxes - Detect
  author: rxerium
  severity: info
  description: |
    OpenBoxes open-source supply chain management system for healthcare organisations was detected.
  reference:
    - https://openboxes.com/
    - https://github.com/openboxes/openboxes
  metadata:
    verified: true
    max-request: 2
    vendor: openboxes
    product: openboxes
    shodan-query: http.html:"openboxes.css"
  tags: tech,openboxes,scm,healthcare,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/openboxes/auth/login"
      - "{{BaseURL}}/auth/login"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'openboxes.css'
          - 'id="loginContainer"'
        condition: and

      - type: status
        status:
          - 200
