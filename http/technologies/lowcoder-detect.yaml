id: lowcoder-detect

info:
  name: Lowcoder - Detect
  author: rxerium
  severity: info
  description: |
    Lowcoder is an open-source low-code application development platform.
  reference:
    - https://lowcoder.cloud/
    - https://github.com/lowcoder-org/lowcoder
  metadata:
    verified: true
    max-request: 2
    vendor: lowcoder-org
    product: lowcoder
    shodan-query: http.title:"Lowcoder | rapid App & VideoMeeting builder for everyone."
  tags: tech,lowcoder,detect,low-code

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title data-react-helmet="true">Lowcoder | rapid App & VideoMeeting builder for everyone.</title>'
        internal: true

      - type: status
        status:
          - 200
        internal: true

  - method: GET
    path:
      - "{{BaseURL}}/manifest.json"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '../lowcoder-design/src/'

      - type: word
        part: header
        words:
          - 'Content-Type: application/json'

      - type: status
        status:
          - 200
