id: taiga-detect

info:
  name: Taiga - Detect
  author: rxerium
  severity: info
  description: |
    Taiga, an open-source agile project management platform, was detected.
  reference:
    - https://taiga.io/
    - https://github.com/taigaio/taiga-front
  metadata:
    verified: true
    max-request: 1
    vendor: taigaio
    product: taiga
    shodan-query: 'http.title:"Taiga"'
  tags: tech,taiga,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Taiga</title>'
          - 'window.TAIGA_VERSION ='
        condition: and

      - type: status
        status:
          - 200
