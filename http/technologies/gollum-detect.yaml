id: gollum-detect

info:
  name: Gollum - Detect
  author: rxerium
  severity: info
  description: |
    Gollum is a Git-powered wiki with support for multiple markup formats.
  reference:
    - https://github.com/gollum/gollum
  metadata:
    verified: true
    max-request: 1
    vendor: gollum
    product: gollum
    shodan-query: http.html:"Gollum"
  tags: tech,detect,gollum,wiki

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '/gollum/assets/'

      - type: word
        part: body
        words:
          - "var pageFullPath ="
          - "var pageFullPath   ="
        condition: or

      - type: status
        status:
          - 200
