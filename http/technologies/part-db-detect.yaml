id: part-db-detect

info:
  name: Part-DB - Detect
  author: rxerium
  severity: info
  description: |
    Part-DB is an open-source inventory management system for electronic components and parts.
  reference:
    - https://docs.part-db.de/
    - https://github.com/Part-DB/Part-DB-server
  metadata:
    verified: true
    max-request: 1
    vendor: part-db
    product: part-db
    shodan-query: http.title:"Part-DB"
  tags: tech,part-db,inventory,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Part-DB</title>'
          - 'content="Part-DB"'
          - 'https://github.com/Part-DB/Part-DB-server'
        condition: and

      - type: status
        status:
          - 200
