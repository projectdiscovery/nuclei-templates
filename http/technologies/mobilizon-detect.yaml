id: mobilizon-detect

info:
  name: Mobilizon - Detect
  author: rxerium
  severity: info
  description: |
    Mobilizon is a federated platform for organising events and groups.
  reference:
    - https://joinmobilizon.org/
    - https://framagit.org/framasoft/mobilizon
  metadata:
    verified: true
    max-request: 1
    vendor: framasoft
    product: mobilizon
    shodan-query: 'http.html:"Mobilizon doesn''t work properly"'
  tags: mobilizon,fediverse,events,community,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Mobilizon doesn't work properly without JavaScript enabled"
          - '/feed/instance/atom'
          - '/feed/instance/ics'
        condition: and

      - type: status
        status:
          - 200
