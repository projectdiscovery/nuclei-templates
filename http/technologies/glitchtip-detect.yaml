id: glitchtip-detect

info:
  name: GlitchTip - Detect
  author: rxerium
  severity: info
  description: |
    GlitchTip is an open-source error tracking and application performance monitoring platform.
  reference:
    - https://glitchtip.com/
    - https://gitlab.com/glitchtip/glitchtip
  metadata:
    verified: true
    max-request: 1
    vendor: glitchtip
    product: glitchtip
    shodan-query: http.title:"GlitchTip"
  tags: tech,glitchtip,detect,monitoring

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>GlitchTip</title>'
          - '<base href="/"'
        condition: and

      - type: word
        part: header
        words:
          - 'glitchtip.com'

      - type: status
        status:
          - 200
