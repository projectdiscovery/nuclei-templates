id: coder-detect

info:
  name: Coder - Detect
  author: rxerium
  severity: info
  description: |
    Coder is a platform for provisioning and managing remote development environments.
  reference:
    - https://coder.com/
    - https://github.com/coder/coder
  metadata:
    verified: true
    max-request: 1
    vendor: coder
    product: coder
    shodan-query: http.title:"Coder"
  tags: tech,coder,detect,development

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Coder</title>'
          - 'meta property="build-info"'
        condition: and

      - type: word
        part: header
        words:
          - 'X-Coder-Build-Version:'

      - type: status
        status:
          - 200
