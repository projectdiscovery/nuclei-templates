id: keystonejs-detect

info:
  name: KeystoneJS - Detect
  author: rxerium
  severity: info
  description: |
    KeystoneJS is an open-source headless content management system and application framework for Node.js.
  reference:
    - https://keystonejs.com/
    - https://github.com/keystonejs/keystone
  metadata:
    verified: true
    max-request: 2
    vendor: keystonejs
    product: keystone
    shodan-query: http.title:"KeystoneJS"
  tags: tech,detect,keystonejs,cms,nodejs

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/admin"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - "contains(body, '<title>KeystoneJS</title>')"
          - "contains_any(body, 'Welcome to KeystoneJS', '/admin/js/main.')"
          - "status_code == 200"
        condition: and
