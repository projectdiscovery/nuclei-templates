id: kaui-detect

info:
  name: Kaui - Detect
  author: rxerium
  severity: info
  description: |
    Kaui is the administrative interface for the Kill Bill subscription billing and payment platform.
  reference:
    - https://killbill.io/kaui.html
    - https://github.com/killbill/killbill-admin-ui
  metadata:
    verified: true
    max-request: 1
    vendor: killbill
    product: kaui
    shodan-query: http.title:"Kaui"
  tags: tech,kaui,killbill,billing,subscription,payment,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Kaui</title>'

      - type: word
        part: header
        words:
          - '_kaui-standalone_session='

      - type: status
        status:
          - 200
