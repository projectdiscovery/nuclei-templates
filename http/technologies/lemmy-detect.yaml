id: lemmy-detect

info:
  name: Lemmy - Detect
  author: rxerium
  severity: info
  description: |
    Lemmy is a federated link aggregation and discussion platform.
  reference:
    - https://join-lemmy.org/
    - https://github.com/LemmyNet/lemmy
  metadata:
    verified: true
    max-request: 1
    vendor: lemmy
    product: lemmy
    shodan-query: 'http.html:"window.isoData" http.html:"site_res"'
  tags: lemmy,fediverse,forum,social,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'window.isoData = {'
          - '"site_res":'
          - '"local_site":'
        condition: and

      - type: status
        status:
          - 200
