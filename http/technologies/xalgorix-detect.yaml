id: xalgorix-detect

info:
  name: Xalgorix - Detect
  author: rxerium
  severity: info
  description: |
    Detected the Xalgorix autonomous AI penetration testing dashboard, a self-hosted Go + TypeScript platform that normally bound to loopback (127.0.0.1:9137) but was exposed when Docker published the port (also observed on 1337).
  reference:
    - https://github.com/xalgord/xalgorix
    - https://blog.gitguardian.com/ai-pentesting-tools-beyond-artex/
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"Xalgorix"
  tags: tech,xalgorix,detect,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Xalgorix'

      - type: status
        status:
          - 200
