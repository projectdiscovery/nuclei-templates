id: netmaker-detect

info:
  name: Netmaker - Detect
  author: rxerium
  severity: info
  description: |
    Netmaker is a platform for creating and managing WireGuard-based networks.
  reference:
    - https://www.netmaker.io/
    - https://github.com/gravitl/netmaker
  metadata:
    verified: true
    max-request: 1
    vendor: gravitl
    product: netmaker
    shodan-query: http.title:"Netmaker"
  tags: tech,netmaker,detect,wireguard

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Netmaker</title>'

      - type: word
        part: body
        words:
          - 'id="nmui-loading"'
          - 'The management UI for Netmaker. Netmaker makes networks.'
        condition: or

      - type: status
        status:
          - 200
