id: trigger-dev-detect

info:
  name: Trigger.dev - Detect
  author: rxerium
  severity: info
  description: |
    Trigger.dev is an open-source platform for building and running background jobs.
  reference:
    - https://trigger.dev/
    - https://github.com/triggerdotdev/trigger.dev
  metadata:
    verified: true
    max-request: 1
    vendor: triggerdotdev
    product: trigger.dev
    shodan-query: http.title:"Login to Trigger.dev"
  tags: tech,trigger-dev,detect,automation

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Login to Trigger.dev</title>'
          - 'href="https://trigger.dev"'
        condition: and

      - type: status
        status:
          - 200
