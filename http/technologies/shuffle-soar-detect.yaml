id: shuffle-soar-detect

info:
  name: Shuffle SOAR - Detect
  author: rxerium
  severity: info
  description: |
    Shuffle is an open-source security automation platform focused on collaboration and resource sharing.
  reference:
    - https://shuffler.io/
    - https://github.com/Shuffle/Shuffle
  metadata:
    verified: true
    max-request: 1
    vendor: shuffle
    product: shuffle
    shodan-query: http.title:"Shuffle"
  tags: tech,detect,shuffle,soar,security

http:
  - method: GET
    path:
      - "{{BaseURL}}/manifest.json"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"short_name": "Shuffle"'
          - '"name": "Shuffle webapp"'
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
