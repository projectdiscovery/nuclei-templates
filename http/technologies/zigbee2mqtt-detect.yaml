id: zigbee2mqtt-detect

info:
  name: Zigbee2MQTT - Detect
  author: rxerium
  severity: info
  description: |
    Zigbee2MQTT bridges Zigbee devices to MQTT without requiring a vendor gateway.
  reference:
    - https://github.com/Koenkk/zigbee2mqtt
    - https://www.zigbee2mqtt.io/
  metadata:
    verified: true
    max-request: 1
    vendor: koenkk
    product: zigbee2mqtt
    shodan-query: 'http.html:"Zigbee2MQTT"'
  tags: zigbee2mqtt,tech,iot,mqtt,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Zigbee2MQTT</title>'

      - type: regex
        part: body
        regex:
          - 'href="\./assets/favicon-[a-f0-9]+\.ico"'

      - type: status
        status:
          - 200
