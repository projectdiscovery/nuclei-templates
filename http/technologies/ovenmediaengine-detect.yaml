id: ovenmediaengine-detect

info:
  name: OvenMediaEngine - Detect
  author: rxerium
  severity: info
  description: |
    OvenMediaEngine is a low-latency live streaming server.
  reference:
    - https://github.com/OvenMediaLabs/OvenMediaEngine
  metadata:
    verified: true
    max-request: 1
    vendor: ovenmedialabs
    product: ovenmediaengine
    shodan-query: 'http.html:"OvenMediaEngine"'
  tags: ovenmediaengine,tech,detect,streaming,webrtc

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>OvenMediaEngine Enterprise</title>"
          - 'content="OvenStudio"'
        condition: and

      - type: status
        status:
          - 200
