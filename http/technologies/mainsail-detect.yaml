id: mainsail-detect

info:
  name: Mainsail - Detect
  author: rxerium
  severity: info
  description: |
    Mainsail is a web interface for managing Klipper-based 3D printers.
  reference:
    - https://github.com/mainsail-crew/mainsail
    - https://docs.mainsail.xyz/
  metadata:
    verified: true
    max-request: 1
    vendor: mainsail-crew
    product: mainsail
    shodan-query: 'http.title:"Mainsail"'
  tags: mainsail,tech,iot,3d-printing,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Mainsail</title>'
          - 'content="Mainsail is the popular web interface for Klipper."'
        condition: and

      - type: status
        status:
          - 200
