id: lizmap-detect

info:
  name: Lizmap - Detect
  author: rxerium
  severity: info
  description: |
    Lizmap is an open-source web application for publishing QGIS projects.
  reference:
    - https://www.lizmap.com/
    - https://github.com/3liz/lizmap-web-client
  metadata:
    verified: true
    max-request: 1
    vendor: 3liz
    product: lizmap_web_client
    shodan-query: 'http.title:"Lizmap"'
  tags: tech,detect,lizmap,geospatial,qgis

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>[^<]*Lizmap[^<]*</title>'

      - type: word
        part: body
        words:
          - '/lizmap/assets/js/view.js'
          - '/assets/js/view.js'
        condition: or

      - type: status
        status:
          - 200
