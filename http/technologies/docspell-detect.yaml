id: docspell-detect

info:
  name: Docspell - Detect
  author: rxerium
  severity: info
  description: |
    Docspell is an open-source document organiser and management system.
  reference:
    - https://docspell.org/
    - https://github.com/eikek/docspell
  metadata:
    verified: true
    max-request: 1
    vendor: docspell
    product: docspell
    shodan-query: http.title:"Docspell"
  tags: tech,docspell,dms,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Docspell</title>'
          - '/assets/docspell-webapp/'
        condition: and

      - type: status
        status:
          - 200
