id: ckan-detect

info:
  name: CKAN - Detect
  author: rxerium
  severity: info
  description: |
    CKAN is an open-source data management system for publishing data hubs and portals.
  reference:
    - https://ckan.org/
    - https://github.com/ckan/ckan
  classification:
    cpe: cpe:2.3:a:okfn:ckan:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: okfn
    product: ckan
    shodan-query: 'http.title:"CKAN"'
  tags: tech,detect,ckan,data,portal

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<meta name="generator" content="ckan [^"<]+"\s*/?>'

      - type: word
        part: body
        words:
          - '/base/images/ckan.ico'

      - type: status
        status:
          - 200
