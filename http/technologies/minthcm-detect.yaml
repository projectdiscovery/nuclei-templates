id: minthcm-detect

info:
  name: MintHCM - Detect
  author: rxerium
  severity: info
  description: |
    MintHCM is an open-source human capital management system.
  reference:
    - https://minthcm.org/
    - https://github.com/minthcm/minthcm
  metadata:
    verified: true
    max-request: 1
    vendor: minthcm
    product: minthcm
    shodan-query: http.title:"MintHCM"
  tags: tech,minthcm,hcm,hrms,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>MintHCM</title>'
          - './assets/index.'
          - '<div id="app"></div>'
        condition: and

      - type: status
        status:
          - 200
