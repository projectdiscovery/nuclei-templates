id: umbrel-detect

info:
  name: Umbrel - Detect
  author: rxerium
  severity: info
  description: |
    Umbrel is a self-hosted home server operating system.
  reference:
    - https://umbrel.com/
    - https://github.com/getumbrel/umbrel
  metadata:
    verified: true
    max-request: 1
    vendor: umbrel
    product: umbrel
    shodan-query: http.title:"Umbrel"
  tags: tech,umbrel,detect,self-hosted

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Umbrel</title>'

      - type: word
        part: body
        words:
          - '<h1>umbrelOS</h1>'
          - "Umbrel doesn't work properly without JavaScript enabled"
        condition: or

      - type: status
        status:
          - 200
