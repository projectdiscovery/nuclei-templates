id: komodo-detect

info:
  name: Komodo - Detect
  author: rxerium
  severity: info
  description: |
    Komodo, a web application for building and deploying software across servers, was detected.
  reference:
    - https://github.com/moghtech/komodo
  metadata:
    verified: true
    max-request: 1
    vendor: moghtech
    product: komodo
    shodan-query: http.title:"Komodo"
  tags: tech,komodo,devops,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Komodo</title>'
          - 'name="apple-mobile-web-app-title" content="Komodo"'
        condition: and

      - type: status
        status:
          - 200
