id: calaos-webapp-detect

info:
  name: Calaos Web App - Detect
  author: rxerium
  severity: info
  description: |
    Calaos is an open-source home automation platform with a browser-based control interface.
  reference:
    - https://www.calaos.fr/
    - https://github.com/calaos/calaos_web
  metadata:
    verified: true
    max-request: 1
    vendor: calaos
    product: calaos-web-app
    shodan-query: 'http.title:"Calaos Web App"'
  tags: calaos,tech,iot,home-automation,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Calaos Web App</title>'
          - 'ng-app=calaosApp'
        condition: and

      - type: status
        status:
          - 200
