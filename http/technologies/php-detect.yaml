id: php-detect

info:
  name: PHP Detect
  author: y0no
  severity: info
  classification:
    cpe: cpe:2.3:a:php:php:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: php
    product: php
    shodan-query: "X-Powered-By: PHP"
  tags: tech,php,discovery

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - contains(header, "PHP/") || contains(header, "PHPSESSID") || contains(header, ".php")

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - "(?i)PHP/([0-9.]+)"
