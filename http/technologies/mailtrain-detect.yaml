id: mailtrain-detect

info:
  name: Mailtrain - Detect
  author: rxerium
  severity: info
  description: |
    Mailtrain, an open-source self-hosted newsletter application, was detected.
  reference:
    - https://github.com/Mailtrain-org/mailtrain
  metadata:
    verified: true
    max-request: 1
    vendor: mailtrain
    product: mailtrain
    shodan-query: 'http.title:"Mailtrain"'
  tags: tech,mailtrain,newsletter,marketing,mail,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'content="Self hosted email newsletter app"'
          - 'window.mailtrainConfig'
          - '/client/mailtrain.css'
        condition: and

      - type: status
        status:
          - 200
