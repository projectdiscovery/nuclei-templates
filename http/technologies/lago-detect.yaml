id: lago-detect

info:
  name: Lago - Detect
  author: rxerium
  severity: info
  description: |
    Lago is an open-source metering and usage-based billing platform.
  reference:
    - https://www.getlago.com/
    - https://github.com/getlago/lago
  metadata:
    verified: true
    max-request: 1
    vendor: getlago
    product: lago
    shodan-query: http.title:"Lago"
  tags: tech,lago,billing,subscription,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Lago'
          - '<script src="env-config.js"></script>'
        condition: and

      - type: status
        status:
          - 200
