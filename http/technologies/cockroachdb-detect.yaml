id: cockroachdb-detect

info:
  name: CockroachDB DB Console - Detect
  author: rxerium
  severity: info
  description: |
    CockroachDB DB Console, the web-based administrative interface for CockroachDB clusters, was detected.
  reference:
    - https://www.cockroachlabs.com/docs/stable/ui-overview
  metadata:
    max-request: 1
    shodan-query: 'product:"CockroachDB"'
  tags: tech,cockroachdb,database,console

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Cockroach Console</title>"

      - type: status
        status:
          - 200
