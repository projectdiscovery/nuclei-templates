id: publii-detect

info:
  name: Publii - Detect
  author: rxerium
  severity: info
  description: |
    Publii is an open-source desktop static-site CMS and publishing application.
  reference:
    - https://getpublii.com/
    - https://github.com/GetPublii/Publii
  metadata:
    verified: true
    max-request: 1
    vendor: getpublii
    product: publii
    shodan-query: http.html:"Publii Open-Source CMS for Static Site"
  tags: tech,detect,publii,cms,static-site

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<meta name="generator" content="Publii Open-Source CMS for Static Site">'

      - type: regex
        part: body
        regex:
          - 'href=["''][^"'']*/assets/css/style\.css\?v=[a-f0-9]+'

      - type: status
        status:
          - 200
