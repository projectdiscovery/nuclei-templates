id: flowfuse-detect

info:
  name: FlowFuse - Detect
  author: rxerium
  severity: info
  description: |
    FlowFuse is an industrial application platform built around Node-RED for edge data collection, integration, and operational workflows.
  reference:
    - https://flowfuse.com/
    - https://github.com/FlowFuse/flowfuse
  metadata:
    verified: true
    max-request: 1
    vendor: flowfuse
    product: flowfuse
    shodan-query: 'http.title:"FlowFuse"'
  tags: flowfuse,flowforge,tech,node-red,industrial,iot,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>FlowFuse</title>'
          - '<title>Log in - FlowFuse</title>'
          - '<title>FlowFuse Dashboard</title>'
        condition: or

      - type: word
        part: body
        words:
          - "FlowFuse doesn't work properly without JavaScript enabled"
          - 'meta name="description" content="FlowFuse Dashboard"'
          - 'theme&#x2F;css&#x2F;forge-common.css'
        condition: or

      - type: status
        status:
          - 200
