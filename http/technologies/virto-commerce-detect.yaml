id: virto-commerce-detect

info:
  name: Virto Commerce - Detect
  author: rxerium
  severity: info
  description: |
    Virto Commerce management interface was detected.
  reference:
    - https://virtocommerce.com/
    - https://github.com/VirtoCommerce/vc-platform
  metadata:
    verified: true
    max-request: 1
    vendor: virtocommerce
    product: virto_commerce
    shodan-query: 'http.title:"Virto Commerce"'
  tags: tech,virto-commerce,commerce,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Virto Commerce "

      - type: word
        part: body
        words:
          - "/modules/$(VirtoCommerce."
          - "VirtoCommerce Manager"
        condition: or

      - type: status
        status:
          - 200
