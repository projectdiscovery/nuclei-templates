id: typemill-detect

info:
  name: TypeMill - Detect
  author: rxerium
  severity: info
  description: |
    TypeMill is an open-source flat-file content management system designed for text-driven websites.
  reference:
    - https://typemill.net/
    - https://github.com/typemill/typemill
  metadata:
    verified: true
    max-request: 1
    vendor: typemill
    product: typemill
    shodan-query: http.html:"TYPEMILL"
  tags: tech,detect,typemill,cms

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - "contains(tolower(all_headers), 'x-powered-by: typemill')"
          - "status_code == 200"
        condition: and
