id: pluxml-detect

info:
  name: PluXml - Detect
  author: rxerium
  severity: info
  description: |
    PluXml is an open-source, database-free content management system that stores content in XML files.
  reference:
    - https://www.pluxml.org/
    - https://github.com/pluxml/PluXml
  metadata:
    verified: true
    max-request: 1
    vendor: pluxml
    product: pluxml
    shodan-query: http.html:"plucss.css" http.html:"feed.php?rss/commentaires"
  tags: tech,detect,pluxml,cms,blog

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - 'href=["''][^"'']*/themes/[^/]+/css/plucss(?:\.min)?\.css\?v=[0-9.]+'

      - type: regex
        part: body
        regex:
          - 'href=["''][^"'']*/feed\.php\?rss/commentaires["'']'

      - type: status
        status:
          - 200
