id: autobrr-detect

info:
  name: autobrr - Detect
  author: rxerium
  severity: info
  description: |
    autobrr is a download automation tool for torrents and Usenet.
  reference:
    - https://github.com/autobrr/autobrr
  metadata:
    verified: true
    max-request: 1
    vendor: autobrr
    product: autobrr
    shodan-query: 'http.title:"autobrr"'
  tags: autobrr,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>autobrr</title>'
          - '<meta name="description" content="autobrr"'
        condition: and

      - type: status
        status:
          - 200
