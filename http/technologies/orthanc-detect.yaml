id: orthanc-detect

info:
  name: Orthanc - Detect
  author: rxerium
  severity: info
  description: |
    Orthanc open-source DICOM server for medical imaging was detected.
  reference:
    - https://orthanc.uclouvain.be/
    - https://github.com/orthanc-server/orthanc
  metadata:
    verified: true
    max-request: 1
    vendor: orthanc-server
    product: orthanc
    shodan-query: 'http.title:"Orthanc Explorer"'
  tags: tech,orthanc,dicom,medical-imaging,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Orthanc Explorer</title>'

      - type: word
        part: body
        words:
          - 'src="explorer.js"'
          - 'src="../plugins/explorer.js"'
        condition: or

      - type: status
        status:
          - 200
