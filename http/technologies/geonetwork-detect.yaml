id: geonetwork-detect

info:
  name: GeoNetwork - Detect
  author: rxerium
  severity: info
  description: |
    GeoNetwork is an open-source catalogue application for managing geospatial resources.
  reference:
    - https://geonetwork-opensource.org/
    - https://github.com/geonetwork/core-geonetwork
  metadata:
    verified: true
    max-request: 1
    vendor: geonetwork
    product: geonetwork
    shodan-query: 'http.title:"GeoNetwork"'
  tags: tech,detect,geonetwork,geospatial,catalogue

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'ng-app="gn_search'

      - type: word
        part: body
        words:
          - '/geonetwork/static/'

      - type: status
        status:
          - 200
