id: otter-wiki-detect

info:
  name: Otter Wiki - Detect
  author: rxerium
  severity: info
  description: |
    Otter Wiki is an open-source wiki powered by Python, Markdown, and Git.
  reference:
    - https://github.com/redimp/otterwiki
  metadata:
    verified: true
    max-request: 1
    vendor: redimp
    product: otter_wiki
    shodan-query: 'http.title:"Otter Wiki"'
  tags: tech,otterwiki,wiki,markdown,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '/static/css/otterwiki.css'
          - 'An Otter Wiki Logo'
        condition: and

      - type: status
        status:
          - 200
