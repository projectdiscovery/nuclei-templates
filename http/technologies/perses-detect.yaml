id: perses-detect

info:
  name: Perses - Detect
  author: rxerium
  severity: info
  description: |
    Perses, an open-source observability visualisation and dashboard platform, was detected.
  reference:
    - https://perses.dev/
    - https://github.com/perses/perses
  metadata:
    verified: true
    max-request: 1
    vendor: perses
    product: perses
    shodan-query: http.title:"Perses"
  tags: tech,perses,observability,monitoring,dashboard,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<meta name="description" content="Perses">'
          - '<title>Perses</title>'
          - 'perses-dark-theme-enabled'
        condition: and

      - type: status
        status:
          - 200
