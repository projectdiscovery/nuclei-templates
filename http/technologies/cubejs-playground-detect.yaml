id: cubejs-playground-detect

info:
  name: Cube.js Playground - Detect
  author: rxerium
  severity: info
  description: |
    Cube is an open-source semantic layer and analytics platform that includes a web-based development playground.
  reference:
    - https://github.com/cube-js/cube
    - https://cube.dev/
  metadata:
    verified: true
    max-request: 1
    vendor: cube-dev
    product: cube
    shodan-query: 'http.title:"Cube.js Playground"'
  tags: cubejs,cube,analytics,semantic-layer,data,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Cube.js Playground</title>'
          - 'id="playground-root"'
          - 'webpackJsonp@cubejs-client/playground'
        condition: and

      - type: status
        status:
          - 200
