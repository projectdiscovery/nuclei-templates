id: flipt-detect

info:
  name: Flipt - Detect
  author: rxerium
  severity: info
  description: |
    Flipt is an open-source feature flag management platform.
  reference:
    - https://www.flipt.io/
    - https://github.com/flipt-io/flipt
  metadata:
    verified: true
    max-request: 1
    vendor: flipt
    product: flipt
    shodan-query: 'http.title:"Flipt"'
  tags: flipt,feature-flags,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Flipt</title>"
          - "Javascript is required for the Flipt UI"
        condition: and

      - type: word
        part: header
        words:
          - "content-security-policy:"
          - "frame-ancestors 'none'"
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
