id: rapid-scada-detect

info:
  name: Rapid SCADA - Detect
  author: rxerium
  severity: info
  description: |
    Rapid SCADA is an open-source industrial automation and supervisory control platform.
  reference:
    - https://rapidscada.org/
    - https://github.com/RapidScada/scada-v6
  metadata:
    verified: true
    max-request: 1
    vendor: rapidscada
    product: rapid_scada
    shodan-query: 'http.title:"Rapid SCADA"'
  tags: rapid-scada,tech,scada,ics,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Login - Rapid SCADA</title>'
          - 'href="https://rapidscada.org"'
          - '/js/scada-common.js'
        condition: and

      - type: status
        status:
          - 200
