id: illa-builder-detect

info:
  name: ILLA Builder - Detect
  author: rxerium
  severity: info
  description: |
    ILLA Builder is an open-source low-code platform for building internal tools and automating workflows.
  reference:
    - https://github.com/illacloud/illa-builder
    - https://www.illacloud.com/
  metadata:
    verified: true
    max-request: 1
    vendor: illacloud
    product: illa_builder
    shodan-query: 'http.title:"ILLA Cloud"'
  tags: tech,illa,illa-builder,low-code,workflow,automation,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "<title>ILLA Cloud</title>", "ILLA Builder - An open-source low-code Platform for Developers.")'
          - 'contains(body, "@illa-design-")'
        condition: and
