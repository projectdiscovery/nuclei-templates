id: quay-detect

info:
  name: Quay - Detect
  author: rxerium
  severity: info
  description: |
    Quay is a container image registry for building, storing, and distributing container images.
  reference:
    - https://www.redhat.com/en/technologies/cloud-computing/quay
    - https://github.com/quay/quay
  metadata:
    verified: true
    max-request: 1
    vendor: redhat
    product: quay
    shodan-query: 'http.html:"ng-app=\"quay\""'
  tags: tech,quay,detect,registry,container

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<html ng-app="quay"'
          - '/static/img/quay_favicon.png'
          - 'window.__endpoints'
        condition: and

      - type: status
        status:
          - 200
