id: faveo-helpdesk-detect

info:
  name: Faveo Helpdesk - Detect
  author: rxerium
  severity: info
  description: |
    Faveo Helpdesk, a web-based ticketing and customer support platform, was detected.
  reference:
    - https://www.faveohelpdesk.com/
    - https://github.com/ladybirdweb/faveo-helpdesk
  metadata:
    verified: true
    max-request: 1
    vendor: ladybird-web-solution
    product: faveo-helpdesk
    shodan-query: 'http.title:"Faveo HELPDESK"'
  tags: tech,faveo,helpdesk,ticketing,support,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Faveo HELPDESK</title>'
          - 'http-equiv="refresh"'
          - 'URL=public'
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
