id: pangolin-detect

info:
  name: Pangolin - Detect
  author: rxerium
  severity: info
  description: |
    Pangolin is an identity-aware VPN and tunneled reverse proxy for remote access based on WireGuard.
  reference:
    - https://pangolin.net/
    - https://github.com/fosrl/pangolin
  metadata:
    verified: true
    max-request: 1
    vendor: fosrl
    product: pangolin
    shodan-query: http.title:"Dashboard - Pangolin"
  tags: tech,detect,pangolin,vpn,proxy

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Dashboard - Pangolin</title>'
          - 'NEXT_REDIRECT;replace;/auth/login;307;'
        condition: and

      - type: status
        status:
          - 200
