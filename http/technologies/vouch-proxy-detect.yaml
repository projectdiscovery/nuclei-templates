id: vouch-proxy-detect

info:
  name: Vouch Proxy - Detect
  author: rxerium
  severity: info
  description: |
    Vouch Proxy is an SSO and OAuth or OIDC authentication proxy for Nginx auth_request integrations.
  reference:
    - https://github.com/vouch/vouch-proxy
  metadata:
    verified: true
    max-request: 1
    vendor: vouch
    product: vouch_proxy
    shodan-query: http.title:"Vouch Proxy - 400 Bad Request"
  tags: tech,detect,vouch-proxy,sso,oauth,oidc

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'vouch-failcount='
          - 'X-Vouch-Token='
        condition: and

      - type: status
        status:
          - 302
