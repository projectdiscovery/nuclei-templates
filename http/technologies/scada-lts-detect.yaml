id: scada-lts-detect

info:
  name: Scada-LTS - Detect
  author: rxerium
  severity: info
  description: |
    Scada-LTS is an open-source, web-based supervisory control and data acquisition platform.
  reference:
    - https://github.com/SCADA-LTS/Scada-LTS
  metadata:
    verified: true
    max-request: 1
    vendor: scada-lts
    product: scada-lts
    shodan-query: 'http.title:"Scada-LTS"'
  tags: scada-lts,tech,scada,hmi,ics,industrial,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Scada-LTS'
          - 'content="ScadaLTS Software"'
          - 'resources/fuscabr/fuscabr.js'
        condition: and

      - type: status
        status:
          - 200
