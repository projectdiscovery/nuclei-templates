id: starrocks-detect

info:
  name: StarRocks - Detect
  author: rxerium
  severity: info
  description: StarRocks is an open-source analytical database with a built-in web interface for node and runtime information.
  reference:
    - https://www.starrocks.io/
    - https://github.com/StarRocks/starrocks
  metadata:
    verified: true
    max-request: 1
    vendor: starrocks
    product: starrocks
    shodan-query: http.title:"StarRocks"
  tags: tech,starrocks,database,olap,analytics,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>StarRocks</title>"
          - "src='/starrocks.js'"
          - "href='/starrocks.css'"
        condition: and

      - type: status
        status:
          - 200
