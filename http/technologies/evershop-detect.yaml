id: evershop-detect

info:
  name: EverShop - Detect
  author: rxerium
  severity: info
  description: |
    EverShop ecommerce storefront was detected.
  reference:
    - https://evershop.io/
    - https://github.com/evershopcommerce/evershop
  metadata:
    verified: true
    max-request: 1
    vendor: evershopcommerce
    product: evershop
    shodan-query: 'http.html:"EverShop"'
  tags: tech,evershop,commerce,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "var eContext ="
          - "Evershop. All Rights Reserved."
        condition: and

      - type: regex
        part: body
        regex:
          - '<(?:script|link)[^>]+/assets/frontStore/'

      - type: status
        status:
          - 200
