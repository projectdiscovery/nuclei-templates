id: fastx-detect

info:
  name: StarNet FastX - Detect
  author: bandrel
  severity: info
  description: |
    StarNet FastX 3 exposes its build number to unauthenticated clients at /v3/api/ as result.build. The template extracts that build string and sends no exploiting request.
  reference:
    - https://www.starnet.com/fastx/
    - https://fastx32shell.com
  metadata:
    verified: true
    max-request: 1
    vendor: starnet
    product: fastx
    shodan-query: http.title:"FastX"
  tags: tech,detect,starnet,fastx

http:
  - method: GET
    path:
      - "{{BaseURL}}/v3/api/"

    matchers:
      - type: regex
        part: body
        regex:
          - '"build"\s*:\s*"[0-9]+\.[0-9]+\.[0-9]+'

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"build"\s*:\s*"([0-9]+\.[0-9]+\.[0-9]+[^"]*)"'
