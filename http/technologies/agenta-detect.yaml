id: agenta-detect

info:
  name: Agenta - Detect
  author: rxerium
  severity: info
  description: |
    Agenta is an open-source platform for prompt management, evaluation, and observability of AI agents and LLM applications.
  reference:
    - https://github.com/Agenta-AI/agenta
    - https://docs.agenta.ai/
  metadata:
    verified: true
    max-request: 1
    vendor: agenta-ai
    product: agenta
    shodan-query: 'http.title:"Agenta: The LLMOps platform."'
  tags: tech,agenta,ai,llm,llmops,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title data-next-head="">Agenta: The LLMOps platform.</title>'
          - 'src="/__env.js"'
        condition: and

      - type: status
        status:
          - 200
