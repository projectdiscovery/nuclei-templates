id: statping-ng-detect

info:
  name: Statping-ng - Detect
  author: rxerium
  severity: info
  description: |
    Statping-ng, an open-source status page and service monitoring application, was detected.
  reference:
    - https://github.com/statping-ng/statping-ng
  metadata:
    verified: true
    max-request: 1
    vendor: statping-ng
    product: statping-ng
    shodan-query: http.title:"Statping"
  tags: tech,statping-ng,monitoring,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>[^<]*Statping[^<]* - Service Monitoring</title>'

      - type: word
        part: body
        words:
          - '<meta name="title" content="'
          - 'Statping'
          - ' - Service Monitoring">'
        condition: and

      - type: status
        status:
          - 200
