id: evcc-detect

info:
  name: EVCC - Detect
  author: rxerium
  severity: info
  description: |
    EVCC is an open-source solar-aware electric vehicle charging controller.
  reference:
    - https://github.com/evcc-io/evcc
    - https://evcc.io/
  metadata:
    verified: true
    max-request: 1
    vendor: evcc-io
    product: evcc
    shodan-query: 'http.title:"evcc"'
  tags: evcc,tech,iot,ev,energy,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>evcc</title>'
          - 'content="evcc - Sonne tanken'
          - 'name="application-name" content="evcc"'
        condition: and

      - type: status
        status:
          - 200
