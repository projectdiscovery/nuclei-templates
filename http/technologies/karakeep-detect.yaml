id: karakeep-detect

info:
  name: Karakeep - Detect
  author: rxerium
  severity: info
  description: |
    Karakeep, formerly Hoarder, is an open-source self-hosted bookmark manager with automatic tagging and full-text search.
  reference:
    - https://karakeep.app/
    - https://docs.karakeep.app/
    - https://github.com/karakeep-app/karakeep
  metadata:
    verified: true
    max-request: 1
    vendor: karakeep-app
    product: karakeep
    shodan-query: http.title:"Karakeep"
  tags: tech,karakeep,hoarder,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Karakeep</title>'
          - 'name="description" content="The Bookmark Everything app.'
        condition: and

      - type: status
        status:
          - 200
