id: milvus-healthz-detect

info:
  name: Milvus Server - Detect via Health Endpoint
  author: hiddingtrojans
  severity: info
  description: |
    Milvus vector database server detected through its HTTP health endpoint.
    The Server response header identifies the product and version.
    This complements milvus-detect, which identifies Milvus management interfaces.
  reference:
    - https://milvus.io/docs
  metadata:
    max-request: 2
    vendor: milvus-io
    product: milvus
    shodan-query: product:"Milvus"
    fofa-query: server:"Milvus"
  tags: tech,vector-database,milvus,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/healthz"
      - "{{BaseURL}}:9091/healthz"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - '(?i)Server:\s*Milvus/[0-9]+(?:\.[0-9]+)*'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - '(?i)Server:\s*Milvus/([0-9]+(?:\.[0-9]+)*)'
