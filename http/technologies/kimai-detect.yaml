id: kimai-detect

info:
  name: Kimai - Detect
  author: rxerium
  severity: info
  description: |
    Kimai is an open-source time-tracking application.
  reference:
    - https://www.kimai.org/
    - https://github.com/kimai/kimai
  metadata:
    verified: true
    max-request: 1
    vendor: kimai
    product: kimai
    shodan-query: http.title:"Kimai"
  tags: tech,kimai,time-tracking,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Kimai</title>'
          - "kimai_profile"
        condition: and

      - type: status
        status:
          - 200
