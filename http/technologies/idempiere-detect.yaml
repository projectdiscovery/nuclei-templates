id: idempiere-detect

info:
  name: iDempiere - Detect
  author: rxerium
  severity: info
  description: |
    iDempiere is an open-source enterprise resource planning and customer relationship management system.
  reference:
    - https://www.idempiere.org/
    - https://github.com/idempiere/idempiere
  metadata:
    verified: true
    max-request: 1
    vendor: idempiere
    product: idempiere
    shodan-query: http.title:"iDempiere Application Home"
  tags: tech,idempiere,erp,crm,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>iDempiere Application Home</title>'
          - "Welcome to iDempiere"
          - "idempiereMonitor"
        condition: and

      - type: status
        status:
          - 200
