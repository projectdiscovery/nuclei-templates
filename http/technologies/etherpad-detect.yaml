id: etherpad-detect

info:
  name: Etherpad - Detect
  author: rxerium
  severity: info
  description: |
    Etherpad, a real-time collaborative text editor, was detected.
  reference:
    - https://github.com/ether/etherpad-lite
    - https://etherpad.org/
  metadata:
    verified: true
    max-request: 1
    vendor: etherpad
    product: etherpad_lite
    shodan-query: 'http.title:"Etherpad"'
  tags: tech,etherpad,collaboration,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "<title>Etherpad</title>", "type=\"application/l10n+json\" href=\"locales.json\"")'
        condition: and
