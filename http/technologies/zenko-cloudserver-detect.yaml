id: zenko-cloudserver-detect

info:
  name: Zenko CloudServer - Detect
  author: rxerium
  severity: info
  description: |
    Zenko CloudServer, formerly Scality S3 Server, is an open-source Amazon S3-compatible object storage server.
  reference:
    - https://github.com/scality/cloudserver
  metadata:
    verified: true
    max-request: 1
    vendor: scality
    product: cloudserver
    shodan-query: '"ScalityS3"'
  tags: tech,detect,zenko,cloudserver,scality

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'Server: ScalityS3'
          - 'X-Scal-Request-Id:'
        condition: and

      - type: word
        part: body
        words:
          - '"code":"InvalidParameterValue"'
          - '"message":"An invalid or out-of-range value was supplied for the input parameter."'
        condition: and

      - type: status
        status:
          - 400
