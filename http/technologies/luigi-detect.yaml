id: luigi-detect

info:
  name: Luigi - Detect
  author: rxerium
  severity: info
  description: |
    Luigi is a Python framework for building complex batch pipelines with dependency resolution, workflow management, and visualisation.
  reference:
    - https://github.com/spotify/luigi
    - https://luigi.readthedocs.io/
  metadata:
    verified: true
    max-request: 1
    vendor: spotify
    product: luigi
    shodan-query: 'http.title:"Luigi Task Visualiser"'
  tags: tech,luigi,pipeline,workflow,orchestration,automation,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>Luigi Task Visualiser</title>")'
          - 'contains_all(body, "css/luigi.css", "js/luigi.js", "js/visualiserApp.js")'
        condition: and
