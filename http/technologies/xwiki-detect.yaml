id: xwiki-detect

info:
  name: XWiki - Detection
  author: matejsmycka
  severity: info
  description: |
    XWiki Platform was discovered.
  metadata:
    verified: true
    max-request: 2
    vendor: xwiki
    product: xwiki
    shodan-query: html:"data-xwiki-reference"
    fofa-query: body="data-xwiki-reference"
  tags: xwiki,detect,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/xwiki/"

    host-redirects: true
    max-redirects: 2

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 || status_code == 401'
          - 'contains(body, "xwikiplatformversion")'
        condition: and

    extractors:
      - type: regex
        group: 1
        regex:
          - '<html.*?data-xwiki-page="(.*?)"'
