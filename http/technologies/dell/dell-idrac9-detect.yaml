id: dell-idrac9-detect

info:
  name: Detect Dell iDRAC9
  author: kophjager007
  severity: info
  description: The Integrated Dell Remote Access Controller (iDRAC) is designed for secure local and remote server management and helps IT administrators deploy, update and monitor Dell EMC PowerEdge servers.
  metadata:
    max-request: 1
  tags: tech,dell,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/sysmgmt/2015/bmc/info"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"BuildVersion"'
          - '"SystemModelName"'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        regex:
          - '[0-9]{2}G'

      - type: regex
        part: body
        group: 1
        regex:
          - '"FwVer" *: *"([^"]+)"'
