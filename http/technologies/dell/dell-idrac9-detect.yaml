id: dell-idrac9-detect

info:
  name: Detect Dell iDRAC9
  author: kophjager007
  severity: info
  description: The Integrated Dell Remote Access Controller (iDRAC) is designed for secure local and remote server management and helps IT administrators deploy, update and monitor Dell EMC PowerEdge servers.
  metadata:
    max-request: 1
  tags: tech,dell,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/sysmgmt/2015/bmc/info" # Firmware Version and other info (iDRAC9)

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      # require BOTH keys, quoted exactly as the iDRAC9 JSON emits them:
      # Apple AirPlay device-info plists contain osBuildVersion (whose
      # bytes include "BuildVersion" as a substring) and no
      # SystemModelName at all (issue #17611)
      - type: word
        condition: and
        words:
          - '"BuildVersion"'
          - '"SystemModelName"'

    extractors:
      - type: regex
        part: body
        regex:
          - '[0-9]{2}G'

      - type: regex
        part: body
        group: 1
        regex:
          - '"FwVer" *: *"([^"]+)"'
