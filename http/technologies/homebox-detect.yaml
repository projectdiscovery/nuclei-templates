id: homebox-detect

info:
  name: Homebox - Detect
  author: ChrisJr404
  severity: info
  description: |
    Detects Homebox instances through the unauthenticated status API endpoint and extracts the running version. Homebox is a self hosted home inventory and organization application.
  reference:
    - https://homebox.software/
    - https://github.com/sysadminsmedia/homebox
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Track, Manage, and Organize your Things"
  tags: tech,homebox,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/status"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Track, Manage, and Organize your Things'
          - '"allowRegistration"'
          - '"labelPrinting"'
        condition: and

      - type: word
        part: header
        words:
          - application/json

      - type: status
        status:
          - 200

    extractors:
      - type: json
        part: body
        json:
          - '.build.version'
