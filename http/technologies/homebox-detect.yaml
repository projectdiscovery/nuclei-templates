id: homebox-detect

info:
  name: Homebox - Detect
  author: ChrisJr404
  severity: info
  description: |
    Homebox, a self-hosted home inventory and organization system, was detected via its unauthenticated /api/v1/status endpoint.
  reference:
    - https://github.com/sysadminsmedia/homebox
    - https://homebox.software
  metadata:
    verified: true
    max-request: 1
    vendor: sysadminsmedia
    product: homebox
    shodan-query: html:"homebox-frontend"
    fofa-query: body="homebox-frontend"
  tags: tech,homebox,inventory,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/status"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"title":"Homebox"'
          - '"build":'
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"build":\{"version":"([^"]+)"'
