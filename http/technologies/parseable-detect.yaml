id: parseable-detect

info:
  name: Parseable - Detect
  author: rxerium
  severity: info
  description: |
    Parseable, an open-source observability platform for logs, metrics, traces, and events, was detected.
  reference:
    - https://github.com/parseablehq/parseable
    - https://www.parseable.com/
  metadata:
    verified: true
    max-request: 1
    vendor: parseablehq
    product: parseable
    shodan-query: http.title:"Parseable"
  tags: tech,parseable,observability,logs,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>Parseable(?: Log Storage| \| (?:Fast )?Observability[^<]*)</title>'

      - type: word
        part: body
        words:
          - 'Fast Observability on Object Store'
          - 'Observability for agents, apps and systems'
          - 'Parseable Log Storage'
        condition: or

      - type: status
        status:
          - 200
