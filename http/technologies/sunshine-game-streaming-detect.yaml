id: sunshine-game-streaming-detect

info:
  name: Sunshine Game Streaming - Detect
  author: rxerium
  severity: info
  description: |
    Sunshine is a self-hosted game streaming host for Moonlight clients.
  reference:
    - https://github.com/LizardByte/Sunshine
  metadata:
    verified: true
    max-request: 1
    vendor: lizardbyte
    product: sunshine
    shodan-query: 'port:47990 http.title:"Sunshine"'
  tags: sunshine,tech,detect,gaming,streaming

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Sunshine</title>"
          - "images/sunshine.ico"
        condition: and

      - type: status
        status:
          - 200
