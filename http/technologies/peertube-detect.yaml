id: peertube-detect

info:
  name: PeerTube - Detect
  author: rxerium
  severity: info
  description: |
    PeerTube is a federated video hosting and streaming platform.
  reference:
    - https://joinpeertube.org/
    - https://github.com/Chocobozzz/PeerTube
  metadata:
    verified: true
    max-request: 1
    vendor: framasoft
    product: peertube
    shodan-query: 'http.html:"window.PeerTubeServerConfig"'
  tags: peertube,fediverse,video,streaming,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'property="og:platform" content="PeerTube"'
          - 'window.PeerTubeServerConfig = '
        condition: and

      - type: status
        status:
          - 200
