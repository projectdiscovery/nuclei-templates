id: runtipi-detect

info:
  name: Runtipi - Detect
  author: rxerium
  severity: info
  description: |
    Runtipi is a self-hosted personal home server platform.
  reference:
    - https://runtipi.io/
    - https://github.com/runtipi/runtipi
  metadata:
    verified: true
    max-request: 2
    vendor: runtipi
    product: runtipi
    shodan-query: http.title:"Runtipi"
  tags: tech,runtipi,detect,self-hosted

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Runtipi</title>'
        internal: true

      - type: status
        status:
          - 200
        internal: true

  - method: GET
    path:
      - "{{BaseURL}}/icons/site.webmanifest"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"name": "Runtipi"'
          - '"short_name": "Runtipi"'
        condition: and

      - type: word
        part: header
        words:
          - 'Content-Type: application/manifest+json'

      - type: status
        status:
          - 200
