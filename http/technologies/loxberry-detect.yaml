id: loxberry-detect

info:
  name: LoxBerry - Detect
  author: rxerium
  severity: info
  description: |
    LoxBerry is a Raspberry Pi-based plugin platform for extending Loxone home automation systems.
  reference:
    - https://www.loxberry.de/
    - https://github.com/mschlenstedt/Loxberry
  metadata:
    verified: true
    max-request: 1
    vendor: loxberry
    product: loxberry
    shodan-query: 'http.title:"LoxBerry"'
  tags: loxberry,loxone,tech,iot,home-automation,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>LoxBerry</title>'
          - 'URL=/admin/system/index.cgi'
        condition: and

      - type: status
        status:
          - 200
