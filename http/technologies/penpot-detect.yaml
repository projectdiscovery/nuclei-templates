id: penpot-detect

info:
  name: Penpot - Detect
  author: rxerium
  severity: info
  description: |
    Penpot, an open-source design and prototyping platform, was detected.
  reference:
    - https://penpot.app/
    - https://github.com/penpot/penpot
  metadata:
    verified: true
    max-request: 1
    vendor: penpot
    product: penpot
    shodan-query: 'http.title:"Penpot"'
  tags: tech,penpot,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'globalThis.penpotVersion ='
          - 'globalThis.penpotWorkerURI ='
        condition: and

      - type: status
        status:
          - 200
