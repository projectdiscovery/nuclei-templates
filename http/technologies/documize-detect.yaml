id: documize-detect

info:
  name: Documize - Detect
  author: rxerium
  severity: info
  description: |
    Documize Community is an open-source documentation and knowledge management platform.
  reference:
    - https://github.com/documize/community
  metadata:
    verified: true
    max-request: 1
    vendor: documize
    product: documize_community
    shodan-query: 'http.title:"Documize"'
  tags: tech,documize,documentation,knowledge-base,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'name="documize/config/environment"'
          - '<meta property="edition" content="Community"'
          - '<title>Documize</title>'
        condition: and

      - type: status
        status:
          - 200
