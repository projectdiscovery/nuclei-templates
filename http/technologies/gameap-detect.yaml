id: gameap-detect

info:
  name: GameAP - Detect
  author: rxerium
  severity: info
  description: |
    GameAP is an open-source game server management panel.
  reference:
    - https://github.com/gameap/gameap
  metadata:
    verified: true
    max-request: 1
    vendor: gameap
    product: gameap
    shodan-query: 'http.html:"GameAP"'
  tags: gameap,tech,detect,gaming

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>GameAP</title>"
          - "gameap_ui_settings"
          - "/api/config/public"
        condition: and

      - type: status
        status:
          - 200
