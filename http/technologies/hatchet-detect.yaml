id: hatchet-detect

info:
  name: Hatchet - Detect
  author: rxerium
  severity: info
  description: |
    Hatchet is a workflow orchestration engine for background tasks, AI agents, and durable workflows.
  reference:
    - https://github.com/hatchet-dev/hatchet
    - https://hatchet.run/
  metadata:
    verified: true
    max-request: 1
    vendor: hatchet-dev
    product: hatchet
    shodan-query: 'http.title:"Hatchet"'
  tags: tech,hatchet,workflow,orchestration,automation,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>Hatchet</title>")'
          - 'contains(body, "Write workflows as code. Scale with Hatchet.")'
        condition: and
