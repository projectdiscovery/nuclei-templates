id: funkwhale-detect

info:
  name: Funkwhale - Detect
  author: rxerium
  severity: info
  description: |
    Funkwhale is a decentralised and federated audio platform.
  reference:
    - https://www.funkwhale.audio/
  metadata:
    verified: true
    max-request: 1
    vendor: funkwhale
    product: funkwhale
    shodan-query: 'http.title:"Funkwhale"'
  tags: funkwhale,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Funkwhale</title>'

      - type: regex
        part: body
        regex:
          - '<meta\s+name=["'']?generator["'']?\s+content=["'']?Funkwhale["'']?'

      - type: status
        status:
          - 200
