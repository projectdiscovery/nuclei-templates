id: shopfast-detect

info:
  name: ShopFast - Detect
  author: anurag12340
  severity: info
  description: |
    A ShopFast storefront was detected. ShopFast is a hosted ecommerce platform for selling digital products, with stores on shopfa.st subdomains or custom domains.
  reference:
    - https://shopfa.st/
  metadata:
    verified: true
    max-request: 1
    vendor: shopfast
    product: shopfast
  tags: tech,shopfast,commerce,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '<script type="module" src="/_sf/runtime\.[0-9a-f]{12}\.js"></script>'

      - type: word
        part: body
        words:
          - '<meta name="sf:page-type"'
          - 'id="sf-skeletons"'
        condition: and

      - type: status
        status:
          - 200
