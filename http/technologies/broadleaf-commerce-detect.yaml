id: broadleaf-commerce-detect

info:
  name: Broadleaf Commerce - Detect
  author: rxerium
  severity: info
  description: |
    Broadleaf Commerce storefront or administration interface was detected.
  reference:
    - https://www.broadleafcommerce.com/
    - https://github.com/BroadleafCommerce/BroadleafCommerce
  metadata:
    verified: true
    max-request: 1
    vendor: broadleafcommerce
    product: broadleaf_commerce
    shodan-query: 'http.html:"Broadleaf Commerce"'
  tags: tech,broadleaf,commerce,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Broadleaf Commerce"

      - type: word
        part: body
        words:
          - "Broadleaf admin application"
          - "/img/broadleaf-seal.png"
        condition: or

      - type: status
        status:
          - 200
