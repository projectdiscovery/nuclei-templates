id: chartbrew-detect

info:
  name: Chartbrew - Detect
  author: rxerium
  severity: info
  description: |
    Chartbrew is an open-source data visualisation and dashboard platform.
  reference:
    - https://github.com/chartbrew/chartbrew
    - https://chartbrew.com/
  metadata:
    verified: true
    max-request: 1
    vendor: chartbrew
    product: chartbrew
    shodan-query: 'http.title:"Chartbrew"'
  tags: chartbrew,analytics,visualization,data,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<meta property="og:site_name" content="Chartbrew"'
          - 'Chartbrew allows you to connect all your databases and APIs'
          - '<title>Chartbrew - Visuali'
        condition: and

      - type: status
        status:
          - 200
