id: wowza-streaming-engine-detect

info:
  name: Wowza Streaming Engine - Detect
  author: DhiyaneshDk
  severity: info
  description: |
    Wowza Streaming Engine was detected based on server response headers, body content, or management interface.
  reference:
    - https://www.wowza.com/docs/wowza-streaming-engine-rest-api-overview
  metadata:
    verified: true
    max-request: 3
    shodan-query: html:"Wowza Streaming Engine"
  tags: wowza,streaming,tech,detect

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /enginemanager/ftu/welcome.htm HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /connectioncounts HTTP/1.1
        Host: {{Hostname}}

    stop-at-first-match: true

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - contains(header, "WowzaStreamingEngine") || contains(header, "Restlet-Framework") || contains(body, "Wowza Streaming Engine") || contains(body, "WowzaMediaServer")

    extractors:
      - type: regex
        group: 1
        regex:
          - 'WowzaStreamingEngine/([^\s]+)'
          - 'Wowza Streaming Engine \d+ .+? ([0-9][0-9.+-]+) build'
