id: growthbook-detect

info:
  name: GrowthBook - Detect
  author: rxerium
  severity: info
  description: |
    GrowthBook is an open-source feature flagging, experimentation, and product analytics platform.
  reference:
    - https://www.growthbook.io/
    - https://github.com/growthbook/growthbook
  metadata:
    verified: true
    max-request: 1
    vendor: growthbook
    product: growthbook
    shodan-query: 'http.title:"GrowthBook"'
  tags: growthbook,feature-flags,experimentation,analytics,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '<title[^>]*>GrowthBook</title>'

      - type: word
        part: body
        words:
          - '<meta name="robots" content="noindex, nofollow"'

      - type: status
        status:
          - 200
