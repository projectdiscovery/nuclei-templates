id: tasmoadmin-detect

info:
  name: TasmoAdmin - Detect
  author: rxerium
  severity: info
  description: |
    TasmoAdmin is a web interface for centrally managing devices running Tasmota firmware.
  reference:
    - https://github.com/TasmoAdmin/TasmoAdmin
  metadata:
    verified: true
    max-request: 1
    vendor: tasmoadmin
    product: tasmoadmin
    shodan-query: 'http.title:"TasmoAdmin"'
  tags: tasmoadmin,tasmota,tech,iot,home-automation,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Login - TasmoAdmin</title>'
          - '/resources/js/compiled/Sonoff.min.js'
        condition: and

      - type: word
        part: header
        words:
          - 'TASMO_SESSION='

      - type: status
        status:
          - 200
