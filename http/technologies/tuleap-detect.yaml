id: tuleap-detect

info:
  name: Tuleap - Detect
  author: rxerium
  severity: info
  description: |
    Tuleap, an application lifecycle and agile project management platform, was detected.
  reference:
    - https://www.tuleap.org/
  metadata:
    verified: true
    max-request: 1
    vendor: enalean
    product: tuleap
    shodan-query: 'http.title:"Tuleap"'
  tags: tech,tuleap,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "contains(header, 'TULEAP_PHPSESSID')"
          - "regex('(?i)<title>[^<]*Tuleap[^<]*</title>', body)"
        condition: or

      - type: status
        status:
          - 200
          - 302
