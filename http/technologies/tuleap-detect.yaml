id: tuleap-detect

info:
  name: Tuleap - Detect
  author: rxerium
  severity: info
  description: |
    Tuleap, an application lifecycle and agile project management platform, was detected.
  reference:
    - https://www.tuleap.org/
  metadata:
    verified: true
    max-request: 1
    vendor: enalean
    product: tuleap
    shodan-query: 'http.title:"Tuleap"'
  tags: tech,tuleap,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'TULEAP_PHPSESSID'

      - type: regex
        part: body
        regex:
          - '(?i)<title>[^<]*Tuleap[^<]*</title>'

      - type: status
        status:
          - 200
          - 302
