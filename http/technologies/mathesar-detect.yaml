id: mathesar-detect

info:
  name: Mathesar - Detect
  author: rxerium
  severity: info
  description: Mathesar is an open-source, self-hosted web interface for viewing, editing, and querying PostgreSQL data.
  reference:
    - https://mathesar.org/
    - https://github.com/mathesar-foundation/mathesar
  metadata:
    verified: true
    max-request: 1
    vendor: mathesar-foundation
    product: mathesar
    shodan-query: http.title:"Mathesar"
  tags: tech,mathesar,database,postgresql,detect

http:
  - method: GET
    host-redirects: true
    max-redirects: 2
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Mathesar - Login</title>"

      - type: regex
        part: body
        regex:
          - '/static/icons/favicon\.[a-f0-9]+\.ico'

      - type: status
        status:
          - 200
