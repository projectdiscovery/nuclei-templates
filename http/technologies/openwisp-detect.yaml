id: openwisp-detect

info:
  name: OpenWISP - Detect
  author: rxerium
  severity: info
  description: |
    OpenWISP is an open-source network management platform for automating and operating wireless and other network infrastructure.
  reference:
    - https://openwisp.org/
    - https://github.com/openwisp/openwisp-controller
  metadata:
    verified: true
    max-request: 1
    vendor: openwisp
    product: openwisp
    shodan-query: http.title:"OpenWISP"
  tags: tech,openwisp,network-management,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Log in | OpenWISP Admin</title>'
          - '/static/admin/css/openwisp'
        condition: and

      - type: status
        status:
          - 200
