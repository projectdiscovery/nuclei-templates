id: kanidm-detect

info:
  name: Kanidm - Detect
  author: rxerium
  severity: info
  description: |
    Kanidm is a self-hosted identity management platform and identity provider.
  reference:
    - https://kanidm.com/
    - https://github.com/kanidm/kanidm
  metadata:
    verified: true
    max-request: 1
    vendor: kanidm
    product: kanidm
    shodan-query: http.html:"kanidm"
  tags: tech,detect,kanidm,iam,idp

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - "contains(tolower(all_headers), 'x-kanidm-version:')"
          - "contains(tolower(all_headers), 'x-kanidm-opid:')"
          - "status_code == 303"
        condition: and
