id: ruoyi-detect

info:
  name: RuoYi Detect
  author: xiangdangloser
  severity: info
  description: RuoYi (若依) admin framework was detected.
  reference:
    - https://github.com/yangzongzhuan/RuoYi
    - https://doc.ruoyi.vip/
  metadata:
    verified: true
    max-request: 1
    product: ruoyi
    vendor: ruoyi
    shodan-query: http.html:"若依管理系统"
    fofa-query: app="RuoYi"
  tags: tech,ruoyi,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "若依管理系统"
          - "/static/ruoyi"
        condition: or

      - type: status
        status:
          - 200
