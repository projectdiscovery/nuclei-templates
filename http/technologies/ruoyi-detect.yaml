id: ruoyi-detect

info:
  name: RuoYi Detect
  author: xiangdangloser
  severity: info
  description: RuoYi (若依) admin framework was detected.
  metadata:
    max-request: 1
    fofa-query: app="若依"
  tags: tech,ruoyi

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "若依管理系统"
          - "/static/ruoyi"
        condition: or
      - type: status
        status:
          - 200
