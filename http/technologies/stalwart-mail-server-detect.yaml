id: stalwart-mail-server-detect

info:
  name: Stalwart Mail Server - Detect
  author: rxerium
  severity: info
  description: |
    Stalwart Mail Server, an open-source mail and collaboration server, was detected.
  reference:
    - https://stalw.art/
    - https://github.com/stalwartlabs/stalwart
  metadata:
    verified: true
    max-request: 1
    vendor: stalwart-labs
    product: stalwart-mail-server
    shodan-query: 'http.title:"Stalwart Management"'
  tags: tech,stalwart,mail-server,mail,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Stalwart Management</title>'
          - 'TrunkApplicationStarted'
          - '_bg.wasm'
        condition: and

      - type: status
        status:
          - 200
