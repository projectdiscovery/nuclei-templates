id: admidio-detect

info:
  name: Admidio - Detect
  author: rxerium
  severity: info
  description: |
    Admidio is an open-source membership management system for organisations.
  reference:
    - https://www.admidio.org/
    - https://github.com/Admidio/admidio
  metadata:
    verified: true
    max-request: 1
    vendor: admidio
    product: admidio
    shodan-query: http.title:"Admidio"
  tags: tech,admidio,membership,management,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "/adm_program/"
          - "/adm_themes/"
        condition: and

      - type: status
        status:
          - 200
