id: scrypted-detect

info:
  name: Scrypted - Detect
  author: rxerium
  severity: info
  description: |
    Scrypted is an open-source home video integration and automation platform.
  reference:
    - https://github.com/koush/scrypted
    - https://www.scrypted.app/
  metadata:
    verified: true
    max-request: 1
    vendor: koush
    product: scrypted
    shodan-query: 'http.title:"Scrypted"'
  tags: scrypted,tech,iot,video,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Scrypted Management Console</title>'
          - 'href="img/icons/favicon-196.png"'
        condition: and

      - type: status
        status:
          - 200
