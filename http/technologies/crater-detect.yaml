id: crater-detect

info:
  name: Crater - Detect
  author: rxerium
  severity: info
  description: |
    Crater is an open-source invoicing platform for small businesses.
  reference:
    - https://craterapp.com/
    - https://github.com/crater-invoice-inc/crater
  metadata:
    verified: true
    max-request: 1
    vendor: crater
    product: crater
    shodan-query: http.title:"Crater - Self Hosted Invoicing Platform"
  tags: tech,crater,detect,invoicing

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Crater - Self Hosted Invoicing Platform</title>'
          - '/build/assets/main.'
        condition: and

      - type: status
        status:
          - 200
