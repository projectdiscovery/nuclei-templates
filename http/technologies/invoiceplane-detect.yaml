id: invoiceplane-detect

info:
  name: InvoicePlane - Detect
  author: rxerium
  severity: info
  description: |
    InvoicePlane is an open-source invoicing application.
  reference:
    - https://invoiceplane.com/
    - https://github.com/InvoicePlane/InvoicePlane
  metadata:
    verified: true
    max-request: 1
    vendor: invoiceplane
    product: invoiceplane
    shodan-query: http.title:"InvoicePlane"
  tags: tech,invoiceplane,invoicing,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "InvoicePlane"
          - "sessions/login"
        condition: and

      - type: status
        status:
          - 200
