id: gravitee-apim-detect

info:
  name: Gravitee APIM - Detect
  author: rxerium
  severity: info
  description: |
    Gravitee API Management is an open-source platform for managing, securing, and monitoring APIs.
  reference:
    - https://www.gravitee.io/platform/api-management
    - https://github.com/gravitee-io/gravitee-api-management
  metadata:
    verified: true
    max-request: 1
    vendor: gravitee
    product: api_management
    shodan-query: http.html:"gravitee-logo-cyan.svg"
  tags: tech,detect,gravitee,apim

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - "contains_all(body, 'Copyright (C) 2015 The Gravitee team', 'gravitee-logo-cyan.svg')"
          - "status_code == 200"
        condition: and
