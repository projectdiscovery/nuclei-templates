id: wekan-detect

info:
  name: Wekan - Detect
  author: rxerium
  severity: info
  description: |
    Wekan, an open-source Kanban board application, was detected.
  reference:
    - https://wekan.fi/
    - https://github.com/wekan/wekan
  metadata:
    verified: true
    max-request: 1
    vendor: wekan
    product: wekan
    shodan-query: 'http.title:"Wekan"'
  tags: tech,wekan,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Wekan</title>'
          - '/packages/wekan-'
        condition: and

      - type: status
        status:
          - 200
