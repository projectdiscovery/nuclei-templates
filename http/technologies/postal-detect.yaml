id: postal-detect

info:
  name: Postal - Detect
  author: rxerium
  severity: info
  description: |
    Postal, an open-source mail delivery platform, was detected.
  reference:
    - https://postalserver.io/
    - https://github.com/postalserver/postal
  metadata:
    verified: true
    max-request: 1
    vendor: postalserver
    product: postal
    shodan-query: 'http.title:"Login - Postal"'
  tags: tech,postal,mail,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Login - Postal</title>'
          - 'Welcome to Postal'
          - 'class="loginForm" action="/login"'
        condition: and

      - type: status
        status:
          - 200
