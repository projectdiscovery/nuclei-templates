id: janus-webrtc-server-detect

info:
  name: Janus WebRTC Server - Detect
  author: rxerium
  severity: info
  description: |
    Janus is an open-source general-purpose WebRTC server and gateway.
  reference:
    - https://github.com/meetecho/janus-gateway
  metadata:
    verified: true
    max-request: 1
    vendor: meetecho
    product: janus_gateway
    shodan-query: 'http.html:"Janus WebRTC Server"'
  tags: janus,tech,detect,webrtc,streaming

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Janus WebRTC Server"
          - "https://github.com/meetecho/janus-gateway"
        condition: and

      - type: status
        status:
          - 200
