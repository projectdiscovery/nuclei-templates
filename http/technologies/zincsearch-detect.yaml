id: zincsearch-detect

info:
  name: ZincSearch - Detect
  author: rxerium
  severity: info
  description: |
    ZincSearch, a lightweight search engine written in Go, was detected.
  reference:
    - https://github.com/zincsearch/zincsearch
    - https://zincsearch.com/
  metadata:
    verified: true
    max-request: 1
    vendor: zincsearch
    product: zincsearch
    shodan-query: http.title:"ZincSearch"
  tags: tech,zincsearch,search,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>ZincSearch</title>'

      - type: regex
        part: body
        regex:
          - '\./assets/index[.-][A-Za-z0-9_-]+\.js'

      - type: status
        status:
          - 200
