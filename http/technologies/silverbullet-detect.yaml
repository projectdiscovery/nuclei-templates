id: silverbullet-detect

info:
  name: SilverBullet - Detect
  author: rxerium
  severity: info
  description: |
    SilverBullet is an open-source, self-hosted personal knowledge platform.
  reference:
    - https://silverbullet.md/
    - https://github.com/silverbulletmd/silverbullet
  metadata:
    verified: true
    max-request: 1
    vendor: silverbulletmd
    product: silverbullet
    shodan-query: http.title:"SilverBullet"
  tags: tech,silverbullet,detect,self-hosted

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>SilverBullet</title>'
          - 'id="sb-root"'
        condition: and

      - type: status
        status:
          - 200
