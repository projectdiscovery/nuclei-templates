id: docusaurus-detect

info:
  name: Docusaurus - Detect
  author: rxerium
  severity: info
  description: |
    Docusaurus is an open-source static site generator designed for documentation websites.
  reference:
    - https://docusaurus.io/
    - https://github.com/facebook/docusaurus
  metadata:
    verified: true
    max-request: 1
    vendor: facebook
    product: docusaurus
    shodan-query: 'http.html:"__docusaurus"'
  tags: tech,docusaurus,documentation,static-site-generator,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '<meta name="generator" content="Docusaurus v[0-9]+\.[0-9]+'

      - type: word
        part: body
        words:
          - 'name="docusaurus_locale"'
          - 'name="docusaurus_tag"'
        condition: and

      - type: status
        status:
          - 200
