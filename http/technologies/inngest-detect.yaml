id: inngest-detect

info:
  name: Inngest - Detect
  author: rxerium
  severity: info
  description: |
    Inngest is a workflow orchestration platform for stateful functions, event-driven applications, and AI workflows.
  reference:
    - https://github.com/inngest/inngest
    - https://www.inngest.com/
  metadata:
    verified: true
    max-request: 1
    vendor: inngest
    product: inngest
    shodan-query: 'http.title:"Inngest Server"'
  tags: tech,inngest,workflow,orchestration,automation,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>Inngest Server</title>")'
          - 'contains(to_lower(header), "x-inngest-server-kind:")'
        condition: and
