id: cryptpad-detect

info:
  name: CryptPad - Detect
  author: rxerium
  severity: info
  description: |
    CryptPad is an open-source, end-to-end encrypted collaboration suite.
  reference:
    - https://cryptpad.org/
    - https://github.com/cryptpad/cryptpad
  metadata:
    verified: true
    max-request: 1
    vendor: cryptpad
    product: cryptpad
    shodan-query: 'http.title:"CryptPad"'
  tags: tech,cryptpad,collaboration,encrypted,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'data-localization="main_title">CryptPad:'
          - 'data-bootload="/customize/template.js"'
          - 'data-main="/common/boot.js'
        condition: and

      - type: status
        status:
          - 200
