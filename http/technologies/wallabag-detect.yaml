id: wallabag-detect

info:
  name: Wallabag - Detect
  author: rxerium
  severity: info
  description: |
    Wallabag, a self-hosted read-it-later application, was detected.
  reference:
    - https://github.com/wallabag/wallabag
    - https://wallabag.org/
  metadata:
    verified: true
    max-request: 1
    vendor: wallabag
    product: wallabag
    shodan-query: 'http.title:"wallabag"'
  tags: tech,wallabag,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "/img/appicon/apple-touch-icon-152.png", "/wallassets/material.css")'
        condition: and
