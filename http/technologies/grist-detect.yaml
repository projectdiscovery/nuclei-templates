id: grist-detect

info:
  name: Grist - Detect
  author: rxerium
  severity: info
  description: |
    Grist is an open-source relational spreadsheet and data management application.
  reference:
    - https://www.getgrist.com/
    - https://github.com/gristlabs/grist-core
  metadata:
    verified: true
    max-request: 1
    vendor: gristlabs
    product: grist
    shodan-query: http.title:"Loading... - Grist"
  tags: tech,detect,grist,spreadsheet

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - "contains_all(body, 'window.gristConfig =', 'Grist, the evolution of spreadsheets')"
          - "status_code == 200"
        condition: and
