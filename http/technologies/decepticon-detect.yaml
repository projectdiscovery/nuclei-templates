id: decepticon-detect

info:
  name: Decepticon - Detect
  author: rxerium
  severity: info
  description: |
    Detected Decepticon, an autonomous red-team agent platform whose opt-in web dashboard (served on localhost:3000 via /web) exposed the product name and tagline in its Next.js page title and body.
  reference:
    - https://github.com/BitterSecurity/Decepticon
    - https://blog.gitguardian.com/ai-pentesting-tools-beyond-artex/
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.favicon.hash:-1814445533
  tags: tech,decepticon,detect,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Decepticon'
          - 'Autonomous Red Team Platform'
        condition: and

      - type: status
        status:
          - 200
