id: documenso-detect

info:
  name: Documenso - Detect
  author: rxerium
  severity: info
  description: |
    Documenso is an open-source document signing platform.
  reference:
    - https://github.com/documenso/documenso
  metadata:
    verified: true
    max-request: 1
    vendor: documenso
    product: documenso
    shodan-query: 'http.title:"Documenso"'
  tags: documenso,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Sign In - Documenso</title>'
          - 'Documenso - The Open Source DocuSign Alternative'
        condition: and

      - type: status
        status:
          - 200
