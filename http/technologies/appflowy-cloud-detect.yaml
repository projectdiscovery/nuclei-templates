id: appflowy-cloud-detect

info:
  name: AppFlowy Cloud - Detect
  author: rxerium
  severity: info
  description: |
    AppFlowy Cloud provides the self-hosted collaboration services and web interface for AppFlowy.
  reference:
    - https://appflowy.com/
    - https://github.com/AppFlowy-IO/AppFlowy-Cloud
  metadata:
    verified: true
    max-request: 1
    vendor: appflowy-io
    product: appflowy-cloud
    shodan-query: http.title:"AppFlowy"
  tags: tech,appflowy,appflowy-cloud,detect,self-hosted

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>AppFlowy</title>'
          - 'APPFLOWY_GOTRUE_BASE_URL'
        condition: and

      - type: status
        status:
          - 200
