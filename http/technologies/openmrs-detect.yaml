id: openmrs-detect

info:
  name: OpenMRS - Detect
  author: rxerium
  severity: info
  description: |
    OpenMRS open-source electronic medical record platform was detected.
  reference:
    - https://openmrs.org/
    - https://github.com/openmrs/openmrs-core
  metadata:
    verified: true
    max-request: 1
    vendor: openmrs
    product: openmrs
    shodan-query: 'http.html:"OpenMRS"'
  tags: tech,openmrs,emr,healthcare,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>[^<]*OpenMRS[^<]*</title>'

      - type: word
        part: body
        words:
          - '/openmrs/'

      - type: status
        status:
          - 200
