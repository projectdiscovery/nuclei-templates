id: dataverse-detect

info:
  name: Dataverse - Detect
  author: rxerium
  severity: info
  description: |
    Dataverse is an open-source platform for publishing and preserving research data.
  reference:
    - https://github.com/IQSS/dataverse
  metadata:
    verified: true
    max-request: 1
    vendor: iqss
    product: dataverse
    shodan-query: 'http.title:"Dataverse"'
  tags: tech,detect,dataverse,research,data

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>[^<]*Dataverse[^<]*</title>'

      - type: word
        part: body
        words:
          - '/jakarta.faces.resource/'
          - '/javax.faces.resource/'
        condition: or

      - type: status
        status:
          - 200
