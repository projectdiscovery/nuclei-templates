id: owasp-threat-dragon-detect

info:
  name: OWASP Threat Dragon - Detect
  author: Eh-Mr-SK
  severity: info
  description: |
    Identifies the OWASP Threat Dragon threat modeling web application by its page title and product-specific JavaScript fallback message.
  reference:
    - https://owasp.org/www-project-threat-dragon/
    - https://github.com/OWASP/threat-dragon/blob/v2.6.2/td.vue/public/index.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"OWASP Threat Dragon"
    fofa-query: title="OWASP Threat Dragon"
  tags: tech,owasp,threat-dragon,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>OWASP Threat Dragon</title>"
          - "work properly without JavaScript enabled"
        condition: and

      - type: status
        status:
          - 200
