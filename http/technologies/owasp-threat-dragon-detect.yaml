id: owasp-threat-dragon-detect

info:
  name: OWASP Threat Dragon - Detect
  author: Eh-Mr-SK
  severity: info
  description: |
    Identifies the OWASP Threat Dragon threat modeling web application by its
    page title and product-specific JavaScript fallback message.
  reference:
    - https://owasp.org/www-project-threat-dragon/
    - https://github.com/OWASP/threat-dragon/blob/v2.6.2/td.vue/public/index.html
  metadata:
    verified: true
    max-request: 1
  tags: tech,owasp,threat-dragon,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - 'regex("(?i)^text/html(?:[[:blank:]]*;|$)", content_type)'

      - type: xpath
        part: body
        condition: and
        xpath:
          - "//head/title[normalize-space(.)='OWASP Threat Dragon']"
          - "//body//noscript[contains(., 'OWASP Threat Dragon') and contains(., 'work properly without JavaScript enabled')]"
