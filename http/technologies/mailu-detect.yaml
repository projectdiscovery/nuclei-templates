id: mailu-detect

info:
  name: Mailu - Detect
  author: rxerium
  severity: info
  description: |
    Mailu, an open-source mail server suite, was detected.
  reference:
    - https://mailu.io/
    - https://github.com/Mailu/Mailu
  metadata:
    verified: true
    max-request: 1
    vendor: mailu
    product: mailu
    shodan-query: 'http.title:"Mailu-Admin"'
  tags: tech,mailu,mail,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>Mailu-Admin\s*\|[^<]+</title>'

      - type: word
        part: body
        words:
          - 'data-static="/static/"'
          - 'href="/static/vendor.css"'
        condition: and

      - type: status
        status:
          - 200
