id: goatcounter-detect

info:
  name: GoatCounter - Detect
  author: rxerium
  severity: info
  description: |
    GoatCounter is an open-source, privacy-aware web analytics platform.
  reference:
    - https://www.goatcounter.com/
    - https://github.com/arp242/goatcounter
  metadata:
    verified: true
    max-request: 1
    vendor: goatcounter
    product: goatcounter
    shodan-query: 'http.title:"GoatCounter"'
  tags: goatcounter,analytics,privacy,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>GoatCounter</title>'
          - 'href="https://github.com/arp242/goatcounter"'
          - 'action="/user/requestlogin"'
        condition: and

      - type: status
        status:
          - 200
