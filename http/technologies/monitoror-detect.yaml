id: monitoror-detect

info:
  name: Monitoror - Detect
  author: rxerium
  severity: info
  description: |
    Monitoror, a self-hosted unified monitoring wallboard, was detected.
  reference:
    - https://monitoror.com/
    - https://github.com/monitoror/monitoror
  metadata:
    verified: true
    max-request: 1
    vendor: monitoror
    product: monitoror
    shodan-query: http.title:"Monitoror"
  tags: tech,monitoror,monitoring,observability,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'content="Monitoror — Unified monitoring wallboard"'
          - "Monitoror doesn't work properly without JavaScript enabled"
        condition: and

      - type: status
        status:
          - 200
