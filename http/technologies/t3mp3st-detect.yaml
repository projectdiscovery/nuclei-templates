id: t3mp3st-detect

info:
  name: T3MP3ST - Detect
  author: rxerium
  severity: info
  description: |
    Detected the T3MP3ST command-and-control dashboard, the multi-agent red-team harness’s Express web UI. The dashboard lived behind a 302 redirect from the service root to /ui/, so redirects were followed.
  reference:
    - https://github.com/elder-plinius/t3mp3st
    - https://blog.gitguardian.com/ai-pentesting-tools-beyond-artex/
  metadata:
    max-request: 1
    shodan-query: http.html:"T3MP3ST - Command & Control Dashboard"
  tags: tech,t3mp3st,detect,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'T3MP3ST - Command & Control Dashboard'

      - type: status
        status:
          - 200
