id: bareos-webui-detect

info:
  name: Bareos WebUI - Detect
  author: rxerium
  severity: info
  description: |
    Bareos WebUI is a web interface for monitoring and managing Bareos backup environments.
  reference:
    - https://github.com/bareos/bareos
    - https://docs.bareos.org/IntroductionAndTutorial/Webui.html
  metadata:
    verified: true
    max-request: 1
    vendor: bareos
    product: bareos
    shodan-query: http.title:"Bareos - Login"
  tags: tech,bareos,backup,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Bareos - Login</title>"
          - "img/bareos.png"
        condition: and

      - type: status
        status:
          - 200
