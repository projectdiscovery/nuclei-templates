id: cal-com-detect

info:
  name: Cal.com - Detect
  author: rxerium
  severity: info
  description: |
    Cal.com, an open-source scheduling platform, was detected.
  reference:
    - https://github.com/calcom/cal.com
    - https://cal.com/
  metadata:
    verified: true
    max-request: 1
    vendor: calcom
    product: cal.com
    shodan-query: 'http.title:"Cal.com"'
  tags: tech,cal-com,calcom,scheduling,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "<title>Login | Cal.com</title>", "href=\"/api/logo\"")'
        condition: and
