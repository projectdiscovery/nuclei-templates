id: eclipse-kapua-detect

info:
  name: Eclipse Kapua - Detect
  author: rxerium
  severity: info
  description: |
    Eclipse Kapua is an open-source IoT platform for device management and telemetry integration.
  reference:
    - https://www.eclipse.org/kapua/
    - https://github.com/eclipse-kapua/kapua
  metadata:
    verified: true
    max-request: 1
    vendor: eclipse
    product: kapua
    shodan-query: 'http.title:"Eclipse Kapua"'
  tags: eclipse,kapua,tech,iot,device-management,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Eclipse Kapua&trade; Console</title>'
          - 'src="js/kapuaconsole/console.js"'
        condition: and

      - type: status
        status:
          - 200
