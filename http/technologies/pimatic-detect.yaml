id: pimatic-detect

info:
  name: pimatic - Detect
  author: rxerium
  severity: info
  description: |
    pimatic is a plugin-based home automation framework with a web management interface.
  reference:
    - https://pimatic.org/
    - https://github.com/pimatic/pimatic
  metadata:
    verified: true
    max-request: 1
    vendor: pimatic
    product: pimatic
    shodan-query: 'http.title:"pimatic"'
  tags: pimatic,tech,iot,home-automation,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>pimatic</title>'
          - 'src="api/decl-api-client.js"'
        condition: and

      - type: status
        status:
          - 200
