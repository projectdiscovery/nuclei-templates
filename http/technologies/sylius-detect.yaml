id: sylius-detect

info:
  name: Sylius - Detect
  author: rxerium
  severity: info
  description: |
    Sylius ecommerce framework storefront or administration interface was detected.
  reference:
    - https://sylius.com/
    - https://github.com/Sylius/Sylius
  metadata:
    verified: true
    max-request: 1
    vendor: sylius
    product: sylius
    shodan-query: 'http.html:"sylius"'
  tags: tech,sylius,commerce,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Sylius"
        case-insensitive: true

      - type: regex
        part: body
        regex:
          - '(?:id="sylius-cart-button"|class="[^"]*sylius-product-name|data-route="sylius_shop_|/build/sylius-shop-|<title>Sylius \|)'

      - type: status
        status:
          - 200
          - 404
