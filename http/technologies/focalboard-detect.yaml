id: focalboard-detect

info:
  name: Focalboard - Detect
  author: rxerium
  severity: info
  description: |
    Focalboard is an open-source, self-hosted project management application.
  reference:
    - https://github.com/mattermost-community/focalboard
  metadata:
    verified: true
    max-request: 1
    vendor: mattermost
    product: focalboard
    shodan-query: 'http.title:"Focalboard"'
  tags: focalboard,mattermost,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Focalboard</title>'
          - 'class="focalboard-body"'
          - 'id="focalboard-app"'
        condition: and

      - type: status
        status:
          - 200
