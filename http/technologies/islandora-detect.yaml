id: islandora-detect

info:
  name: Islandora - Detect
  author: rxerium
  severity: info
  description: |
    Islandora open-source digital asset management and institutional repository platform was detected.
  reference:
    - https://www.islandora.ca/
    - https://github.com/Islandora/islandora
  metadata:
    verified: true
    max-request: 1
    vendor: islandora
    product: islandora
    shodan-query: 'http.html:"islandora.ca"'
  tags: tech,islandora,repository,library,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - '(contains(body, "islandora: http://islandora.ca/") && contains(body, "fedora: http://fedora.info/definitions/v4/repository#")) || (contains(body, "/islandora-") && contains(body, "islandora_solr"))'

      - type: word
        part: body
        words:
          - 'content="Drupal '

      - type: status
        status:
          - 200
