id: codemeter-detect

info:
  name: Wibu-Systems CodeMeter WebAdmin - Version Detection
  author: mr-pmillz
  severity: info
  description: |
    Detects Wibu-Systems CodeMeter WebAdmin and extracts the CodeMeter version displayed by its web interface.
  reference:
    - https://www.wibu.com/products/codemeter/runtime.html
  classification:
    cpe: cpe:2.3:a:wibu:codemeter:*:*:*:*:*:*:*:*
  metadata:
    vendor: wibu
    product: codemeter
    shodan-query: 'http.html:"CodeMeter" http.html:"WebAdmin"'
    fofa-query: 'body="CodeMeter" && body="WebAdmin"'
  tags: tech,detect,wibu,codemeter,webadmin,version,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/dashboard.html"
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Version 5.22a"
          - "Version 6.1"
          - "Version 6.2"
          - "Version 6.3"
          - "Version 6.30b"
          - "Version 6.4"
          - "Version 6.50a"
          - "Version 6.50b"
          - "Version 6.50c"
          - "Version 6.60a"
          - "Version 6.80"
          - "Version 6.81"
          - "Version 6.82"
          - "Version 6.83"
          - "Version 6.84"
          - "Version 7.0"
          - "Version 7.1"
          - "Version 7.10"
          - "Version 7.10a"
          - "Version 7.21"
          - "Version 7.30"
          - "Version 7.21a"
          - "Version 7.51a"
      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "Version (\\d+\\.\\d{1,2})"
          - "Version (\\d+\\.\\d{1,2}[a-z]?)"
