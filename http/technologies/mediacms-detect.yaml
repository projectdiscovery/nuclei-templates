id: mediacms-detect

info:
  name: MediaCMS - Detect
  author: rxerium
  severity: info
  description: |
    MediaCMS is an open-source video and media content management system.
  reference:
    - https://github.com/mediacms-io/mediacms
  metadata:
    verified: true
    max-request: 1
    vendor: mediacms-io
    product: mediacms
    shodan-query: 'http.html:"MediaCMS"'
  tags: mediacms,tech,detect,media,cms

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "var MediaCMS ="
          - "MediaCMS.api ="
        condition: and

      - type: status
        status:
          - 200
