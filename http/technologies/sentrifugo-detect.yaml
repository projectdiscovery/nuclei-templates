id: sentrifugo-detect

info:
  name: Sentrifugo - Detect
  author: rxerium
  severity: info
  description: |
    Sentrifugo is an open-source human resource management system.
  reference:
    - https://www.sentrifugo.com/
    - https://github.com/sapplica/sentrifugo
  metadata:
    verified: true
    max-request: 1
    vendor: sentrifugo
    product: sentrifugo
    shodan-query: http.title:"Sentrifugo"
  tags: tech,sentrifugo,hrms,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Sentrifugo'
          - '/public/media/'
        condition: and

      - type: status
        status:
          - 200
