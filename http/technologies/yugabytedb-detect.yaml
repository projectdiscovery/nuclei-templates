id: yugabytedb-detect

info:
  name: YugabyteDB - Detect
  author: rxerium
  severity: info
  description: YugabyteDB is an open-source distributed SQL database with a built-in web interface for cluster information.
  reference:
    - https://www.yugabyte.com/yugabytedb/
    - https://github.com/yugabyte/yugabyte-db
  metadata:
    verified: true
    max-request: 1
    vendor: yugabyte
    product: yugabytedb
    shodan-query: http.title:"YugabyteDB"
  tags: tech,yugabytedb,database,sql,cluster,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>YugabyteDB</title>"
          - "href='/yb.css'"
          - "YugabyteDB Version"
        condition: and

      - type: status
        status:
          - 200
