id: coroot-detect

info:
  name: Coroot - Detect
  author: rxerium
  severity: info
  description: |
    Coroot is an open-source observability and troubleshooting platform.
  reference:
    - https://coroot.com/
    - https://github.com/coroot/coroot
  metadata:
    verified: true
    max-request: 1
    vendor: coroot
    product: coroot
    shodan-query: http.title:"Coroot"
  tags: tech,coroot,detect,observability

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Coroot</title>'
          - 'window.coroot = {'
        condition: and

      - type: status
        status:
          - 200
