id: pentagi-detect

info:
  name: PentAGI - Detect
  author: rxerium
  severity: info
  description: |
    Detected PentAGI, an open-source autonomous AI-powered penetration testing platform with a Go/Gin backend serving a React single-page application. Matching was anchored on the exact HTML title element to avoid false positives on third-party articles merely mentioning PentAGI.
  reference:
    - https://github.com/vxcontrol/PentAGI
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"PentAGI"
  tags: tech,pentagi,detect,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>PentAGI</title>'

      - type: status
        status:
          - 200
