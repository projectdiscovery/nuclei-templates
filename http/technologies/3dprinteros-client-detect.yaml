id: 3dprinteros-client-detect

info:
  name: 3DPrinterOS Client - Detect
  author: rxerium
  severity: info
  description: |
    3DPrinterOS Client connects 3D printers to the 3DPrinterOS cloud management platform.
  reference:
    - https://www.3dprinteros.com/
  metadata:
    verified: true
    max-request: 1
    vendor: 3dprinteros
    product: 3dprinteros-client
    shodan-query: 'http.title:"3DPrinterOS Client"'
  tags: 3dprinteros,tech,iot,3d-printing,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>3DPrinterOS Client</title>'

      - type: word
        part: header
        words:
          - 'aiohttp/'

      - type: status
        status:
          - 401
