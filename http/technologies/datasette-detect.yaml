id: datasette-detect

info:
  name: Datasette - Detect
  author: rxerium
  severity: info
  description: Datasette is an open-source tool for exploring and publishing structured data through a web interface and API.
  reference:
    - https://datasette.io/
    - https://github.com/simonw/datasette
  metadata:
    verified: true
    max-request: 1
    vendor: simonw
    product: datasette
    shodan-query: http.title:"Datasette"
  tags: tech,datasette,database,data,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Datasette:"
          - 'href="https://datasette.io/" title="Datasette v'
        condition: and

      - type: status
        status:
          - 200
