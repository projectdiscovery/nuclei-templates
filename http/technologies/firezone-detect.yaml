id: firezone-detect

info:
  name: Firezone - Detect
  author: rxerium
  severity: info
  description: |
    Firezone is an open-source remote access platform built on WireGuard.
  reference:
    - https://www.firezone.dev/
    - https://github.com/firezone/firezone
  metadata:
    verified: true
    max-request: 1
    vendor: firezone
    product: firezone
    shodan-query: http.title:"Firezone"
  tags: tech,detect,firezone

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>[^<]*Firezone[^<]*</title>'

      - type: word
        part: body
        words:
          - 'phx-track-static'

      - type: status
        status:
          - 200
