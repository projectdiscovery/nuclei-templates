id: aptabase-detect

info:
  name: Aptabase - Detect
  author: rxerium
  severity: info
  description: |
    Aptabase is an open-source, privacy-first analytics platform for mobile, desktop, and web applications.
  reference:
    - https://aptabase.com/
    - https://github.com/aptabase/aptabase
  metadata:
    verified: true
    max-request: 1
    vendor: aptabase
    product: aptabase
    shodan-query: 'http.title:"Aptabase"'
  tags: aptabase,analytics,privacy,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Aptabase</title>'
          - 'content="Open Source, Privacy-First and Simple Analytics for Mobile, Desktop and Web apps."'
          - '<meta name="twitter:site" content="@aptabase"'
        condition: and

      - type: status
        status:
          - 200
