id: shellhub-detect

info:
  name: ShellHub - Detect
  author: rxerium
  severity: info
  description: |
    ShellHub is an open-source platform that centralises SSH access to Linux devices.
  reference:
    - https://github.com/shellhub-io/shellhub
    - https://docs.shellhub.io/
  metadata:
    verified: true
    max-request: 1
    vendor: shellhub-io
    product: shellhub
    shodan-query: http.title:"ShellHub"
  tags: tech,shellhub,ssh,remote-access,remote-management,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>ShellHub</title>"
          - "/env.js"
        condition: and

      - type: status
        status:
          - 200
