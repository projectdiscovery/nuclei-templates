id: medusa-storefront-detect

info:
  name: Medusa Storefront - Detect
  author: rxerium
  severity: info
  description: |
    Medusa commerce storefront starter was detected.
  reference:
    - https://medusajs.com/
    - https://github.com/medusajs/medusa
  metadata:
    verified: true
    max-request: 1
    vendor: medusajs
    product: medusa
    shodan-query: 'http.title:"Medusa Next.js Starter Template"'
  tags: tech,medusa,commerce,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Medusa Next.js Starter Template</title>"
          - "A performant frontend ecommerce starter template with Next.js"
        condition: and

      - type: status
        status:
          - 200
