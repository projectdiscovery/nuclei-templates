id: cabot-detect

info:
  name: Cabot - Detect
  author: rxerium
  severity: info
  description: |
    Cabot, an open-source monitoring and alerting service, was detected.
  reference:
    - https://github.com/arachnys/cabot
  metadata:
    verified: true
    max-request: 1
    vendor: arachnys
    product: cabot
    shodan-query: http.title:"Cabot by Arachnys"
  tags: tech,cabot,monitoring,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Cabot by Arachnys</title>'
          - '/static/arachnys/img/icon_48x48.'
        condition: and

      - type: status
        status:
          - 200
