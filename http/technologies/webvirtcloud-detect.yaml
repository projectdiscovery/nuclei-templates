id: webvirtcloud-detect

info:
  name: WebVirtCloud - Detect
  author: rxerium
  severity: info
  description: |
    WebVirtCloud is a web interface for administrators and users to manage virtualisation infrastructure through libvirt.
  reference:
    - https://github.com/retspen/webvirtcloud
  metadata:
    verified: true
    max-request: 1
    vendor: retspen
    product: webvirtcloud
    shodan-query: http.title:"WebVirtCloud"
  tags: tech,webvirtcloud,libvirt,virtualization,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "WebVirtCloud"
          - "/static/css/signin.css"
        condition: and

      - type: status
        status:
          - 200
