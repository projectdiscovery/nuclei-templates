id: pixelfed-detect

info:
  name: Pixelfed - Detect
  author: rxerium
  severity: info
  description: |
    Pixelfed is a federated image-sharing platform.
  reference:
    - https://pixelfed.org/
    - https://github.com/pixelfed/pixelfed
  metadata:
    verified: true
    max-request: 1
    vendor: pixelfed
    product: pixelfed
    shodan-query: 'http.html:"window.pfl"'
  tags: pixelfed,fediverse,social,photos,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'window.pfl = {'
          - '/css/landing.css?id='
        condition: and

      - type: regex
        part: header
        regex:
          - '(?mi)^set-cookie:\s*pxfs='

      - type: status
        status:
          - 200
