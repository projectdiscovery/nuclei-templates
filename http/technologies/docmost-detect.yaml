id: docmost-detect

info:
  name: Docmost - Detect
  author: rxerium
  severity: info
  description: |
    Docmost is an open-source collaborative wiki and documentation platform.
  reference:
    - https://docmost.com/
    - https://github.com/docmost/docmost
  metadata:
    verified: true
    max-request: 1
    vendor: docmost
    product: docmost
    shodan-query: http.title:"Docmost"
  tags: tech,docmost,detect,wiki

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Docmost</title>'
          - 'apple-mobile-web-app-title" content="Docmost"'
        condition: and

      - type: status
        status:
          - 200
