id: technitium-dns-server-detect

info:
  name: Technitium DNS Server - Detect
  author: rxerium
  severity: info
  description: |
    Technitium DNS Server is an open-source authoritative and recursive DNS server with a web management console.
  reference:
    - https://github.com/TechnitiumSoftware/DnsServer
  metadata:
    verified: true
    max-request: 1
    vendor: technitium
    product: dns_server
    shodan-query: http.title:"Technitium DNS Server"
  tags: tech,technitium,dns,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Technitium DNS Server</title>'
          - 'js/main.js'
        condition: and

      - type: status
        status:
          - 200
