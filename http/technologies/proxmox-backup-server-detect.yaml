id: proxmox-backup-server-detect

info:
  name: Proxmox Backup Server - Detect
  author: rxerium
  severity: info
  description: |
    Proxmox Backup Server is an enterprise backup solution for backing up and restoring virtual machines, containers, and physical hosts.
  reference:
    - https://www.proxmox.com/en/products/proxmox-backup-server/overview
    - https://pbs.proxmox.com/docs/
  metadata:
    verified: true
    max-request: 1
    vendor: proxmox
    product: backup_server
    shodan-query: http.html:"/js/proxmox-backup-gui.js"
  tags: tech,proxmox,backup,virtualization,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - " - Proxmox Backup Server</title>"
          - "/js/proxmox-backup-gui.js"
        condition: and

      - type: status
        status:
          - 200
