id: countly-detect

info:
  name: Countly - Detect
  author: rxerium
  severity: info
  description: |
    Countly is a privacy-focused product analytics and customer engagement platform.
  reference:
    - https://countly.com/
    - https://github.com/Countly/countly-server
  metadata:
    verified: true
    max-request: 1
    vendor: countly
    product: countly
    shodan-query: 'http.title:"Countly"'
  tags: countly,analytics,engagement,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Countly</title>'
          - 'window.countlyGlobal = window.countlyGlobal || {}'
          - 'stylesheets/pre-login/main.css'
        condition: and

      - type: status
        status:
          - 200
