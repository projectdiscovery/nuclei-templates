id: qdrant-detect

info:
  name: Qdrant - Detect
  author: rxerium
  severity: info
  description: |
    Qdrant, an open-source vector database and vector similarity search engine, was detected.
  reference:
    - https://qdrant.tech/documentation/
  metadata:
    max-request: 1
    shodan-query: 'html:"qdrant - vector search engine"'
  tags: tech,qdrant,database,vector

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"title":"qdrant - vector search engine"'

      - type: status
        status:
          - 200
