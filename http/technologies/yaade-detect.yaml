id: yaade-detect

info:
  name: Yaade - Detect
  author: rxerium
  severity: info
  description: |
    Yaade is an open-source, self-hosted, collaborative API development environment.
  reference:
    - https://docs.yaade.io/
    - https://github.com/EsperoTech/yaade
  metadata:
    verified: true
    max-request: 1
    vendor: esperotech
    product: yaade
    shodan-query: 'http.title:"Yaade"'
  tags: yaade,api,development,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Yaade</title>"
          - 'rel="modulepreload" href="./assets/vendor.'
        condition: and

      - type: word
        part: header
        words:
          - "set-cookie: vertx-web.session="
        case-insensitive: true

      - type: status
        status:
          - 200
