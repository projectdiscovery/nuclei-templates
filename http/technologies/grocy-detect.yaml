id: grocy-detect

info:
  name: Grocy - Detect
  author: rxerium
  severity: info
  description: |
    Grocy, a self-hosted household management application, was detected.
  reference:
    - https://github.com/grocy/grocy
    - https://grocy.info/
  metadata:
    verified: true
    max-request: 1
    vendor: grocy
    product: grocy
    shodan-query: 'http.title:"grocy"'
  tags: tech,grocy,household,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "/css/grocy.css?v=", "var Grocy = { };", "Grocy.View = ''login'';")'
        condition: and
