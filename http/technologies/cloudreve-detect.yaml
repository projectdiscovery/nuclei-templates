id: cloudreve-detect

info:
  name: Cloudreve - Detect
  author: rxerium
  severity: info
  description: |
    Cloudreve is a self-hosted file management and sharing platform supporting multiple storage providers.
  reference:
    - https://github.com/cloudreve/cloudreve
    - https://cloudreve.org/
  metadata:
    verified: true
    max-request: 1
    vendor: cloudreve
    product: cloudreve
    shodan-query: http.title:"Cloudreve"
  tags: tech,cloudreve,storage,file-sharing,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Cloudreve</title>"
          - "/static/img/favicon.ico"
        condition: and

      - type: status
        status:
          - 200
