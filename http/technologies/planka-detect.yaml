id: planka-detect

info:
  name: PLANKA - Detect
  author: rxerium
  severity: info
  description: |
    PLANKA, a self-hosted Kanban project management platform, was detected.
  reference:
    - https://planka.app/
    - https://github.com/plankanban/planka
  metadata:
    verified: true
    max-request: 1
    vendor: plankanban
    product: planka
    shodan-query: 'http.title:"PLANKA"'
  tags: tech,planka,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>PLANKA</title>'
          - 'content="PLANKA is the kanban-style project mastering tool for everyone"'
        condition: and

      - type: status
        status:
          - 200
