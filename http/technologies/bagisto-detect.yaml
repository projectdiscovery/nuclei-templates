id: bagisto-detect

info:
  name: Bagisto - Detect
  author: rxerium
  severity: info
  description: |
    Bagisto ecommerce storefront was detected.
  reference:
    - https://bagisto.com/
    - https://github.com/bagisto/bagisto
  metadata:
    verified: true
    max-request: 1
    vendor: webkul
    product: bagisto
    shodan-query: 'http.html:"Bagisto"'
  tags: tech,bagisto,webkul,commerce,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '<meta\s+name="generator"\s+content="Bagisto"'

      - type: word
        part: body
        words:
          - "<!-- Built With Bagisto -->"

      - type: status
        status:
          - 200
