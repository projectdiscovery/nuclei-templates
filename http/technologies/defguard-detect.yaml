id: defguard-detect

info:
  name: Defguard - Detect
  author: rxerium
  severity: info
  description: |
    Defguard is an open-source platform for secure remote access, WireGuard management and identity-aware access control.
  reference:
    - https://defguard.net/
    - https://github.com/DefGuard/defguard
  metadata:
    verified: true
    max-request: 1
    vendor: defguard
    product: defguard
    shodan-query: http.title:"Defguard"
  tags: tech,detect,defguard

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<meta name="application-name" content="Defguard"'
          - '<title>Defguard</title>'
          - '<title>Defguard Enrollment Service</title>'
          - 'Defguard VPN Enrollment Portal'
        condition: or

      - type: status
        status:
          - 200
