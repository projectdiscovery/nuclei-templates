id: cloudron-detect

info:
  name: Cloudron - Detect
  author: rxerium
  severity: info
  description: |
    Cloudron is a platform for running and managing web applications on a server.
  reference:
    - https://www.cloudron.io/
  metadata:
    verified: true
    max-request: 1
    vendor: cloudron
    product: cloudron
    shodan-query: http.title:"Cloudron - Not Found"
  tags: tech,cloudron,detect,platform

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Cloudron - Not Found</title>'

      - type: status
        status:
          - 200
          - 404
