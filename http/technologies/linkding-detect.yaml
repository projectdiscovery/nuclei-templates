id: linkding-detect

info:
  name: Linkding - Detect
  author: rxerium
  severity: info
  description: |
    Linkding, a self-hosted bookmark manager, was detected.
  reference:
    - https://github.com/sissbruecker/linkding
    - https://linkding.link/
  metadata:
    verified: true
    max-request: 1
    vendor: sissbruecker
    product: linkding
    shodan-query: 'http.title:"linkding"'
  tags: tech,linkding,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "data-api-base-url=\"/api/\"", "content=\"self-hosted bookmark service\"")'
        condition: and
