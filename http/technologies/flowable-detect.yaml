id: flowable-detect

info:
  name: Flowable - Detect
  author: rxerium
  severity: info
  description: |
    Flowable is a workflow and business process management platform for developers, administrators, and business users.
  reference:
    - https://github.com/flowable/flowable-engine
    - https://www.flowable.com/open-source
  metadata:
    verified: true
    max-request: 1
    vendor: flowable
    product: flowable
    shodan-query: 'http.title:"Flowable"'
  tags: tech,flowable,bpm,workflow,automation,low-code,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "<title>Flowable Design</title>", "<title>Flowable Control</title>", "<title>Flowable</title>")'
          - 'contains_any(body, "xmlns:flowable=", "ng-app=flowableModeler", "window.flowable", "flowable-logo.png")'
        condition: and
