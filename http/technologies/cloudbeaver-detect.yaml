id: cloudbeaver-detect

info:
  name: CloudBeaver Community - Detect
  author: rxerium
  severity: info
  description: |
    CloudBeaver Community is an open-source web-based database management application.
  reference:
    - https://github.com/dbeaver/cloudbeaver
  metadata:
    verified: true
    max-request: 1
    vendor: dbeaver
    product: cloudbeaver
    shodan-query: 'http.title:"CloudBeaver"'
  tags: cloudbeaver,dbeaver,community,database,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>CloudBeaver Community</title>'
          - 'id="app-loading-screen"'
          - 'var _ROOT_URI_ = '
        condition: and

      - type: status
        status:
          - 200
