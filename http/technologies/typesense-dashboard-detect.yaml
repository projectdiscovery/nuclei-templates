id: typesense-dashboard-detect

info:
  name: Typesense Dashboard - Detect
  author: rxerium
  severity: info
  description: Typesense Dashboard is a self-hosted web interface for managing and browsing Typesense collections.
  reference:
    - https://github.com/bfritscher/typesense-dashboard
    - https://hub.docker.com/r/bfritscher/typesense-dashboard
  metadata:
    verified: true
    max-request: 1
    vendor: bfritscher
    product: typesense_dashboard
    shodan-query: http.title:"Typesense-Dashboard"
  tags: tech,typesense,dashboard,search,database,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Typesense-Dashboard</title>"
          - 'content="A Typesense Dashboard to manage and browse collections."'
        condition: and

      - type: status
        status:
          - 200
