id: proget-detect

info:
  name: ProGet - Detect
  author: rxerium
  severity: info
  description: |
    ProGet is a self-hosted package and container repository.
  reference:
    - https://inedo.com/proget
    - https://docs.inedo.com/docs/proget-overview
  metadata:
    verified: true
    max-request: 1
    vendor: inedo
    product: proget
    shodan-query: http.title:"ProGet"
  tags: tech,proget,inedo,artifact,repository,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "x-proget-version:"
        case-insensitive: true

      - type: word
        part: body
        words:
          - "/resources/styles/proget.css"

      - type: status
        status:
          - 200
