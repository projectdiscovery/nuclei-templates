id: pgweb-detect

info:
  name: Pgweb - Detect
  author: rxerium
  severity: info
  description: Pgweb is an open-source, cross-platform web client for browsing PostgreSQL databases and running SQL queries.
  reference:
    - https://sosedoff.github.io/pgweb/
    - https://github.com/sosedoff/pgweb
  metadata:
    verified: true
    max-request: 1
    vendor: sosedoff
    product: pgweb
    shodan-query: http.title:"pgweb"
  tags: tech,pgweb,database,postgresql,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>pgweb</title>"
          - 'src="static/js/ace-pgsql.js"'
          - 'id="table_connection"'
        condition: and

      - type: status
        status:
          - 200
