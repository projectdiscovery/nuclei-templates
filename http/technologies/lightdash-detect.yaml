id: lightdash-detect

info:
  name: Lightdash - Detect
  author: rxerium
  severity: info
  description: |
    Lightdash is an open-source business intelligence platform for analytics and data visualisation.
  reference:
    - https://github.com/lightdash/lightdash
    - https://www.lightdash.com/
  metadata:
    verified: true
    max-request: 1
    vendor: lightdash
    product: lightdash
    shodan-query: 'http.title:"Lightdash"'
  tags: lightdash,analytics,bi,data,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Lightdash</title>'
          - "content=\"Lightdash - Explore and visualize your team's analytics and metrics.\""
        condition: and

      - type: word
        part: header
        words:
          - "Lightdash-Version:"
        case-insensitive: true

      - type: status
        status:
          - 200
