id: artex-panel

info:
  name: ARTEX Login - Panel
  author: Kazgangap
  severity: info
  description: |
    ARTEX login panel was detected. ARTEX is a self-hosted, LLM-driven penetration testing platform.
  reference:
    - https://github.com/BaaRai/ARTEX
  classification:
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    fofa-query: icon_hash="-576220750"
  tags: panel,artex,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>ARTEX")'
          - 'status_code == 200'
        condition: and
