id: bitwarden-vault-panel

info:
  name: Bitwarden Web Vault Login Panel - Detect
  author: ritikchaddha
  severity: info
  reference:
    - https://bitwarden.com/
  classification:
    cpe: cpe:2.3:a:bitwarden:bitwarden:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: bitwarden
    product: bitwarden
    shodan-query:
      - title:"Bitwarden Web Vault"
      - http.title:"bitwarden web vault"
    fofa-query: title="bitwarden web vault"
    google-query: intitle:"bitwarden web vault"
  tags: panel,bitwarden,vault,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Bitwarden Web Vault</title>'
          - 'alt="Bitwarden'
        condition: or

      - type: status
        status:
          - 200
