id: xcp-ng-xo-lite-panel

info:
  name: XCP-ng XO Lite - Login Panel
  author: rxerium
  severity: info
  description: |
    XO Lite local management interface hosted directly by an XCP-ng server was detected.
  reference:
    - https://docs.xcp-ng.org/management/manage-locally/xo-lite/
    - https://github.com/vatesfr/xen-orchestra
  metadata:
    verified: true
    max-request: 1
    vendor: xcp-ng
    product: xo_lite
    shodan-query: http.title:"XO Lite"
  tags: panel,xcp-ng,xo-lite,vates,virtualization,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>XO Lite</title>'

      - type: status
        status:
          - 200
