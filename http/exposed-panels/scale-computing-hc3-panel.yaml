id: scale-computing-hc3-panel

info:
  name: Scale Computing HC3 - Login Panel
  author: rxerium
  severity: info
  description: |
    Scale Computing HC3 web management login panel was detected. HC3, now part of the SC//HyperCore virtualization suite, provides hyperconverged compute, storage, and virtualization management.
  reference:
    - https://www.scalecomputing.com/sc-platform
  metadata:
    max-request: 1
    shodan-query: http.title:"Scale System"
  tags: panel,scale-computing,hc3,hci,virtualization,login

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Scale System</title>"
          - "branding/favicons/"
        condition: and

      - type: status
        status:
          - 200
