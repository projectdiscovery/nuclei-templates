id: actual-budget-panel

info:
  name: Actual Budget - Panel
  author: HaroonArshad-53
  severity: info
  description: |
    Actual Budget is a self-hosted, local-first personal finance application.
    An exposed login panel means the finance app's authentication surface is
    reachable from the network.
  reference:
    - https://github.com/actualbudget/actual
    - https://actualbudget.org/
  metadata:
    verified: true
    max-request: 1
    vendor: actualbudget
    product: actual_budget
  tags: panel,actual-budget,actual,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Actual</title>"

      - type: word
        part: body
        words:
          - 'content="#5c3dbb"'

      - type: word
        part: body
        words:
          - "/site.webmanifest"

      - type: status
        status:
          - 200
