id: minio-aistor-detect

info:
  name: MinIO AIStor - Panel Detection
  author: r3dg33k
  severity: info
  description: |
    Detects the presence of a MinIO AIStor instance, an object storage platform
  reference:
    - https://www.min.io/product/aistor
    - https://docs.min.io/aistor/
  metadata:
    verified: true
  tags: tech,panel,minio,aistor,storage

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>MinIO AIStor</title>"
          - "Storage Infrastructure"
          - "fonts/Geist/Geist"
        part: body
        condition: and

      - type: status
        status:
          - 200
