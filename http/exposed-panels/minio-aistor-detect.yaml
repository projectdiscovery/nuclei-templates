id: minio-aistor-detect

info:
  name: MinIO AIStor Console - Detect
  author: r3dg33k
  severity: info
  description: |
    MinIO AIStor console was detected. AIStor is MinIO's commercial object storage platform.
  reference:
    - https://www.min.io/product/aistor
    - https://docs.min.io/aistor/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:minio:minio:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: minio
    product: minio
    shodan-query:
      - http.title:"MinIO AIStor"
      - title:"MinIO AIStor"
    fofa-query: title="MinIO AIStor"
  tags: panel,minio,aistor,storage,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers:
      - type: dsl
        dsl:
          - "contains(tolower(body), '<title>minio aistor')"
          - "status_code==200"
        condition: and
