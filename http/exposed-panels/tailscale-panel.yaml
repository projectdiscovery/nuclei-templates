id: tailscale-panel

info:
  name: Tailscale - Panel Detect
  author: rxerium
  severity: info
  description: |
    Detected Tailscale node web interface.
  reference:
    - https://tailscale.com
  metadata:
    max-request: 1
    shodan-query: http.title:"Tailscale"
  tags: panel,tailscale,vpn,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Tailscale</title>'

      - type: status
        status:
          - 200
