id: one-identity-safeguard-spp-panel

info:
  name: One Identity Safeguard for Privileged Passwords - Login Panel
  author: rxerium
  severity: info
  description: |
    One Identity Safeguard for Privileged Passwords is a privileged password vault and session management platform. The login panel was detected.
  reference:
    - https://support.oneidentity.com/technical-documents/one-identity-safeguard-for-privileged-passwords
  metadata:
    verified: true
    max-request: 1
    vendor: oneidentity
    product: safeguard_for_privileged_passwords
    shodan-query: http.html:"Safeguard for Privileged Passwords"
  tags: panel,oneidentity,safeguard,spp,pam

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Safeguard for Privileged Passwords</title>'
          - '/images/SafeguardLogo.png'
        condition: and

      - type: status
        status:
          - 200
