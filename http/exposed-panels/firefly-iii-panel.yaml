id: firefly-iii-panel

info:
  name: Firefly III - Panel
  author: HaroonArshad-53
  severity: info
  description: |
    Firefly III is a self-hosted personal finance manager. An exposed login panel means the finance app's authentication surface is reachable from the network.
  reference:
    - https://github.com/firefly-iii/firefly-iii
    - https://www.firefly-iii.org/
  metadata:
    verified: true
    max-request: 1
    vendor: firefly-iii
    product: firefly-iii
    shodan-query: 'http.html:"logo-session.png"'
  tags: panel,firefly-iii,firefly,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<strong>Firefly</strong> III'

      - type: word
        part: body
        words:
          - 'images/logo-session.png'

      - type: status
        status:
          - 200
