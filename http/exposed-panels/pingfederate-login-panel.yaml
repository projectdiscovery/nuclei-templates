id: pingfederate-login-panel

info:
  name: PingFederate - Login Panel
  author: rxerium
  severity: info
  description: |
    PingFederate is an enterprise federation server for single sign-on and identity management. The administrative login panel was detected.
  reference:
    - https://docs.pingidentity.com/pingfederate/latest/getting_started_with_pingfederate/pf_get_started_w_pf.html
  metadata:
    verified: true
    max-request: 1
    vendor: pingidentity
    product: pingfederate
    shodan-query: http.html:"/pingfederate/dist/styles.css"
  tags: panel,pingfederate,identity

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '/pingfederate/dist/styles.css'
          - '/pingfederate/dist/index-bundle.js'
        condition: and

      - type: status
        status:
          - 200
