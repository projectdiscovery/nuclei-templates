id: kaseya-vsa-login-panel

info:
  name: Kaseya VSA - Login Panel
  author: rxerium
  severity: info
  description: |
    Kaseya Virtual System Administrator (VSA) login panel was detected.
  reference:
    - https://www.kaseya.com/products/vsa/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"/vsapres/web20/core/login.aspx"
  tags: panel,kaseya,vsa,login,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '/vsapres/web20/core/login.aspx'

      - type: status
        status:
          - 200
