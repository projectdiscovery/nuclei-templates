id: nakivo-backup-replication-panel

info:
  name: NAKIVO Backup & Replication - Login Panel
  author: rxerium
  severity: info
  description: |
    NAKIVO Backup & Replication web management login panel was detected. NAKIVO provides backup, recovery, replication, and disaster recovery capabilities for virtual, physical, cloud, and SaaS workloads.
  reference:
    - https://www.nakivo.com/
    - https://helpcenter.nakivo.com/User-Guide/Content/Home.htm
  metadata:
    verified: true
    max-request: 1
    vendor: nakivo
    product: backup_and_replication
    shodan-query: http.title:"NAKIVO Backup & Replication" port:4443
  tags: panel,nakivo,backup,replication,disaster-recovery,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/c/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>NAKIVO Backup & Replication v'

      - type: status
        status:
          - 200
