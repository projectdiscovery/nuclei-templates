id: tenable-sc-panel

info:
  name: Tenable Security Center - Login Panel
  author: rxerium
  severity: info
  description: |
    Tenable Security Center, formerly Tenable.sc and SecurityCenter, web management interface was detected.
  reference:
    - https://www.tenable.com/products/tenable-sc
  metadata:
    max-request: 1
    shodan-query: 'http.title:"Tenable.sc"'
  tags: panel,tenable,tenable-sc,securitycenter,vulnerability-management

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Tenable.sc</title>'

      - type: status
        status:
          - 200
