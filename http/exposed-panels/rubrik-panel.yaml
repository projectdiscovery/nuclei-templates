id: rubrik-panel

info:
  name: Rubrik - Login Panel
  author: rxerium
  severity: info
  description: |
    Rubrik appliance web management login panel was detected. Rubrik provides data protection, backup, recovery, and cyber resilience capabilities.
  reference:
    - https://www.rubrik.com/
  metadata:
    max-request: 1
    shodan-query: http.title:"Rubrik" -hostname:"my.rubrik.com"
  tags: panel,rubrik,backup,storage,login

http:
  - method: GET
    redirects: true
    max-redirects: 2
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Rubrik</title>'
          - 'ng-app="rubrikApp"'
        condition: and

      - type: status
        status:
          - 200
