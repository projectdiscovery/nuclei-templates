id: easy-timepro-login

info:
  name: easy TimePro Login Panel
  author: Th3l0newolf
  severity: info
  description: |
    easy TimePro login panel was discovered.
  metadata:
    verified: true
    product: easy-timepro
  tags: easy-timepro,login,panel

http:
  - method: GET
    path:
      - "{{BaseURL}}/login/?next=/"

    redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, "<title>easy TimePro</title>") && contains(body, ">Admin Login</a>") && contains(body, ">Employee Login</a>") && contains(body, "password_reset_mail_easytimepro/?email")'
