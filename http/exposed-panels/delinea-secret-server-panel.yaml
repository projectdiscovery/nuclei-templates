id: delinea-secret-server-panel

info:
  name: Delinea Secret Server - Login Panel
  author: rxerium
  severity: info
  description: |
    Delinea Secret Server, formerly Thycotic Secret Server, is an enterprise privileged access management and password vault platform. The login panel was detected.
  reference:
    - https://docs.delinea.com/online-help/secret-server/start.htm
  metadata:
    verified: true
    max-request: 1
    vendor: delinea
    product: secret_server
    shodan-query: http.title:"Secret Server"
  tags: panel,delinea,thycotic,secretserver,pam

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Secret Server'
          - 'Secret%20Server%20-%20SPA/'
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
