id: danfoss-ak-sm-800a-panel

info:
  name: Danfoss AK-SM 800A Web Management Panel
  author: flukes86
  severity: info
  description: >-
    Identifies the Danfoss AK-SM 800A / AK-SM 8xxA web management interface
    only. This is product/interface detection, not vulnerability or CVE
    detection, and does not prove a CVE, firmware version, authentication
    bypass, or exploitability.
  reference:
    - https://github.com/msuiche/fromagegate
    - https://claroty.com/team82/research/freeze-the-controller-defrost-the-food-uncovering-vulnerabilities-in-danfoss-refrigeration-controllers
    - https://raw.githubusercontent.com/msuiche/fromagegate/main/emulator/aksm800a_emulator.py
    - https://raw.githubusercontent.com/msuiche/fromagegate/main/captures/http-requests.jsonl
  metadata:
    vendor: Danfoss
    product: AK-SM 800A
    category: panel
  tags: panel,danfoss,iot,scada,detect,tech

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "StoreView - Login"
          - "AK-SM 800A"
        condition: and
      - type: regex
        part: header
        regex:
          - '(?im)^Server:\s*nginx(?:[/\s]|$)'
