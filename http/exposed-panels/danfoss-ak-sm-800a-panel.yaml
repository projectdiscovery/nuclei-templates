id: danfoss-ak-sm-800a-panel

info:
  name: Danfoss AK-SM 800A Web Management - Detect
  author: flukes86
  severity: info
  description: |
    Identifies the Danfoss AK-SM 800A / AK-SM 8xxA web management interface only. This is product/interface detection, not vulnerability or CVE detection, and does not prove a CVE, firmware version, authentication bypass, or exploitability.
  reference:
    - https://github.com/msuiche/fromagegate
    - https://claroty.com/team82/research/freeze-the-controller-defrost-the-food-uncovering-vulnerabilities-in-danfoss-refrigeration-controllers
    - https://raw.githubusercontent.com/msuiche/fromagegate/main/emulator/aksm800a_emulator.py
    - https://raw.githubusercontent.com/msuiche/fromagegate/main/captures/http-requests.jsonl
  metadata:
    vendor: Danfoss
    product: AK-SM 800A
    shodan-query: html:"AK-SM 800A"
    fofa-query: body="AK-SM 800A"
  tags: panel,danfoss,iot,scada,detect,tech

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "StoreView - Login", "StoreView Web", "Danfoss - StoreView") && contains(body, "AK-SM 800A")'
          - 'status_code == 200'
        condition: and
