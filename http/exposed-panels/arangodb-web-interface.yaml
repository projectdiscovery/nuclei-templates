id: arangodb-web-interface

info:
  name: ArangoDB Web Interface
  author: Th3l0newolf
  severity: info
  description: |
    ArangoDB Web Interface was discovered.
  metadata:
    verified: true
    product: arangodb
  tags: arangodb,web-interface

http:
  - method: GET
    path:
      - "{{BaseURL}}/_db/_system/_admin/aardvark/index.html"

    redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>ArangoDB Web Interface</title>")'
          - 'contains(body, "content=\"ArangoDB Admin Web Interface\"")'
        condition: and
