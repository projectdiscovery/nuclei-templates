id: atera-customer-portal

info:
  name: Atera Customer Portal - Login Panel
  author: rxerium
  severity: info
  description: |
    Atera customer portal login interface was detected.
  reference:
    - https://support.atera.com/hc/en-us
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Atera - Customers Portal"
  tags: panel,atera,rmm,login,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Atera - Customers Portal</title>'
          - 'window.ateraAnalyticsFirstLoad'
        condition: and

      - type: status
        status:
          - 200
