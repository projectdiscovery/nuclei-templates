id: cyberstrikeai-panel

info:
  name: Ed1s0nZ CyberStrikeAI - Panel
  severity: info
  author: darses
  description: |
    Ed1s0nZ CyberStrikeAI panel was detected.
  metadata:
    verified: true
    max-requests: 1
    vendor: ed1s0nz
    product: cyberstrikeai
    shodan-query:
      - title:"CyberStrikeAI"
  reference:
    - https://github.com/Ed1s0nZ/CyberStrikeAI
  tags: ed1s0nz,cyberstrikeai,detect,panel

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>CyberStrikeAI</title>"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - class="openapi-doc-btn"\s+onclick="window\.open\(\'([\w\:\/\.]+)\'

      - type: regex
        group: 1
        regex:
          - class="version-badge".*>(v[\d\.]+)<
