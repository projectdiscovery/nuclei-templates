id: cyberstrikeai-panel

info:
  name: Ed1s0nZ CyberStrikeAI - Panel
  severity: info
  author: darses
  description: |
    Ed1s0nZ CyberStrikeAI panel was detected.
  reference:
    - https://github.com/Ed1s0nZ/CyberStrikeAI
  metadata:
    verified: true
    max-requests: 1
    vendor: ed1s0nz
    product: cyberstrikeai
    shodan-query: title:"CyberStrikeAI"
  tags: ed1s0nz,cyberstrikeai,detect,panel

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "aria-label=\"CyberStrikeAI"
          - "alt=\"CyberStrikeAI Logo"
          - "/Ed1s0nZ/CyberStrikeAI"
          - "placeholder=\"CyberStrikeAI"
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - class="version-badge".*>(v[\d\.]+)<
