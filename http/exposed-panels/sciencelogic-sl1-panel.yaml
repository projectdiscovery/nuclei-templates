id: sciencelogic-sl1-panel

info:
  name: ScienceLogic SL1 (EM7) Panel - Detect
  author: cham423
  severity: info
  description: |
    ScienceLogic SL1 (formerly EM7) login panel was detected. SL1 is an IT infrastructure monitoring and AIOps platform.
  reference:
    - https://www.sciencelogic.com/
  metadata:
    verified: true
    max-request: 1
    vendor: sciencelogic
    product: sl1
    shodan-query:
      - http.favicon.hash:-209017361
      - http.title:"ScienceLogic EM7"
      - http.html:"login.em7"
    fofa-query:
      - icon_hash="-209017361"
      - title="ScienceLogic EM7"
      - body="login.em7"
  tags: panel,sciencelogic,sl1,login,detect,discovery

http:
  - raw:
      - |
        GET /em7/index.em7 HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "login.em7", "css.em7")'
          - 'status_code == 200'
        condition: and
