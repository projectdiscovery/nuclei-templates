id: pocket-id-panel

info:
  name: Pocket ID Login Panel - Detect
  author: 7xd0
  severity: info
  description: |
    Pocket ID login panel was detected. Pocket ID is a self-hosted OpenID Connect (OIDC) provider that lets users sign in to their services with passkeys.
  reference:
    - https://github.com/pocket-id/pocket-id
    - https://pocket-id.org
  metadata:
    verified: true
    max-request: 1
    product: pocket-id
    vendor: pocket-id
    shodan-query: http.favicon.hash:-1013186657
    fofa-query: icon_hash=="-1013186657"
  tags: panel,pocket-id,oidc,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'href="/api/application-images/favicon"'
          - 'mode-watcher-mode'
        condition: and

      - type: status
        status:
          - 200
