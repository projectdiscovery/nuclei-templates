id: crafty-controller-panel

info:
  name: Crafty Controller - Panel
  author: HaroonArshad-53
  severity: info
  description: |
    Crafty Controller is an open-source Minecraft server management panel.
    An internet-facing instance exposes its admin login page at the web
    root, giving anyone the address of the game-server administration
    interface. The panel itself requires a login, so this finding marks
    the exposed login surface rather than an authentication bypass.
  reference:
    - https://gitlab.com/crafty-controller/crafty-4
    - https://docs.craftycontrol.com/
  metadata:
    verified: true
    max-request: 1
    vendor: crafty_controller
    product: crafty_controller
    shodan-query: title:"Crafty Controller"
  tags: crafty,panel,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers:
      - type: word
        part: body
        words:
          - "<title>Crafty Controller</title>"
          - "/static/assets/crafty.webmanifest"
          - "/static/assets/css/crafty.css"
        condition: and
