id: asustor-adm-panel

info:
  name: ASUSTOR ADM - Login Panel
  author: rxerium
  severity: info
  description: |
    ASUSTOR Data Master network-attached storage management login panel was detected.
  reference:
    - https://www.asustor.com/admv2
  metadata:
    verified: true
    max-request: 1
    vendor: asustor
    product: asustor_data_master
    shodan-query: http.favicon.hash:1678170702
  tags: panel,asustor,adm,nas,storage,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Asustor Inc. All rights reserved.'

      - type: status
        status:
          - 200
