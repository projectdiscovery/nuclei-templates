id: cribl-stream-panel

info:
  name: Cribl Stream - Login Panel
  author: rxerium
  severity: info
  description: |
    Cribl Stream, formerly known as Cribl LogStream, web interface was detected.
  reference:
    - https://docs.cribl.io/stream/
  metadata:
    max-request: 1
    shodan-query: 'http.html:"Cribl LogStream"'
  tags: panel,cribl,stream,logstream

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Cribl LogStream</title>"
          - "<title>Cribl Stream</title>"
          - "<title>Cribl</title>"
        condition: or

      - type: word
        part: body
        words:
          - "stream.ico"
          - "window.CRIBL"
          - "static/css/main-light.css"
        condition: or

      - type: status
        status:
          - 200
