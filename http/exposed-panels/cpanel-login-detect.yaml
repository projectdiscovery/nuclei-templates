id: cpanel-login-detect

info:
  name: cPanel Login Panel - Detect
  author: johnk3r
  severity: info
  description: cPanel login panel was detected.
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"cPanel Login"
  tags: panel,login,cpanel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>cPanel Login</title>"

      - type: status
        status:
          - 200
