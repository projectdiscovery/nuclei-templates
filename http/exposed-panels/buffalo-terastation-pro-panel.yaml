id: buffalo-terastation-pro-panel

info:
  name: Buffalo TeraStation Pro - Login Panel
  author: rxerium
  severity: info
  description: |
    Buffalo TeraStation Pro network-attached storage management panel was detected.
  reference:
    - https://www.buffaloamericas.com/products/category/network-attached-storage
  metadata:
    verified: true
    max-request: 1
    vendor: buffalo
    product: terastation
    shodan-query: http.title:"TeraStation PRO - TS-"
  tags: panel,buffalo,terastation,nas,storage,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/top.cgi"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>TeraStation PRO - TS-'

      - type: status
        status:
          - 200
