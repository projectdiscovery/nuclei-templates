id: coolify-panel

info:
  name: Coolify Login Panel - Detect
  author: rafaelsoje
  severity: info
  description: |
    Coolify login panel was detected. Coolify is an open-source & self-hosted Heroku / Netlify / Vercel alternative used to manage applications, databases, and infrastructure.
  reference:
    - https://github.com/coollabsio/coolify
    - https://coolify.io/
  classification:
    cpe: cpe:2.3:a:coollabs:coolify:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: coollabs
    product: coolify
    shodan-query: http.title:"Coolify"
    fofa-query: title="Coolify"
  tags: panel,coolify,cloud,devops,docker,login,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Coolify"
          - "Sign in to manage your applications and infrastructure"
        condition: and

      - type: status
        status:
          - 200
