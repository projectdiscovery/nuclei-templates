id: openroaming-portal

info:
  name: OpenRoaming Portal - Detect
  author: johnk3r
  severity: info
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"OpenRoaming Portal"
  tags: tech,discovery,openroaming

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    stop-at-first-match: true
    matchers:
      - type: word
        words:
          - "openroaming@wballiance.com"
          - "Welcome to OpenRoaming Provisioning Service"

      - type: status
        status:
          - 200
