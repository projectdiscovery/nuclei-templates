id: simplehelp-login-panel

info:
  name: SimpleHelp - Login Panel
  author: rxerium
  severity: info
  description: |
    SimpleHelp remote support and management login panel was detected.
  reference:
    - https://simple-help.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Welcome to SimpleHelp"
  tags: panel,simplehelp,login,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/welcome"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Welcome to SimpleHelp</title>'

      - type: status
        status:
          - 200
