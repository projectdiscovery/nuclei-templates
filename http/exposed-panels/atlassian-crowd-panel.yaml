id: atlassian-crowd-panel

info:
  name: Atlassian Crowd Login Panel
  author: organiccrap,AdamCrosser
  severity: info
  description: An Atlassian Crowd login panel was discovered.
  reference:
    - https://www.atlassian.com/
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:atlassian:crowd:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: atlassian
    product: crowd
    category: sso
    shodan-query: http.component:"atlassian crowd"
  tags: panel,atlassian,crowd,sso,login,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/crowd/console/login.action'

    matchers-condition: or
    matchers:
      - type: word
        words:
          - <title>Atlassian Crowd - Login</title>
        part: body

      - type: word
        words:
          - <title>Atlassian Crowd - Log into Atlassian</title>
        part: body

    extractors:
      - type: regex
        name: version
        group: 1
        regex:
          - 'Version:&nbsp;([\d.]+)'
        part: body
