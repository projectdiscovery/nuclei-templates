id: argocd-login

info:
  name: Argo CD Login Panel
  author: Adam Crosser,daffainfo,aringo,righettod
  severity: info
  description: |
     ArgoCD was detected - A declarative, GitOps continuous delivery tool for Kubernetes.
  reference:
    - https://argoproj.github.io/cd/
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:argoproj:argo_cd:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    shodan-query: http.title:"Argo CD"
    product: argo_cd
    vendor: argoproj
  tags: panel,argocd,login,kubernetes,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/swagger.json"
      - "{{BaseURL}}/api/v1/settings"
      - "{{BaseURL}}/api/version"

    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: dsl
        dsl:
          - contains(to_lower(body_1), '<title>argo cd</title>')
          - status_code_1 == 200
        condition: and

      - type: dsl
        dsl:
          - contains(to_lower(body_2), 'argocd control plane')
          - status_code_2 == 200
        condition: and

      - type: dsl
        dsl:
          - contains(to_lower(body_3), 'argocd.argoproj.io')
          - status_code_3 == 200
        condition: and

      - type: dsl
        dsl:
          - contains(to_lower(header_4), 'grpc-metadata-content-type')
          - status_code_4 == 200
        condition: and

    extractors:
      - type: json
        json:
          - .Version
