id: aruba-airwave-panel

info:
  name: Aruba AirWave Management Platform - Login Panel
  author: rxerium
  severity: info
  description: |
    Aruba AirWave Management Platform web management interface was detected.
  reference:
    - https://www.arubanetworks.com/products/network-management-operations/airwave/
  metadata:
    max-request: 1
    shodan-query: 'http.html:"AirWave Management"'
  tags: panel,aruba,airwave,network-management

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"short_product_name" : "AMP"'
          - '"product_name" : "AirWave Management Platform"'
        condition: and

      - type: status
        status:
          - 200
