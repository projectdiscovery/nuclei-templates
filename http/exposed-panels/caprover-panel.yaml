id: caprover-panel

info:
  name: CapRover - Panel
  author: HaroonArshad-53
  severity: info
  description: |
    CapRover is a self-hosted platform-as-a-service for deploying web applications and databases on Docker Swarm. An exposed login panel means the platform's admin authentication surface is reachable from the network.
  reference:
    - https://github.com/caprover/caprover
    - https://caprover.com/
  metadata:
    verified: true
    max-request: 1
    vendor: caprover
    product: caprover
    shodan-query: title:"CapRover | Server Dashboard"
    fofa-query: title="CapRover | Server Dashboard"
  tags: panel,caprover,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>CapRover | Server Dashboard</title>")'
        condition: and
