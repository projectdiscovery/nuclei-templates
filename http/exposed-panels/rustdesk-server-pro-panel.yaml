id: rustdesk-server-pro-panel

info:
  name: RustDesk Server Pro - Login Panel
  author: rxerium
  severity: info
  description: |
    RustDesk Server Pro administrative web console was detected.
  reference:
    - https://rustdesk.com/docs/en/self-host/rustdesk-server-pro/console/
    - https://github.com/rustdesk/rustdesk-server-pro
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"RustDesk API Admin"
  tags: panel,rustdesk,server-pro,login,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/_admin/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Rustdesk API Admin</title>'

      - type: status
        status:
          - 200
