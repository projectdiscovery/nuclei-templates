id: duplicati-panel

info:
  name: Duplicati - Panel
  author: HaroonArshad-53
  severity: info
  description: |
    Duplicati is an open-source backup client with a web-based interface. An exposed panel means the backup server's web UI is reachable from the network; the root page serves Duplicati's client-chooser shell and its sign-in token page without authentication.
  reference:
    - https://duplicati.com/
    - https://github.com/duplicati/duplicati
  metadata:
    verified: true
    max-request: 1
    vendor: duplicati
    product: duplicati
    shodan-query: http.html:"Duplicati web UI relies on JavaScript"
  tags: panel,duplicati,backup,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "Duplicati web UI relies on JavaScript")'
          - 'contains(body, "oem/root/index/oem.js")'
        condition: and
