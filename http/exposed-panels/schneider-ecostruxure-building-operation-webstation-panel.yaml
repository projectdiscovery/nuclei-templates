id: schneider-ecostruxure-building-operation-webstation-panel

info:
  name: Schneider EcoStruxure Building Operation WebStation - Login Panel
  author: rxerium
  severity: info
  description: |
    Schneider Electric EcoStruxure Building Operation WebStation interface was detected.
  reference:
    - https://www.se.com/ww/en/product-range/62111-ecostruxure-building-operation/
  metadata:
    max-request: 1
    shodan-query: 'http.title:"Building Operation WebStation"'
  tags: panel,schneider,ecostruxure,webstation,bms,ics

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Building Operation WebStation</title>'
          - 'apple-mobile-web-app-title" content="WebStation"'
        condition: and

      - type: status
        status:
          - 200
