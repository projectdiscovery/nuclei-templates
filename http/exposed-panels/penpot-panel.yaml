id: penpot-panel

info:
  name: Penpot - Login Panel
  author: ashish-cybersec
  severity: info
  description: |
    Penpot is an open-source design and prototyping platform. The web interface was detected.
  reference:
    - https://help.penpot.app/technical-guide/getting-started/
  metadata:
    verified: true
    max-request: 1
    vendor: penpot
    product: penpot
    shodan-query: http.title:"Penpot"
    fofa-query: title="Penpot
  tags: panel,penpot,design,oss,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Penpot"
          - ".penpotVersion"
          - "penpotBuildDate"
          - "penpotWorkerURI"
          - "penpotTranslations"
          - "content=\"Penpot"
        condition: or

      - type: status
        status:
          - 200
