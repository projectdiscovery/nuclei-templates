id: zulip-login-panel

info:
  name: Zulip Login Panel
  author: Th3l0newolf
  severity: info
  description: |
    Zulip login panel was discovered.
  metadata:
    verified: true
    product: zulip
  tags: zulip,login,panel

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && (contains(body, "<title>Log in | Zulip</title>") || contains(body, "<h1 class=\"get-started\">Log in to Zulip</h1>") || contains(body, "Powered by Zulip"))'
