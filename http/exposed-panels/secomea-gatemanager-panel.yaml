id: secomea-gatemanager-panel

info:
  name: Secomea GateManager Panel - Detect
  author: cham423
  severity: info
  description: |
    Secomea GateManager panel was detected. GateManager is the remote access server that brokers LinkManager and SiteManager connections to industrial (OT) equipment.
  reference:
    - https://secomea.com/gatemanager-access-management-server/
  metadata:
    verified: true
    max-request: 1
    vendor: secomea
    product: gatemanager
    shodan-query:
      - http.favicon.hash:-498882777
      - http.title:"GateManager"
      - http.html:"land_gm.png"
    fofa-query:
      - icon_hash="-498882777"
      - title="GateManager"
      - body="land_gm.png"
  tags: panel,secomea,gatemanager,login,detect,discovery

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "Secomea", "/lib/land_gm.png")'
          - 'status_code == 200'
        condition: and

    extractors:
      - type: regex
        group: 1
        regex:
          - 'Secomea \w+ v\. ([\w.-]+)\.'
