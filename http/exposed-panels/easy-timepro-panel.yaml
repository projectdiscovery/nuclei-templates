id: easy-timepro-panel

info:
  name: easy TimePro Login - Panel
  author: Th3l0newolf
  severity: info
  description: |
    easy TimePro login panel was discovered.
  metadata:
    verified: true
    product: easy-timepro
    shodan-query: http.title:"easy TimePro"
  tags: easy-timepro,login,panel

http:
  - method: GET
    path:
      - "{{BaseURL}}/login/?next=/"

    redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "<title>easy TimePro</title>", "password_reset_mail_easytimepro/", "easy-time-pro-logo")'
        condition: and
