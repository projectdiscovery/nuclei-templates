id: chatwoot-super-admin-panel

info:
  name: Chatwoot Super Admin Panel - Detect
  author: SEU_GITHUB_USER
  severity: info
  description: |
    Detects an exposed Chatwoot Super Admin login page (/super_admin/sign_in).
    Chatwoot is a widely self-hosted customer support / omnichannel platform;
    an internet-facing super admin panel is a high-value target for credential
    stuffing / brute-force and reveals the exact installation for further
    version-based CVE correlation.
  reference:
    - https://www.chatwoot.com/
    - https://github.com/chatwoot/chatwoot
  classification:
    cpe: cpe:2.3:a:chatwoot:chatwoot:*:*:*:*:*:*:*:*
  metadata:
    verified: false # TODO: confirm against `docker compose` from chatwoot/chatwoot before PR
    max-request: 1
    vendor: chatwoot
    product: chatwoot
  tags: panel,chatwoot,login,detect,discovery

# TODO before PR: confirm exact <title> / distinguishing body string on a real instance.
http:
  - method: GET
    path:
      - "{{BaseURL}}/super_admin/sign_in"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Super Admin"
          - "chatwoot"
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
