id: hermes-agent-panel

info:
  name: Hermes Agent Login Panel - Detect
  author: rxerium
  severity: info
  description: |
    Hermes Agent is a self-improving AI agent built by Nous Research. Its web dashboard exposes a sign-in panel.
  reference:
    - https://github.com/NousResearch/hermes-agent
    - https://hermes-agent.nousresearch.com/docs/
    - https://nousresearch.com
  metadata:
    max-request: 1
    vendor: nousresearch
    product: hermes-agent
    shodan-query: 'http.title:"Hermes Agent"'
  tags: panel,hermes-agent,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Sign in — Hermes Agent'
          - '/auth/password-login'
        condition: and

      - type: status
        status:
          - 200
