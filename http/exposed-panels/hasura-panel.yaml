id: hasura-panel

info:
  name: Hasura GraphQL Console - Detect
  author: HaroonArshad-53
  severity: info
  description: |
    An unauthenticated request to /console returns the Hasura GraphQL Engine console shell, confirming a Hasura instance is exposed. The console page embeds Hasura's own asset host and console path, and the engine serves it with no admin secret required to load the page.
  reference:
    - https://hasura.io/docs/latest/graphql/core/hasura-console/
    - https://github.com/hasura/graphql-engine
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"graphql-engine-cdn.hasura.io"
    product: hasura
    vendor: hasura
    fofa-query: body="graphql-engine-cdn.hasura.io"
    google-query: inurl:"/console" "graphql-engine-cdn.hasura.io"
  tags: panel,hasura,graphql,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/console"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "graphql-engine-cdn.hasura.io/console/assets", "consolePath: \"/console\"")'
        condition: and
