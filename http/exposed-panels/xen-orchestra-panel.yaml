id: xen-orchestra-panel

info:
  name: Xen Orchestra - Login Panel
  author: rxerium
  severity: info
  description: |
    Xen Orchestra central management and backup web interface was detected.
  reference:
    - https://docs.xcp-ng.org/management/manage-at-scale/xo-web-ui/
    - https://github.com/vatesfr/xen-orchestra
  metadata:
    verified: true
    max-request: 1
    vendor: vates
    product: xen_orchestra
    shodan-query: http.title:"Xen Orchestra"
  tags: panel,xen-orchestra,xcp-ng,vates,virtualization,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/signin"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Xen Orchestra</title>'

      - type: status
        status:
          - 200
