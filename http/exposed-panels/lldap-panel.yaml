id: lldap-panel

info:
  name: LLDAP Admin Panel - Detect
  author: HaroonArshad-53
  severity: info
  description: |
    LLDAP is a lightweight LDAP directory server with a web administration UI for managing users, groups and passwords. An internet-reachable admin panel exposes the directory's login surface — the control plane for every account and group in the directory.
  reference:
    - https://github.com/lldap/lldap
  metadata:
    verified: true
    max-request: 1
    vendor: lldap
    product: lldap
    shodan-query: http.title:"LLDAP Administration"
    fofa-query: title="LLDAP Administration"
  tags: panel,lldap,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>LLDAP Administration</title>'
          - 'LLDAP requires JavaScript'
        condition: and

      - type: status
        status:
          - 200
