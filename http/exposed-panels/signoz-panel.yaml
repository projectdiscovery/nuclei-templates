id: signoz-panel

info:
  name: SigNoz - Login Panel
  author: rxerium
  severity: info
  description: |
    SigNoz open-source observability platform web interface was detected.
  reference:
    - https://signoz.io/docs/
    - https://github.com/SigNoz/signoz
  metadata:
    max-request: 1
    shodan-query: 'http.title:"Open source Observability platform | SigNoz"'
  tags: panel,signoz,observability

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Open source Observability platform | SigNoz'
          - 'SigNoz is an open source observability platform'
        condition: and

      - type: status
        status:
          - 200
