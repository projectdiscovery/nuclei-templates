id: cisco-meraki-exposure

info:
  name: Cisco Meraki Local Status Page - Detect
  author: dhiyaneshDK,r3naissance
  severity: info
  description: |
    Cisco Meraki local status page was detected. Meraki MX, MS, MR and MG devices serve this page to show their status and uplink details and to allow local configuration.
  reference:
    - https://www.exploit-db.com/ghdb/6708
    - https://documentation.meraki.com/General_Administration/Tools_and_Troubleshooting/Using_the_Cisco_Meraki_Device_Local_Status_Page
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    vendor: cisco
    product: meraki
    shodan-query:
      - http.html:"device_noun"
      - http.favicon.hash:804949239
  tags: panel,cisco,meraki,disclosure,edb,discovery

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains_all(body, "device_noun", "healthy_message")'
          - 'status_code >= 300 && status_code < 400 && contains(header, "devices.meraki.direct")'
        condition: or
