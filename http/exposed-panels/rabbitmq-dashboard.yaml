id: rabbitmq-dashboard

info:
  name: RabbitMQ Management Panel - Detect
  author: fyoorer,FLX
  severity: info
  description: RabbitMQ Management panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:vmware:rabbitmq:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: vmware
    product: rabbitmq
    shodan-query: cpe:"cpe:2.3:a:vmware:rabbitmq"
  tags: panel,rabbitmq,vmware,discovery

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - "RabbitMQ Management"
        part: body

  - method: GET
    path:
      - '{{BaseURL}}/api/version'

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - 'contains(content_type, "application/json")'
          - 'regex("^\"?[0-9]+\\.[0-9]+\\.[0-9]+", body)'
        condition: and

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - '([0-9]+\.[0-9]+\.[0-9]+)'
