id: sap-cloud-connector-panel

info:
  name: SAP Cloud Connector Panel
  author: righettod
  severity: info
  description: |
    SAP Cloud Connector was detected - a lightweight application to creates a secure connection between your on-premise systems and SAP Business Technology Platform.
  reference:
    - https://help.sap.com/docs/connectivity/sap-btp-connectivity-cf/cloud-connector
  metadata:
    max-request: 1
    shodan-query: http.html:"Cloud Connector Login"
  tags: panel,sap,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - contains_all(to_lower(body), "text:'cloud connector login'", "<title>login</title>")
          - status_code == 200
        condition: and
