id: sailpoint-identityiq-panel

info:
  name: SailPoint IdentityIQ - Login Panel
  author: rxerium
  severity: info
  description: |
    SailPoint IdentityIQ is an identity governance and administration platform. The IdentityIQ web login panel was detected.
  reference:
    - https://documentation.sailpoint.com/identityiq/help/
  metadata:
    verified: true
    max-request: 1
    vendor: sailpoint
    product: identityiq
    shodan-query: http.title:"SailPoint IdentityIQ"
  tags: panel,sailpoint,identityiq,iga

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<TITLE>SailPoint IdentityIQ</TITLE>'
          - 'Copyright 2008 SailPoint Technologies'
        condition: and

      - type: status
        status:
          - 200
