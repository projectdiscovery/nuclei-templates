id: jboss-admin-console-panel

info:
  name: JBoss AS/EAP Admin Console - Panel
  author: J2EEScan (ilmila), Tortuginator
  severity: info
  description: |
    The JBoss AS/EAP SEAM-based administration console login page
    (/admin-console/login.seam) was detected. Exposure of this panel to
    unauthenticated users is the first of the two J2EEScan "JBoss Admin Console"
    findings; weak/default credentials are checked by jboss-admin-console-default-login.
  reference:
    - https://github.com/ilmila/J2EEScan/blob/master/src/main/java/burp/j2ee/issues/impl/JBossAdminConsole.java
    - http://docs.jboss.org/jbossas/6/Admin_Console_Guide/en-US/html/Administration_Console_User_Guide-Accessing_the_Console.html
  metadata:
    verified: true
    max-request: 1
    vendor: redhat
    product: jboss_application_server
    shodan-query: http.title:"JBoss AS Admin Console"
  tags: jboss,admin-console,panel,seam,login

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin-console/login.seam"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        condition: or
        words:
          - "<title>JBoss AS Admin"
          - "<title>JBoss AS 6 Admin Console</title>"
          - "<title>JBoss EAP Admin Console</title>"
          - "Embedded Jopr Core"

      - type: status
        status:
          - 200