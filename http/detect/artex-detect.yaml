id: artex-detect

info:
  name: ARTEX - Detect
  author: rxerium
  severity: info
  description: |
    ARTEX, an open-source autonomous AI penetration-testing platform, was detected via its Next.js web console. The console title is localized (English, Korean, Chinese, Spanish, Japanese) and server-rendered from the shared app config.
  reference:
    - https://blog.gitguardian.com/ai-pentesting-tools-beyond-artex/
    - https://github.com/jiwoochris/artex-global
  metadata:
    max-request: 1
    shodan-query: http.title:"ARTEX"
  tags: tech,artex,detect,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        condition: or
        words:
          - 'ARTEX: Autonomous Penetration Testing Console'
          - 'ARTEX: 자율 침투 테스트 콘솔'
          - 'ARTEX — 自主渗透测试控制台'
          - 'ARTEX: Consola de Pruebas de Penetración Autónomas'
          - 'ARTEX: 自律型ペネトレーションテストコンソール'

      - type: status
        status:
          - 200
