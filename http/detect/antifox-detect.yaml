id: antifox-detect

info:
  name: AntiFox - Detect
  author: rxerium
  severity: info
  description: |
    Detects AntiFox, a Chinese AI autonomous penetration-testing platform (multi-agent, ARTEX-derived) whose Next.js web console serves a hardcoded page title. Docker deployments commonly publish ports 8787 and 8788.
  reference:
    - https://github.com/AntiFox-AI/antifox
  metadata:
    max-request: 1
    shodan-query: http.title:"AntiFox"
    fofa-query: title="AntiFox"
  tags: tech,antifox,detect,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        condition: and
        words:
          - 'AntiFox'
          - '自主渗透测试控制台'

      - type: status
        status:
          - 200
