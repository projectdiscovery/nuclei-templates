id: bugtraceai-detect

info:
  name: BugTraceAI - Detect
  author: rxerium
  severity: info
  description: |
    Detects BugTraceAI, an agentic AI pentesting platform, via its FastAPI engine root (serving "BugTraceAI API" identification JSON), its nginx SPA frontend, or its BugStore playground instance.
  reference:
    - https://blog.gitguardian.com/ai-pentesting-tools-beyond-artex/
  metadata:
    max-request: 1
    shodan-query: http.title:"BugTraceAI"
  tags: tech,bugtraceai,detect,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}/bugtraceai"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>BugTraceAI</title>'

      - type: status
        status:
          - 200
