id: cyberstrike-detect

info:
  name: CyberStrike - Detect
  author: rxerium
  severity: info
  description: |
    CyberStrike, an agentic AI penetration-testing harness wrapping a general coding agent with offensive skills, was detected via its web UI. This template requires both the product title and its distinctive favicon-v3.svg asset reference to avoid false positives on unrelated Cyber* products.
  reference:
    - https://github.com/CyberStrikeus/CyberStrike
    - https://blog.gitguardian.com/ai-pentesting-tools-beyond-artex/
  metadata:
    max-request: 1
    shodan-query: http.title:"CyberStrike" http.html:"favicon-v3.svg"
  tags: tech,cyberstrike,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        condition: and
        words:
          - 'CyberStrike'
          - 'favicon-v3.svg'

      - type: status
        status:
          - 200
