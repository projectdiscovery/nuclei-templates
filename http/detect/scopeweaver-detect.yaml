id: scopeweaver-detect

info:
  name: ScopeWeaver - Detect
  author: rxerium
  severity: info
  description: |
    ScopeWeaver, an LLM multi-agent autonomous penetration-testing system (ARTEX derivative), was detected via its web console running on port 8787. First visits present a setup wizard for configuring the backend and model provider.
  reference:
    - https://github.com/cskwork/scopeweaver
    - https://blog.gitguardian.com/ai-pentesting-tools-beyond-artex/
  metadata:
    max-request: 1
    shodan-query: http.title:"ScopeWeaver"
    fofa-query: title="ScopeWeaver"
  tags: tech,scopeweaver,detect,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Console for an LLM-driven autonomous penetration testing system'

      - type: status
        status:
          - 200
