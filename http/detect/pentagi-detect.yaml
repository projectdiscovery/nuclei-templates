id: pentagi-detect

info:
  name: PentAGI - Detect
  author: rxerium
  severity: info
  description: |
    Detects PentAGI, an open-source autonomous AI-powered penetration testing platform with a Go/Gin backend serving a React single-page application. Matching is anchored on the exact HTML title element to avoid false positives on third-party articles merely mentioning PentAGI.
  reference:
    - https://github.com/vxcontrol/PentAGI
  metadata:
    max-request: 1
    shodan-query: http.title:"PentAGI"
  tags: tech,pentagi,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>PentAGI</title>'

      - type: status
        status:
          - 200
