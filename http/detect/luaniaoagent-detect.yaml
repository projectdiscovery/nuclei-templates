id: luaniaoagent-detect

info:
  name: LuaN1aoAgent - Detect
  author: rxerium
  severity: info
  description: |
    Detected the web UI of LuaN1aoAgent (鸾鸟渗透智能体), a Chinese agentic penetration-testing framework whose console was normally served on 127.0.0.1:8787 but was exposed when published to a public interface.
  reference:
    - https://blog.gitguardian.com/ai-pentesting-tools-beyond-artex/
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"鸾鸟渗透智能体"
  tags: tech,luaniaoagent,detect,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '鸾鸟渗透智能体'
          - '鸾鸟Agent'
        condition: or

      - type: status
        status:
          - 200
