id: luaniaoagent-detect

info:
  name: LuaN1aoAgent - Detect
  author: rxerium
  severity: info
  description: |
    Detects the web UI of LuaN1aoAgent (鸾鸟渗透智能体), a Chinese agentic penetration-testing framework whose console is normally served on 127.0.0.1:8787 but is exposed when published to a public interface.
  reference:
    - https://blog.gitguardian.com/ai-pentesting-tools-beyond-artex/
  metadata:
    max-request: 1
    shodan-query: http.title:"鸾鸟渗透智能体"
  tags: tech,luaniaoagent,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        condition: or
        words:
          - '鸾鸟渗透智能体'
          - '鸾鸟Agent'

      - type: status
        status:
          - 200
