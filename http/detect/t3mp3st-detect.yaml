id: t3mp3st-detect

info:
  name: T3MP3ST - Detect
  author: rxerium
  severity: info
  description: |
    Detects the T3MP3ST command-and-control dashboard, the multi-agent red-team harness's Express web UI. The dashboard lives behind a 302 redirect from the service root to /ui/, so redirects are followed.
  reference:
    - https://github.com/elder-plinius/t3mp3st
    - https://blog.gitguardian.com/ai-pentesting-tools-beyond-artex/
  metadata:
    max-request: 1
    shodan-query: http.html:"T3MP3ST - Command & Control Dashboard"
  tags: tech,t3mp3st,detect,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>T3MP3ST - Command & Control Dashboard</title>'

      - type: status
        status:
          - 200
