id: incalmo-detect

info:
  name: Incalmo - Detect
  author: rxerium
  severity: info
  description: |
    Detects the Incalmo C2 framework by its API server signature, which returns a distinctive JSON message on the service root. Incalmo is a C2 framework noted in the GitGuardian "Beyond ARTEX" article, commonly serving an API/web UI on port 8443 or similar.
  reference:
    - https://blog.gitguardian.com/ai-pentesting-tools-beyond-artex/
  metadata:
    max-request: 1
    shodan-query: html:"Incalmo C2 Server API"
  tags: tech,incalmo,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Incalmo C2 Server API'

      - type: status
        status:
          - 200
