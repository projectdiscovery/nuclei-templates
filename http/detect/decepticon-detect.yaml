id: decepticon-detect

info:
  name: Decepticon - Detect
  author: rxerium
  severity: info
  description: |
    Detects Decepticon, an autonomous red-team agent platform whose opt-in web dashboard (served on localhost:3000 via /web) exposes the product name and tagline in its Next.js page title and body.
  reference:
    - https://github.com/BitterSecurity/Decepticon
    - https://blog.gitguardian.com/ai-pentesting-tools-beyond-artex/
  metadata:
    max-request: 1
    shodan-query: http.favicon.hash:-1814445533 || http.html:"Decepticon — Autonomous Red Team Platform"
  tags: tech,decepticon,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        condition: and
        words:
          - 'Decepticon'
          - 'Autonomous Red Team Platform'

      - type: status
        status:
          - 200
