id: vscode-mcp-json

info:
  name: Visual Studio Code MCP Configuration ("mcp.json") Exposure
  author: DhiyaneshDk
  severity: low
  description: |
    Detected exposed VS Code MCP (Model Context Protocol) configuration files (mcp.json) which may contain sensitive information including API keys, server endpoints, authentication tokens, and tool configurations for AI assistants and language models.
  reference:
    - https://code.visualstudio.com/docs/copilot/chat/mcp-servers
    - https://code.visualstudio.com/docs/copilot/reference/mcp-configuration
    - https://modelcontextprotocol.io/
  metadata:
    verified: true
    max-request: 3
    shodan-query: html:"mcp.json"
  tags: exposure,vscode,config,mcp,ai,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.vscode/mcp.json"
      - "{{BaseURL}}/mcp.json"
      - "{{BaseURL}}/.mcp.json"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '"(?:mcpServers|servers)"\s*:\s*\{'

      - type: regex
        part: body
        regex:
          - '"(?:command|args)"\s*:'
          - '"type"\s*:\s*"(?:stdio|http|sse)"'
        condition: or

      - type: status
        status:
          - 200
