id: bitbucket-oauth-exposure

info:
  name: Bitbucket OAuth Credentials Exposure
  author: TheZakMan
  severity: high
  description: Detects exposed auth.json files containing Bitbucket OAuth credentials
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-200
  tags: exposure,bitbucket,oauth,credentials,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{candidate_path}}"

    threads: 10
    payloads:
      candidate_path:
        - "auth.json"
        - ".auth.json"
        - "config/auth.json"
        - "configs/auth.json"
        - "configuration/auth.json"
        - "api/auth.json"
        - "app/auth.json"
        - "assets/auth.json"
        - "data/auth.json"
        - "files/auth.json"
        - "public/auth.json"
        - "static/auth.json"
        - "uploads/auth.json"
        - "backup/auth.json"
        - "backups/auth.json"
        - "tmp/auth.json"
        - "temp/auth.json"
        - "cache/auth.json"
        - "logs/auth.json"
        - "admin/auth.json"
        - "administrator/auth.json"
        - "src/auth.json"
        - "source/auth.json"
        - "www/auth.json"
        - "web/auth.json"
        - "site/auth.json"
        - "sites/auth.json"
        - "private/auth.json"
        - "secure/auth.json"
        - "secret/auth.json"
        - "secrets/auth.json"
        - "env/auth.json"
        - "environment/auth.json"
        - "test/auth.json"
        - "tests/auth.json"
        - "dev/auth.json"
        - "development/auth.json"
        - "staging/auth.json"
        - "prod/auth.json"
        - "production/auth.json"
        - "includes/auth.json"
        - "include/auth.json"
        - "lib/auth.json"
        - "libs/auth.json"
        - "library/auth.json"
        - "vendor/auth.json"
        - "vendors/auth.json"
        - "node_modules/auth.json"
        - "storage/auth.json"
        - "database/auth.json"
        - "db/auth.json"
        - "auth/auth.json"
        - "authentication/auth.json"
        - "oauth/auth.json"
        - "keys/auth.json"
        - "credentials/auth.json"
        - "creds/auth.json"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "bitbucket-oauth"
          - "bitbucket"
        condition: or
        case-insensitive: true

      - type: regex
        regex:
          - "(?i)consumer[-_]*secret"
          - "(?i)consumer[-_]*key"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: bitbucket_credentials
        group: 1
        regex:
          - '"consumer-key":\s*"([^"]+)"'
          - '"consumer-secret":\s*"([^"]+)"'
          - '"consumer_key":\s*"([^"]+)"'
          - '"consumer_secret":\s*"([^"]+)"'

      - type: regex
        name: bitbucket_oauth_block
        regex:
          - '"bitbucket-oauth":\s*\{[^}]+\}'
          - '"bitbucket":\s*\{[^}]+\}'
