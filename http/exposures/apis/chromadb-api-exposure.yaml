id: chromadb-api-exposure

info:
  name: Unauthenticated ChromaDB REST API
  author: comradezephyr
  severity: high
  description: Exposed ChromaDB vector database REST API allowing unauthorized collection and document access.
  tags: mlops,ai,chromadb,vectordb,unauth,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/heartbeat"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "nanosecond heartbeat"
      - type: regex
        part: body
        regex:
          - '"nanosecond heartbeat"\s*:\s*[0-9]{9,}'
    extractors:
      - type: regex
        part: body
        regex:
          - '"nanosecond heartbeat"\s*:\s*([0-9]+)'

  - method: GET
    path:
      - "{{BaseURL}}/api/v1/collections"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - name
      - type: regex
        part: body
        regex:
          - '"id"\s*:\s*"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
    extractors:
      - type: regex
        part: body
        regex:
          - '"name"\s*:\s*"([^"]+)"'
