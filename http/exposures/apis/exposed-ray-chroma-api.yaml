id: ray-dashboard-exposure

info:
  name: Exposed AnyScale Ray Dashboard API
  author: comradezephyr
  severity: high
  description: Unauthenticated Ray dashboard API exposing cluster status, active jobs, and execution logs.
  tags: mlops,ai,ray,unauth,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/jobs/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - job_id
          - status
          - entrypoint
        condition: and
      - type: regex
        part: body
        regex:
          - '"status"\s*:\s*"(PENDING|RUNNING|STOPPING|STOPPED|SUCCEEDED|FAILED|ABORTED|RESTARTING)'
    extractors:
      - type: regex
        part: body
        regex:
          - '"job_id"\s*:\s*"([0-9a-f]+)"'
          - '"entrypoint"\s*:\s*"([^"]+)"'

  - method: GET
    path:
      - "{{BaseURL}}/api/version"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: header
        words:
          - "application/json"
      - type: regex
        part: body
        regex:
          - '"(ray_version|version)"\s*:\s*"[0-9]+\.[0-9]+\.[0-9]+'
          - '"(git_commit|ray_commit|session_name)"'
        condition: and
    extractors:
      - type: regex
        part: body
        regex:
          - '"ray_version"\s*:\s*"([^"]+)"'
          - '"git_commit"\s*:\s*"([^"]+)"'
