id: wsdl-api

info:
  name: WSDL API - Detect
  author: jarijaas,matejsmycka
  severity: info
  description: WSDL API was detected.
  reference:
    - https://www.w3.org/TR/wsdl/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 2
  tags: exposure,api,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/?wsdl"
      - "{{BaseURL}}?wsdl"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "wsdl:definitions"

      - type: status
        status:
          - 200
