id: qdrant-api-exposure

info:
  name: Qdrant - Unauthenticated Vector DB API Exposure
  author: comradezephyr
  severity: high
  description: |
    Qdrant vector database API is exposed without authentication, allowing unauthorized access to collection schemas and vector embeddings.
  reference:
    - https://github.com/qdrant/qdrant
    - https://qdrant.tech/documentation/
  metadata:
    verified: true
    max-request: 1
    vendor: qdrant
    product: qdrant
    shodan-query: title:"Qdrant"
  tags: qdrant,vectordb,exposure,unauth,mlops,ai

http:
  - raw:
      - |
        GET /collections HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "\"collections\"") && contains(body, "\"status\":\"ok\"")'
          - 'status_code == 200'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"name"\s*:\s*"([^"]+)"'
