id: directus-api-exposure

info:
  name: Directus Server Info - Unauthenticated Fingerprint
  author: RootKaito
  severity: info
  description: |
    Directus /server/info endpoint is exposed without authentication, leaking project metadata and license configuration.
  reference:
    - https://directus.io/docs/api/server
  classification:
    cpe: cpe:2.3:a:directus:directus:*:*:*:*:*:node.js:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: monospace
    product: directus
  tags: exposure,directus,fingerprint,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}/server/info"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"display_powered_by"'
          - '"DIRECTUS"'
          - '"entitlements"'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: json
        name: project_name
        json:
          - ".data.project.project_name"

      - type: json
        name: production_enabled
        json:
          - ".data.license.entitlements.production_enabled"
