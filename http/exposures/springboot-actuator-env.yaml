id: springboot-actuator-env

info:
  name: Spring Boot Actuator env Unauthorized Access
  author: xiangdangloser
  severity: medium
  description: Spring Boot Actuator /actuator/env is accessible without authentication, leaking configuration and possibly credentials.
  reference:
    - https://cwe.mitre.org/data/definitions/306.html
  metadata:
    max-request: 1
    fofa-query: title="Whitelabel Error Page"
  tags: springboot,exposure,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/actuator/env"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"activeProfiles"'
          - '"propertySources"'
        condition: and
      - type: status
        status:
          - 200
