id: maven-settings-credentials-exposure

info:
  name: Apache Maven settings.xml Credentials - Exposure
  author: ChrisJr404
  severity: high
  description: |
    An Apache Maven settings.xml file is exposed. The server section of this file stores the credentials Maven uses to authenticate to remote repositories and distribution servers, so a public copy can leak repository usernames and passwords.
  reference:
    - https://maven.apache.org/settings.html
    - https://maven.apache.org/guides/mini/guide-encryption.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-522
  metadata:
    verified: false
    max-request: 3
    google-query: intitle:"index of" "settings.xml" "maven.apache.org/SETTINGS"
  tags: exposure,config,maven,java,credentials,files

http:
  - method: GET
    path:
      - "{{BaseURL}}/settings.xml"
      - "{{BaseURL}}/.m2/settings.xml"
      - "{{BaseURL}}/conf/settings.xml"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "maven.apache.org/SETTINGS"

      - type: word
        part: body
        words:
          - "<server>"
          - "<password>"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<username>([^<]+)</username>'
