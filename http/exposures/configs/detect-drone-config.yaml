id: detect-drone-config

info:
  name: Drone - Configuration Detection
  author: geeknik,FLX
  severity: high
  description: |
    Drone CI configuration file was discovered. The exposed file can disclose
    pipeline definitions, container images and references to secrets.
  reference:
    - https://github.com/drone/drone
    - https://docs.drone.io/pipeline/configuration/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: config,exposure,drone,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/.drone.yml"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?m)^kind:[ \t]*pipeline\s*$'
          - '(?m)^steps:\s*$'
          - '(?m)^[ \t]+(image|commands|settings|environment):'
        condition: and

      - type: word
        part: header
        words:
          - "text/html"
        negative: true
        case-insensitive: true

      - type: status
        status:
          - 200
