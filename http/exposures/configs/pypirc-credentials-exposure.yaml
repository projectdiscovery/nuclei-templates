id: pypirc-credentials-exposure

info:
  name: Python .pypirc Credentials - Exposure
  author: ChrisJr404
  severity: high
  description: |
    A Python .pypirc configuration file is exposed. This file stores the credentials used by tools like twine and setuptools to upload packages to PyPI or a private package index, and it commonly holds a plaintext password or an upload API token.
  reference:
    - https://packaging.python.org/en/latest/specifications/pypirc/
    - https://twine.readthedocs.io/en/stable/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-522
  metadata:
    verified: false
    max-request: 2
    google-query: intitle:"index of" ".pypirc"
  tags: exposure,config,pypi,python,credentials,files

http:
  - method: GET
    path:
      - "{{BaseURL}}/.pypirc"
      - "{{BaseURL}}/pypirc"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "[distutils]"
          - "[pypi]"
          - "[testpypi]"
        condition: or

      - type: word
        part: body
        words:
          - "password"
          - "username"
        condition: or

      - type: word
        part: body
        words:
          - "<html"
          - "<body"
          - "<!DOCTYPE"
          - "<script"
        condition: or
        negative: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'username\s*[=:]\s*([^\r\n]+)'
