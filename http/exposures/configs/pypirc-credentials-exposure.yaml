id: pypirc-credentials-exposure

info:
  name: Python .pypirc Credentials - Exposure
  author: ChrisJr404
  severity: high
  description: |
    Detected A Python .pypirc configuration file is exposed. This file stores the credentials used by tools like twine and setuptools to upload packages to PyPI or a private package index, and it commonly holds a plaintext password or an upload API token.
  reference:
    - https://packaging.python.org/en/latest/specifications/pypirc/
    - https://twine.readthedocs.io/en/stable/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-522
  metadata:
    verified: false
    max-request: 2
    google-query: intitle:"index of" ".pypirc"
  tags: exposure,config,pypi,python,credentials,files

http:
  - raw:
      - |
        GET /.pypirc HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /{{path}}/.pypirc HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /.pypirc.bak HTTP/1.1
        Host: {{Hostname}}

    payloads:
      path:
        - ".config"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "[distutils]", "[server-login]", "[pypirc]", "[pypi]")'
          - 'contains_any(body, "index-servers", "username", "password", "repository")'
        condition: and

      - type: word
        part: response
        words:
          - "MongoDB over HTTP on the native"
          - "application/javascript"
          - "application/x-javascript"
          - "application/json"
          - "application/xml"
          - "text/xml"
          - "<html"
          - "<!doctype"
          - "<script"
          - "<meta"
          - "image/"
          - "Response xmlns"
        negative: true
