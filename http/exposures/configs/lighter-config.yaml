id: lighter-config

info:
  name: Lighter - Config Exposed
  author: icarot
  severity: medium
  description: |
    Detects if the config page of the Lighter server is exposed, it is an opensource REST application for interacting with Apache Spark on Kubernetes or Apache Hadoop YARN.
  reference:
    - https://github.com/exacaster/lighter
  metadata:
    max-request: 1
    vendor: exacaster
    product: lighter
    shodan-query: title:"Lighter"
  tags: lighter,exacaster,spark,config,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/lighter/api/configuration"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'sparkHistoryServerUrl'
          - 'externalLogsUrlTemplate'
          - 'sessionConfiguration'
        condition: and

      - type: status
        status:
          - 200
