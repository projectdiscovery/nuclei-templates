id: nuget-config-credentials-exposure

info:
  name: NuGet.config Package Source Credentials - Exposure
  author: ChrisJr404
  severity: high
  description: |
    A NuGet.config file with a packageSourceCredentials section is exposed. NuGet stores per-feed authentication in this section and often keeps it as a ClearTextPassword, so a public copy leaks the username and password used to reach private package feeds.
  reference:
    - https://learn.microsoft.com/en-us/nuget/reference/nuget-config-file
    - https://learn.microsoft.com/en-us/nuget/consume-packages/consuming-packages-authenticated-feeds
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-522
  metadata:
    verified: false
    max-request: 3
    google-query: intitle:"index of" "nuget.config"
  tags: exposure,config,nuget,dotnet,credentials,files

http:
  - method: GET
    path:
      - "{{BaseURL}}/nuget.config"
      - "{{BaseURL}}/NuGet.Config"
      - "{{BaseURL}}/.nuget/nuget.config"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "packageSourceCredentials"

      - type: word
        part: body
        words:
          - "ClearTextPassword"
          - "cleartextpassword"
          - "\"Password\""
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'key="Username"\s+value="([^"]+)"'
