id: google-api-key

info:
  name: Google API Key
  author: Swissky
  severity: low
  reference:
    - https://cloud.google.com/docs/authentication/api-keys#securing
    - https://support.google.com/googleapi/answer/6310037
  metadata:
    max-request: 2
  tags: exposure,token,google,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/hopfully404"

    extractors:
      - type: regex
        part: body
        regex:
          - "AIza[0-9A-Za-z\\-_]{35}"
