id: anthropic-api-key

info:
  name: Anthropic API Key
  author: shadowhunter_92
  severity: info
  reference:
    - https://docs.anthropic.com/en/api/getting-started
    - https://docs.anthropic.com/en/api/admin-api
    - https://github.com/praetorian-inc/noseyparker/blob/main/crates/noseyparker/data/default/builtin/rules/anthropic.yml
  metadata:
    verified: true
    max-request: 1
  tags: anthropic,claude,token,exposure,vuln,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - "sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{95}"
          - "sk-ant-admin[0-9]{2}-[A-Za-z0-9_-]{95}"
