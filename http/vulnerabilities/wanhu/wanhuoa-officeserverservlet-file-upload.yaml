id: wanhuoa-officeserverservlet-file-upload

info:
  name: Wanhu OA OfficeServerServlet - Arbitrary File Upload
  author: SleepingBag945
  severity: critical
  description: Wanhu OA officeserverservlet file upload vulnerability
  reference:
    - https://github.com/onMey/WH/blob/main/poc.py
    - http://wiki.peiqi.tech/wiki/oa/%E4%B8%87%E6%88%B7OA/%E4%B8%87%E6%88%B7OA%20OfficeServer.jsp%20%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0%E6%BC%8F%E6%B4%9E.html
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="万户网络-ezOFFICE"
  tags: wanhu,oa,officeserver,fileupload,intrusive,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/defaultroot/officeserverservlet"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "DBSTEP V3.0"
          - "Post"
        condition: and

      - type: status
        status:
          - 200
