id: xss-fuzzing

info:
  name: Generic Cross Site Scripting
  author: idalunalabs
  severity: medium
  description: |
    Fuzzing template to detect Reflected and DOM-based Cross-Site Scripting (XSS) vulnerabilities.
    Injects common XSS payloads into query parameters and checks for reflection in the response body.
  reference:
    - https://owasp.org/www-community/attacks/xss/
    - https://portswigger.net/web-security/cross-site-scripting
  tags: xss,rxss,dast

variables:
  first: "{{rand_int(10000, 99999)}}"

http:
  - payloads:
      reflection:
        - '"><h1>{{first}}</h1>'
        - '"><img src=x onerror=alert(1)>'
        - '"><svg onload=alert(1)>'

    fuzzing:
      - part: query
        type: postfix
        mode: single
        fuzz:
          - '{{reflection}}'

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<h1>{{first}}</h1>'
          - '<img src=x onerror=alert(1)>'
          - '<svg onload=alert(1)>'
        condition: or

      - type: word
        part: header
        words:
          - text/html

      - type: status
        status:
          - 200
