id: stored-xss

info:
  name: Stored XSS Detection
  author: Flawfence
  severity: high
  tags: xss, storedxss, dast
  description: |
    Operator-configured skeleton to detect a stored XSS vulnerability. Fill the FIXME_* placeholders
    for the target form, then run against a consented application. The injected value is a benign,
    randomized markup canary (a custom non-executing element - no <script>, no event handler); the
    matcher confirms the canary is reflected UNENCODED, demonstrating the markup-injection point
    without planting an executable payload.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/v41/4-Web_Application_Security_Testing/07-Input_Validation_Testing/02-Testing_for_Stored_Cross_Site_Scripting.html
    - https://portswigger.net/web-security/cross-site-scripting/stored

variables:
  canary: "ffxss{{rand_int(100000, 999999)}}"
  payload: "<{{canary}}>canary</{{canary}}>"

http:
  - id: inject-payload
    raw:
      - |
        FIXME_METHOD FIXME_ACTION?FIXME_ARGUMENT HTTP/1.1
        Host: {{Host}}
        Connection: close
        Cookie: FIXME_COOKIES
        Origin: {{BaseURL}}
        Referer: {{BaseURL}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.6723.59 Safari/537.36
        Accept: application/json, text/javascript, */*; q=0.01
        Accept-Language: en-US,en;q=0.9
        Content-Type: FIXME_ENCTYPE
        X-Requested-With: XMLHttpRequest

        FIXME_BODY

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<{{canary}}>canary</{{canary}}>"

      - type: word
        part: header
        words:
          - "text/html"

    extractors:
      - type: regex
        part: body
        name: xss_proof
        group: 1
        regex:
          - "<(ffxss[0-9]+)>canary</ffxss[0-9]+>"

  - id: check-payload
    method: "GET"
    path:
      - "FIXME_ACTION?FIXME_ARGUMENT"
    headers:
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
      User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.6723.59 Safari/537.36
      Cookie: FIXME_COOKIES

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<{{canary}}>canary</{{canary}}>"

      - type: word
        part: header
        words:
          - "text/html"

    extractors:
      - type: regex
        part: body
        name: xss_proof
        group: 1
        regex:
          - "<(ffxss[0-9]+)>canary</ffxss[0-9]+>"
