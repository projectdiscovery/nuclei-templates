id: stored-xss-single-request

info:
  name: Stored XSS Detection with Single Request Injection (Dynamic Full Action URL & Method RAW)
  author: Trackflaw
  severity: high
  tags: xss, storedxss, dast
  description: |
    Detects a stored XSS vulnerability by injecting a benign, randomized markup canary into all form
    fields except submit buttons in a single request, then checking whether the canary is reflected
    UNENCODED in the response. The canary is a custom non-executing element (no <script>, no event
    handler), so the probe demonstrates the markup-injection point without planting an executable
    payload. Intended for consented DAST runs against a specific application.

variables:
  xssProof: "ffxss{{rand_int(100000, 999999)}}"
  xssPayload: "<{{xssProof}}>canary</{{xssProof}}>"
  newHostname: "{{Hostname}}"

flow: |
  http(1);

  let payloads = [];

  for (let field of iterate(template["form_field_names"])) {
    if (field.toLowerCase() !== "submit") {
        payloads.push(`${field}={{xssPayload}}`);
    } else {
      payloads.push(`${field}=Submit`);
    }
  }
  set("full_payload", payloads.join("&"));

  let action_url = template["form_action"];

  let method = template["form_method"].toUpperCase() || "POST";
  set("method", method)

  if (action_url.startsWith("http")) {
    set("full_url", action_url);

  } else {
    let full_url = "{{RootURL}}/" + action_url
    log(full_url)
    set("full_url", full_url);
  }

  http(2);

http:
  - raw:
      - |
        GET {{BaseURL}} HTTP/1.1
        Host: {{newHostname}}
        Connection: close
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_4) AppleWebKit/537.36 (KHTML, like Gecko)
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8
        Accept-Language: en-US,en;q=0.9
        Content-Type: application/x-www-form-urlencoded

    extractors:
      - type: regex
        part: body
        name: "form_field_names"
        group: 1
        internal: true
        regex:
          - name=["\']?([^"\'>]+)["\']?

      - type: regex
        part: body
        name: "form_action"
        group: 1
        internal: true
        regex:
          - action=["\']?([^"\'>]+)["\']?

      - type: regex
        part: body
        name: "form_method"
        group: 1
        internal: true
        regex:
          - method=["\']?(get|post|put|patch)["\']?

  - raw:
      - |
        POST /test HTTP/1.1
        Host: {{newHostname}}
        Connection: close
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_4) AppleWebKit/537.36 (KHTML, like Gecko)
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8
        Accept-Language: en-US,en;q=0.9
        Content-Type: application/x-www-form-urlencoded

        {{full_payload}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<{{xssProof}}>canary</{{xssProof}}>"

      - type: word
        part: header
        words:
          - "text/html"

    extractors:
      - type: regex
        part: body
        name: "xss_exploit_proof"
        regex:
          - "<{{xssProof}}>canary</{{xssProof}}>"
