id: ldap-metadata

info:
  name: LDAP Metadata - Enumeration
  author: pussycat0x,0x_Akoko
  severity: info
  description: |
    LDAP metadata refers to the data that describes the structure, schema, and attributes of the LDAP directory. Both plaintext LDAP and implicit-TLS LDAPS ports are covered.
  reference:
    - https://docs.projectdiscovery.io/templates/protocols/javascript/modules/ldap.Metadata
  metadata:
    max-request: 1
    shodan-query: ldap
  tags: js,network,ldap,discovery

javascript:
  - code: |
      const ldap = require('nuclei/ldap');

      // 636 and 3269 (AD global catalog) are implicit TLS. 389 and 3268 are
      // plaintext with an optional StartTLS upgrade, which cfg.Upgrade requests.
      const tlsPorts = ['636', '3269'];

      function tryPort(port) {
        const scheme = tlsPorts.indexOf(String(port)) !== -1 ? 'ldaps://' : 'ldap://';
        const cfg = new ldap.Config();
        // The module ignores Upgrade when the scheme is already ldaps.
        cfg.Upgrade = true;
        // Client(ldapUrl, Realm, {Config}) - the second argument is the realm,
        // and the config has to be passed as the third argument to take effect.
        const client = new ldap.Client(scheme + Host + ':' + port, Realm, cfg);
        return client.CollectMetadata();
      }

      // Honour the scanned port when there is one, otherwise cover the common pair.
      const ports = TargetPort ? [TargetPort] : ['389', '636'];

      for (let i = 0; i < ports.length; i++) {
        try {
          const metadata = tryPort(ports[i]);
          if (metadata) {
            Export(metadata);
            break;
          }
        } catch (e) {
          // port closed, wrong scheme, or bind refused - try the next one
        }
      }

    args:
      Host: "{{Host}}"
      TargetPort: "{{Port}}"
      Realm: "anonymous"

    matchers:
      - type: dsl
        dsl:
          - "success == true"
          - "len(DefaultNamingContext) != 0 || len(DnsHostName) != 0 || len(DomainFunctionality) != 0"
        condition: and

    extractors:
      - type: json
        internal: true
        name: DnsHostName
        json:
          - '.DnsHostName'

      - type: json
        internal: true
        name: DefaultNamingContext
        json:
          - '.DefaultNamingContext'

      - type: json
        internal: true
        name: DomainFunctionality
        json:
          - '.DomainFunctionality'

      - type: json
        json:
          - '"DnsHostName: " + .DnsHostName'
          - '"DefaultNamingContext: "+ .DefaultNamingContext'
          - '"DomainFunctionality: "+ .DomainFunctionality'
          - '"ForestFunctionality: " + .ForestFunctionality'
          - '"DomainControllerFunctionality: "+ .DomainControllerFunctionality'
