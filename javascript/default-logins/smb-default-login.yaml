id: smb-default-login

info:
  name: SMB - Default Logins
  author: pussycat0x
  severity: high
  description: |
    Attempts to guess username/password combinations over SMB.
  reference:
    - https://nmap.org/nsedoc/scripts/smb-brute.html
  metadata:
    verified: true
    max-request: 10
    shodan-query: "port:445"
  tags: js,network,smb,enum,default,bruteforce,discovery

flow: javascript(1) && javascript(2)

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/smb");
      var c = new m.SMBClient();
      var acceptsAnyLogin = true;
      try {
        c.ListShares(Host, Port, User, Pass);
      } catch (e) {
        acceptsAnyLogin = false;
      }
      !acceptsAnyLogin;

    args:
      Host: "{{Host}}"
      Port: "445"
      User: "{{randstr}}"
      Pass: "{{randstr}}"

    matchers:
      - type: dsl
        dsl:
          - 'success == true'
        internal: true

  - code: |
      var m = require("nuclei/smb");
      var c = new m.SMBClient();
      var response = c.ListShares(Host, Port, User, Pass);
      response;

    args:
      Host: "{{Host}}"
      Port: "445"
      User: "{{usernames}}"
      Pass: "{{passwords}}"

    attack: clusterbomb
    payloads:
      usernames:
        - 'admin'
        - 'administrator'
        - 'guest'
      passwords:
        - 'admin'
        - 'password'
        - 'guest'

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'success == true'
