id: smb-default-login

info:
  name: SMB - Default Logins
  author: pussycat0x
  severity: high
  description: |
    Attempts to guess username/password combinations over SMB.
  reference:
    - https://nmap.org/nsedoc/scripts/smb-brute.html
  metadata:
    verified: true
    max-request: 9
    shodan-query: "port:445"
  tags: js,network,smb,enum,default,bruteforce,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/smb");
      var c = new m.SMBClient();

      // Canary credential that cannot exist. Servers with "map to guest"
      // complete SESSION_SETUP for any username and always expose IPC$ to
      // enumeration, so a successful login alone proves nothing
      // (issue #17301). If the canary also authenticates AND enumerates,
      // every payload result here is guest noise and must not be reported.
      // Constant, not random: ListShares memoizes on
      // (executionId, host, port, user, password), so a fixed canary
      // costs one extra dial per host instead of one per payload pair.
      var CANARY = "nuclei-canary-4f8a2c91b7e6";
      var acceptsAnything = false;
      try {
        c.ListShares(Host, Port, CANARY, CANARY);
        acceptsAnything = true;
      } catch (e) {}

      if (acceptsAnything) {
        throw new Error("server authenticates any credential; the tested login was never validated");
      }

      var response = c.ListShares(Host, Port, User, Pass);
      response;

    args:
      Host: "{{Host}}"
      Port: "445"
      User: "{{usernames}}"
      Pass: "{{passwords}}"

    attack: clusterbomb
    payloads:
      usernames:
        - 'admin'
        - 'administrator'
        - 'guest'
      passwords:
        - 'admin'
        - 'password'
        - 'guest'

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'success == true'
        condition: and