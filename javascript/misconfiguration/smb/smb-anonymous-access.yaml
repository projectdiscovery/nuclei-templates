id: smb-anonymous-access

info:
  name: SMB Anonymous Access Detection
  author: pussycat0x,i-am-durga
  severity: high
  description: |
    Detects anonymous read access to SMB shares on a remote server by authenticating as guest and verifying directory listing.
  reference:
    - https://wadcoms.github.io/wadcoms/SMBClient-List-Shares-Anonymous/
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:445
    product: dionaea
    vendor: dionaea
  tags: js,network,smb,enum,misconfig,vuln
javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/smb");
      var c = m.SMBClient();
      var shares = c.ListShares(Host, Port, User, Pass);
      var accessibleShares = [];
      if (shares && shares.length > 0) {
        var ignoredShares = ["print$", "prnproc$"];
        for (var i = 0; i < shares.length; i++) {
          var s = shares[i];
          if (!s) continue;
          var lower = s.toLowerCase();
          if (ignoredShares.indexOf(lower) !== -1) continue;
          try {
            var entries = c.ListDir(Host, Port, User, Pass, s, ".");
            if (entries !== null && entries !== undefined) {
              accessibleShares.push(s);
            }
          } catch (e) {}
        }
      }
      Export(accessibleShares);

    args:
      Host: "{{Host}}"
      Port: "445"
      User: "guest"
      Pass: ""

    matchers:
      - type: dsl
        dsl:
          - success == true
          - len(response) > 0
        condition: and

    extractors:
      - type: json
        json:
          - '.[]'