id: k3s-certificate-detect

info:
  name: K3s Kubernetes - Detect
  author: nycolazsec
  severity: info
  description: |
    Detects a k3s Kubernetes node from the certificate its API server (6443) or kubelet (10250) presents. k3s issues them from its own certificate authority, named k3s-server-ca followed by the time it was created.
  reference:
    - https://docs.k3s.io/cli/certificate
  metadata:
    max-request: 1
    vendor: k3s
    product: k3s
    shodan-query: ssl:"k3s-server-ca"
  tags: ssl,tls,kubernetes,k3s,detect,discovery

ssl:
  - address: "{{Host}}:{{Port}}"
    matchers:
      - type: dsl
        dsl:
          - 'contains(issuer_cn, "k3s-server-ca@")'

    extractors:
      - type: dsl
        dsl:
          - '"Issuer: " + issuer_cn'
