id: traefik-default-certificate

info:
  name: Traefik Default Certificate - Detect
  author: nycolazsec
  severity: info
  description: |
    Traefik serves its self-signed "TRAEFIK DEFAULT CERT" when no configured certificate matches the requested host name. That is expected when the server is reached by IP address, and a misconfiguration when a domain name gets it.
  remediation: Configure a certificate for each domain (for example with Traefik's ACME resolver), or set a default certificate in Traefik's TLS store.
  reference:
    - https://doc.traefik.io/traefik/https/tls/
  metadata:
    max-request: 1
    vendor: traefik
    product: traefik
    shodan-query: ssl:"TRAEFIK DEFAULT CERT"
  tags: ssl,tls,traefik,self-signed,misconfig

ssl:
  - address: "{{Host}}:{{Port}}"
    matchers:
      - type: dsl
        dsl:
          - 'subject_cn == "TRAEFIK DEFAULT CERT"'
          - 'issuer_cn == "TRAEFIK DEFAULT CERT"'
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Subject: " + subject_cn'
