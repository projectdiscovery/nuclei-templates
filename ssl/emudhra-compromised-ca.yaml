id: emudhra-compromised-ca

info:
  name: eMudhra - Compromised Intermediate CA Certificate - Detection
  author: DhiyaneshDk
  severity: critical
  description: |
    Eight eMudhra intermediate CA private keys were compromised due to incorrect key generation, allowing anyone to recover them from the certificates. They chained to emSign Root TLS CA - G3, emSign Root CS CA - G3 and AAA Certificate Services (Sectigo cross-sign) roots trusted by Mozilla, Microsoft, Apple and Chrome root programs. The compromised intermediates were revoked on October 18-19, 2026 and blocked in Firefox, Chrome, Apple and Microsoft platforms.
  impact: |
    An attacker with the compromised private keys can issue fraudulent TLS certificates for any domain, enabling man-in-the-middle attacks, website impersonation and interception of encrypted traffic.
  remediation: |
    Replace any TLS certificates issued by the compromised eMudhra intermediate CAs with certificates from a different certificate authority. Update browsers, operating systems and trust stores to the latest versions that block the compromised intermediates.
  reference:
    - https://emudhra.we-have-a-problem.com/
    - https://emudhra.we-have-a-problem.com/impacted-intermediates.json
  classification:
    cwe-id: CWE-295
  metadata:
    verified: true
    max-request: 1
    vendor: emudhra
    product: emudhra
    shodan-query: ssl:"eMudhra"
    fofa-query: cert="eMudhra"
  tags: ssl,tls,emudhra,ca,certificate,misconfig

ssl:
  - address: "{{Host}}:{{Port}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(issuer_dn, "EM DV TLS CA - G3B", "EM DV TLS CA - G3C", "EM OV TLS CA - G3B", "EM OV TLS CA - G3C", "EM EV TLS CA - G3B", "EM EV TLS CA - G3C", "EM OV CS CA - G3B", "EM OV CS CA - G3C")'

    extractors:
      - type: dsl
        dsl:
          - issuer_cn
