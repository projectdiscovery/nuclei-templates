id: gost-ssh-detect

info:
  name: GO Simple Tunnel (GOST) SSH Listener - Detect
  author: darses
  severity: high
  description: |
    GO Simple Tunnel (GOST) SSH service was detected via unauthenticated 'none' authentication bypass and proprietary 'ping' global request or 'gost-tunnel' channel confirmation.
  reference:
    - https://github.com/go-gost/gost
    - https://gost.run
  metadata:
    verified: true
    max-requests: 2
    vendor: gost
    product: gost
    shodan-query:
      - product:"Go SSH"
  tags: network,tcp,code,ssh,proxy,tunnel,c2,gost,detect

flow: tcp(1) && code(1)

tcp:
  - inputs:
      - data: "SSH-2.0-Nuclei\r\n"
        read: 20

    host:
      - "{{Hostname}}"
    port: 22, 443, 2222

    matchers:
      - type: word
        part: raw
        words:
          - "SSH-2.0-Go"
        internal: true

code:
  - engine:
      - py
      - python3

    source: |
      import os, socket, sys, logging
      logging.getLogger("paramiko").setLevel(logging.CRITICAL)

      host = os.getenv("Host", "").strip("[]")
      port = int(os.getenv("Port") or 22)
      mode = "unknown"

      try:
          import paramiko
          sock = socket.create_connection((host, port), timeout=5.0)

          t = paramiko.Transport(sock)
          t.banner_timeout = 5.0
          t.start_client(timeout=5.0)

          # Test None authentication
          try:
              t.auth_none("root")
          except Exception:
              pass

          if t.is_authenticated():
              # Probe 1: Ping global request (GOST v2/v3 heartbeat)
              try:
                  ping_res = t.global_request("ping", wait=True)
                  if ping_res is not None:
                      mode = "tunnel"
              except Exception:
                  pass

              # Probe 2: Proprietary 'gost-tunnel' channel (SSHTunnelListener)
              if mode == "unknown":
                  try:
                      chan = t.open_channel("gost-tunnel", timeout=3.0)
                      if chan is not None:
                          mode = "tunnel"
                          chan.close()
                  except Exception:
                      pass

              # Probe 3: 'direct-tcpip' channel (SSHForwardHandler / forward+ssh)
              if mode == "unknown":
                  try:
                      chan_tcp = t.open_channel("direct-tcpip", dest_addr=("127.0.0.1", 80), src_addr=("127.0.0.1", 12345), timeout=3.0)
                      if chan_tcp is not None:
                          mode = "forward+ssh"
                          chan_tcp.close()
                  except Exception:
                      pass

          t.close()
      except Exception:
          pass

      if mode != "unknown":
          print(mode)

    matchers:
      - type: word
        words:
          - "tunnel"
          - "forward+ssh"
        condition: or

    extractors:
      - type: regex
        regex:
          - "^(tunnel|forward\\+ssh)$"
