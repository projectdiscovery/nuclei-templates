id: generic-tcp-bind-c2

info:
  name: Unauthenticated TCP Bind Shell / C2 Listener - Detect
  author: Pratham Pawar
  severity: high
  description: Detects an open, unauthenticated TCP bind shell or basic C2 listener by sending a raw hex payload and matching the expected command-line prompt response.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10.0
  metadata:
    verified: true
    max-request: 1
  tags: network,c2,shell,misconfig,detect

network:
  - inputs:
      - data: "0a"
        type: hex

    host:
      - "{{Hostname}}"

    read-size: 1024

    matchers-condition: or
    matchers:
      - type: word
        part: data
        words:
          - "uid="
          - "gid="
          - "root@"
          - "C:\\Windows\\system32"
        condition: or

      - type: word
        part: data
        encoding: hex
        words:
          - "2420"
          - "2320"
          - "3e20"
        condition: or
