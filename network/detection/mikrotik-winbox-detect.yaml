id: mikrotik-winbox-detect

info:
  name: MikroTik RouterOS Winbox - Detect
  author: cham423
  severity: info
  description: |
    MikroTik RouterOS Winbox was detected. The Winbox service on TCP 8291 answers an unauthenticated plugin-manifest request that discloses the RouterOS version and installed package versions.
  reference:
    - https://help.mikrotik.com/docs/display/ROS/WinBox
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:8291
  tags: network,mikrotik,winbox,routeros,detect,detection,tcp,discovery

tcp:
  - inputs:
      - data: "1302696e64657800000000000000ffed0000000000"
        type: hex

    host:
      - "{{Hostname}}"
    port: 8291
    read-size: 2048

    matchers:
      - type: word
        words:
          - "roteros.dll"
          - "system.dll"
        condition: and

    extractors:
      - type: regex
        group: 1
        regex:
          - 'roteros\.dll (\d+\.\d+\.\d+)'
