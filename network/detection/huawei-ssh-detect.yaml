id: huawei-ssh-detect

info:
  name: Huawei SSH Service - Detect
  author: johnk3r
  severity: info
  description: |
    Huawei SSH service was detected.
  metadata:
    verified: true
    max-request: 1
    shodan-query: "SSH-2.0-HUAWEI"
  tags: seclists,network,ssh,detect,detection,tcp,discovery

tcp:
  - host:
      - "{{Hostname}}"
    port: 22

    matchers:
      - type: regex
        regex:
          - '(?i)SSH-2.0-HUAWEI'

    extractors:
      - type: regex
        regex:
          - '(?i)SSH-(.*)-HUAWEI-[^\r]+'
