id: modbus-detect

info:
  name: Modbus TCP Service Detection
  author: K3ysTr0K3R
  severity: info
  description: |
    Detects Modbus TCP services by sending a read-only
    Read Holding Registers request to TCP port 502.
  metadata:
    verified: true
  tags: modbus,scada,ics,ot,network,tcp

tcp:
  - inputs:
      - data: "000100000006010300000001"
        type: hex

    host:
      - "{{Hostname}}"
    port: 502

    read-size: 1024

    matchers:
      - type: binary
        binary:
          - "000100000005010302"
        condition: and

      - type: binary
        binary:
          - "000100"
        condition: and
