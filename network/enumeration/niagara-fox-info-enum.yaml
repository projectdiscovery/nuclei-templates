id: niagara-fox-info-enum

info:
  name: Niagara Fox Protocol Information Enumeration
  author: pussycat0x
  severity: info
  description: |
    Niagara Fox Protocol is a building automation protocol used between the Niagara software systems by Tridium. Detects both plaintext Fox (1911) and Fox over TLS (FoxS, 4911).
  reference:
    - https://nmap.org/nsedoc/scripts/fox-info.html
  metadata:
    verified: true
    max-request: 2
    shodan-query: product:"Niagara Fox"
  tags: network,fox,niagara,enum,tcp,tls,discovery

tcp:
  - inputs:
      - data: "fox a 1 -1 fox hello\n{\nfox.version=s:1.0\nid=i:1\n};;\n"
    host:
      - "{{Hostname}}"
    port: 1911
    read-size: 1024

    matchers:
      - type: word
        words:
          - "fox.version=s:"
          - "app.name=s:"
        condition: and

    extractors:
      - type: regex
        regex:
          - 'fox\.version=s:([\w.]+)'
          - 'hostName=s:([\w.-]+)'
          - 'hostAddress=s:([\w.:-]+)'
          - 'station\.name=s:([\w .-]+)'
          - 'app\.name=s:([\w .-]+)'
          - 'app\.version=s:([\w.-]+)'
          - 'vm\.name=s:([\w .()-]+)'
          - 'vm\.version=s:([\w.-]+)'
          - 'os\.name=s:([\w .-]+)'
          - 'os\.version=s:([\w.-]+)'
          - 'brandId=s:([\w.-]+)'

  - inputs:
      - data: "fox a 1 -1 fox hello\n{\nfox.version=s:1.0\nid=i:1\n};;\n"
    host:
      - "tls://{{Hostname}}"
    port: 4911
    read-size: 1024

    matchers:
      - type: word
        words:
          - "fox.version=s:"
          - "app.name=s:"
        condition: and

    extractors:
      - type: regex
        regex:
          - 'fox\.version=s:([\w.]+)'
          - 'hostName=s:([\w.-]+)'
          - 'hostAddress=s:([\w.:-]+)'
          - 'station\.name=s:([\w .-]+)'
          - 'app\.name=s:([\w .-]+)'
          - 'app\.version=s:([\w.-]+)'
          - 'vm\.name=s:([\w .()-]+)'
          - 'vm\.version=s:([\w.-]+)'
          - 'os\.name=s:([\w .-]+)'
          - 'os\.version=s:([\w.-]+)'
          - 'brandId=s:([\w.-]+)'
